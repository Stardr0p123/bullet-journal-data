    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  配置 & 常量
            // ================================================================
            const STORAGE_KEY = 'luogu_problem_lists_v10';
            const GITHUB_SETTINGS_KEY = 'github_settings_problem_lists';
            const THEME_STORAGE_KEY = 'theme_preference';

            const DIFF_NAMES = {
                0: '暂无', 1: '入门', 2: '普及-', 3: '普及', 4: '普及+/提高-',
                5: '提高', 6: '提高+/省选-', 7: '省选/NOI-', 8: 'NOI/NOI+/CTS'
            };

            const STATUS_ORDER = ['pending', 'solution', 'hint', 'ai', 'independent'];
            const STATUS_MAP = {
                'pending': '尚未完成',
                'solution': '看了题解',
                'hint': '看了提示',
                'ai': '辅助调试',
                'independent': '独立完成'
            };
            const STATUS_CLASS = {
                'pending': 'status-pending',
                'solution': 'status-solution',
                'hint': 'status-hint',
                'ai': 'status-ai',
                'independent': 'status-independent'
            };
            const STATUS_ICON = {
                'pending': 'fa-circle',
                'solution': 'fa-check-circle',
                'hint': 'fa-check-circle',
                'ai': 'fa-check-circle',
                'independent': 'fa-check-circle'
            };

            function getStatusLabel(s) { return STATUS_MAP[s] || s; }

            function getStatusClass(s) { return STATUS_CLASS[s] || 'status-pending'; }

            function getStatusIcon(s) { return STATUS_ICON[s] || 'fa-check-circle'; }

            // ================================================================
            //  数据层
            // ================================================================
            let data = { lists: {}, currentList: null };
            let confirmCallback = null;
            let batchParsedData = [];
            let renamingList = null;
            let githubPanelOpen = false;
            let selectedProblems = new Set();
            let multiSelectMode = false;
            let editingProblemPid = null;
            let randomScope = 'global';
            let currentViewMode = 'all';

            // ================================================================
            //  工具函数
            // ================================================================
            function escapeHtml(str) {
                if (!str) return '';
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.textContent = msg;
                container.appendChild(t);
                requestAnimationFrame(() => { t.classList.add('show'); });
                setTimeout(() => {
                    t.classList.remove('show');
                    t.classList.add('hide');
                    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
                }, 2200);
            }

            function fmtDate(d) {
                let dt = new Date(d);
                if (isNaN(dt)) dt = new Date();
                return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
            }

            function sortLists() { return Object.keys(data.lists).sort((a, b) => a.localeCompare(b)); }

            function getCurrentListName() { return data.currentList || null; }

            // 获取当前题单的所有题目（未过滤）
            function getCurrentProblems() {
                const name = getCurrentListName();
                if (!name || !data.lists[name]) return [];
                return data.lists[name] || [];
            }

            // 获取当前视图下过滤后的题目列表
            function getFilteredProblems() {
                const all = getCurrentProblems();
                if (currentViewMode === 'pending') {
                    return all.filter(p => p.status === 'pending');
                } else if (currentViewMode === 'done') {
                    return all.filter(p => p.status !== 'pending');
                }
                return all;
            }

            function clearSelected() { selectedProblems.clear();
                updateSelectedUI(); }

            function updateSelectedUI() {
                const count = selectedProblems.size;
                const el = document.getElementById('selectedCount');
                if (el) el.textContent = '已选 ' + count + ' 题';
                const allCheckbox = document.getElementById('selectAllCheckbox');
                if (allCheckbox) {
                    const filtered = getFilteredProblems();
                    const total = filtered.length;
                    if (total === 0) { allCheckbox.checked = false;
                        allCheckbox.indeterminate = false; } else if (count === total) { allCheckbox.checked = true;
                        allCheckbox.indeterminate = false; } else if (count > 0) { allCheckbox.checked = false;
                        allCheckbox.indeterminate = true; } else { allCheckbox.checked = false;
                        allCheckbox.indeterminate = false; }
                }
                const hasSelected = count > 0 && multiSelectMode;
                document.querySelectorAll('.toolbar-right .btn-sm').forEach(b => { b.disabled = !hasSelected; });
                document.querySelector('.toolbar-right .move-select').disabled = !hasSelected;
                updateMoveTargets();
            }

            function updateMoveTargets() {
                const sel = document.getElementById('moveTargetList');
                if (!sel) return;
                const current = getCurrentListName();
                const allLists = sortLists();
                const hasOther = allLists.some(name => name !== current);
                const hasSelected = selectedProblems.size > 0 && multiSelectMode;
                sel.innerHTML = '';
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = hasOther ? '选择目标' : '无其他题单';
                sel.appendChild(defaultOpt);
                if (hasOther) {
                    for (const name of allLists) {
                        if (name === current) continue;
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name + ' (' + (data.lists[name] ? data.lists[name].length : 0) + '题)';
                        sel.appendChild(opt);
                    }
                }
                sel.disabled = !hasOther || !hasSelected;
                if (!hasSelected) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '请先选中题目';
                    sel.innerHTML = '';
                    sel.appendChild(opt);
                    sel.disabled = true;
                }
            }

            // ================================================================
            //  多选模式 (无刷新切换)
            // ================================================================
            function toggleMultiSelect() {
                multiSelectMode = !multiSelectMode;
                const toolbar = document.getElementById('problemToolbar');
                const btn = document.getElementById('toggleMultiSelectBtn');
                const problemList = document.getElementById('problemList');

                if (multiSelectMode) {
                    toolbar.classList.add('multi-select-active');
                    problemList.classList.add('multi-select-active');
                    btn.innerHTML = '<i class="fas fa-times"></i> 取消多选';
                    btn.classList.add('danger');
                    btn.classList.remove('ghost');
                    clearSelected();
                } else {
                    toolbar.classList.remove('multi-select-active');
                    problemList.classList.remove('multi-select-active');
                    btn.innerHTML = '<i class="fas fa-check-square"></i> 多选';
                    btn.classList.remove('danger');
                    btn.classList.add('ghost');
                    clearSelected();
                }
                updateSelectedUI();
                updateMoveTargets();
            }

            function disableMultiSelect() {
                if (multiSelectMode) {
                    multiSelectMode = false;
                    const toolbar = document.getElementById('problemToolbar');
                    const btn = document.getElementById('toggleMultiSelectBtn');
                    const problemList = document.getElementById('problemList');
                    if (toolbar) toolbar.classList.remove('multi-select-active');
                    if (problemList) problemList.classList.remove('multi-select-active');
                    if (btn) { btn.innerHTML = '<i class="fas fa-check-square"></i> 多选';
                        btn.classList.remove('danger');
                        btn.classList.add('ghost'); }
                    clearSelected();
                    updateSelectedUI();
                    updateMoveTargets();
                }
            }

            function toggleSelectProblem(pid) {
                if (!multiSelectMode) return;
                if (selectedProblems.has(pid)) selectedProblems.delete(pid);
                else selectedProblems.add(pid);
                updateSelectedUI();
                const checkbox = document.querySelector(`.custom-checkbox[data-pid="${CSS.escape(pid)}"]`);
                if (checkbox) checkbox.checked = selectedProblems.has(pid);
            }

            function toggleSelectAll() {
                if (!multiSelectMode) { toggleMultiSelect();
                    setTimeout(() => { const cb = document.getElementById('selectAllCheckbox'); if (cb) { cb
                            .checked = true;
                            _doSelectAll(true); } }, 50); return; }
                const allCheckbox = document.getElementById('selectAllCheckbox');
                if (!allCheckbox) return;
                _doSelectAll(allCheckbox.checked);
            }

            function _doSelectAll(select) {
                const filtered = getFilteredProblems();
                if (select) {
                    for (const p of filtered) selectedProblems.add(p.pid);
                } else {
                    for (const p of filtered) selectedProblems.delete(p.pid);
                }
                document.querySelectorAll('.custom-checkbox').forEach(cb => {
                    const pid = cb.dataset.pid;
                    cb.checked = selectedProblems.has(pid);
                });
                updateSelectedUI();
            }

            function openSelectedProblems() {
                if (!multiSelectMode) { showToast('请先点击「多选」进入多选模式', 'warning'); return; }
                const problems = getCurrentProblems();
                const selected = problems.filter(p => selectedProblems.has(p.pid));
                if (selected.length === 0) { showToast('请先选中题目', 'warning'); return; }
                let opened = 0;
                for (let i = 0; i < selected.length; i++) {
                    const url = getProblemUrl(selected[i].pid);
                    if (url && url !== '#') { setTimeout(() => { window.open(url, '_blank'); }, i * 20);
                        opened++; }
                }
                showToast('正在打开 ' + opened + ' 个页面', 'success');
            }

            function batchSetDifficultyString() {
                if (!multiSelectMode) { showToast('请先点击「多选」进入多选模式', 'warning'); return; }
                const problems = getCurrentProblems();
                const selected = problems.filter(p => selectedProblems.has(p.pid));
                if (selected.length === 0) { showToast('请先选中题目', 'warning'); return; }
                const input = document.getElementById('batchDiffString');
                const str = input.value.trim();
                if (!str) { showToast('请输入数字串，如 55555', 'warning'); return; }
                const digits = str.split('').map(Number);
                if (digits.some(d => isNaN(d) || d < 0 || d > 8)) {
                    showToast('数字串只能包含 0-8', 'warning');
                    return;
                }
                if (digits.length < selected.length) {
                    showToast('数字串长度 (' + digits.length + ') 小于选中题目数 (' + selected.length + ')', 'warning');
                    return;
                }
                for (let i = 0; i < selected.length; i++) {
                    selected[i].difficulty = digits[i] || 0;
                }
                saveData();
                renderAll();
                input.value = '';
                showToast('已用数字串为 ' + selected.length + ' 题填充难度', 'success');
            }

            function exportSelected() {
                if (!multiSelectMode) { showToast('请先点击「多选」进入多选模式', 'warning'); return; }
                const problems = getCurrentProblems();
                const selected = problems.filter(p => selectedProblems.has(p.pid));
                if (selected.length === 0) { showToast('请先选中题目', 'warning'); return; }
                const lines = selected.map(p => p.pid + '\t' + p.name);
                const content = lines.join('\n');
                const blob = new Blob(['\uFEFF' + content], { type: 'text/tab-separated-values;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (getCurrentListName() || '题单') + '_导出_' + fmtDate(new Date()) + '.tsv';
                a.click();
                URL.revokeObjectURL(url);
                showToast('已导出 ' + selected.length + ' 题', 'success');
            }

            function deleteSelected() {
                if (!multiSelectMode) { showToast('请先点击「多选」进入多选模式', 'warning'); return; }
                const problems = getCurrentProblems();
                const selected = problems.filter(p => selectedProblems.has(p.pid));
                if (selected.length === 0) { showToast('请先选中题目', 'warning'); return; }
                const names = selected.map(p => p.pid + ' ' + p.name).join('、');
                const preview = names.length > 80 ? names.slice(0, 80) + '…' : names;
                showConfirm('批量删除题目', '确定删除选中的 <strong>' + selected.length + '</strong> 题？<br><span style="font-size:12px;color:var(--text-muted);">' +
                    escapeHtml(preview) + '</span>', () => {
                    const listName = getCurrentListName();
                    if (!listName) return;
                    const allProblems = data.lists[listName];
                    const toDelete = new Set(selectedProblems);
                    data.lists[listName] = allProblems.filter(p => !toDelete.has(p.pid));
                    clearSelected();
                    saveData();
                    renderAll();
                    showToast('已删除 ' + selected.length + ' 题', 'info');
                });
            }

            function moveSelected() {
                if (!multiSelectMode) { showToast('请先点击「多选」进入多选模式', 'warning'); return; }
                const problems = getCurrentProblems();
                const selected = problems.filter(p => selectedProblems.has(p.pid));
                if (selected.length === 0) { showToast('请先选中题目', 'warning'); return; }
                const targetSelect = document.getElementById('moveTargetList');
                const targetName = targetSelect.value;
                if (!targetName) { showToast('请选择目标题单', 'warning'); return; }
                if (targetName === getCurrentListName()) { showToast('不能移动到同一个题单', 'warning'); return; }
                if (!data.lists[targetName]) { showToast('目标题单不存在', 'warning'); return; }
                const names = selected.map(p => p.pid + ' ' + p.name).join('、');
                const preview = names.length > 80 ? names.slice(0, 80) + '…' : names;
                showConfirm('批量移动到题单', '将选中的 <strong>' + selected.length + '</strong> 题移动到「' + escapeHtml(targetName) +
                    '」？<br><span style="font-size:12px;color:var(--text-muted);">' + escapeHtml(preview) + '</span>',
                    () => {
                        const listName = getCurrentListName();
                        if (!listName) return;
                        const allProblems = data.lists[listName];
                        const toMove = new Set(selectedProblems);
                        data.lists[listName] = allProblems.filter(p => !toMove.has(p.pid));
                        const targetProblems = data.lists[targetName];
                        for (const p of selected) {
                            if (!targetProblems.some(t => t.pid === p.pid)) {
                                targetProblems.push({ ...p, expanded: false });
                            }
                        }
                        clearSelected();
                        saveData();
                        renderAll();
                        showToast('已移动 ' + selected.length + ' 题到「' + targetName + '」', 'success');
                    });
            }

            // ================================================================
            //  OJ 链接生成
            // ================================================================
            function getProblemUrl(pid) {
                if (!pid) return '#';
                const p = pid.trim();
                if (p.startsWith('AT_')) return 'https://www.luogu.com.cn/problem/' + p;
                if (p.startsWith('CF') && !p.startsWith('GYM')) return 'https://www.luogu.com.cn/problem/' + p;
                const lm = p.match(/^P(\d+)$/i);
                if (lm) return 'https://www.luogu.com.cn/problem/P' + lm[1];
                const gm = p.match(/^GYM(\d+)([A-Z])$/i);
                if (gm) return 'https://codeforces.com/gym/' + gm[1] + '/problem/' + gm[2].toUpperCase();
                const gm2 = p.match(/^GYM(\d+)$/i);
                if (gm2) return 'https://codeforces.com/gym/' + gm2[1];
                const at1 = p.match(/^(ARC|AGC|ABC|APC)(\d+)([A-Z])$/i);
                if (at1) return 'https://atcoder.jp/contests/' + at1[1].toLowerCase() + at1[2] + '/tasks/' + at1[1]
                    .toLowerCase() + at1[2] + '_' + at1[3].toLowerCase();
                const at2 = p.match(/^(ARC|AGC|ABC|APC)(\d+)$/i);
                if (at2) return 'https://atcoder.jp/contests/' + at2[1].toLowerCase() + at2[2];
                const poj = p.match(/^POJ(\d+)$/i);
                if (poj) return 'http://poj.org/problem?id=' + poj[1];
                const uoj = p.match(/^UOJ(\d+)$/i);
                if (uoj) return 'https://uoj.ac/problem/' + uoj[1];
                const qoj = p.match(/^QOJ(\d+)$/i);
                if (qoj) return 'https://qoj.ac/problem/' + qoj[1];
                const loj = p.match(/^LOJ(\d+)$/i);
                if (loj) return 'https://loj.ac/p/' + loj[1];
                const spoj = p.match(/^SPOJ(\w+)$/i);
                if (spoj) return 'https://www.spoj.com/problems/' + spoj[1].toUpperCase() + '/';
                const hdu = p.match(/^HDU(\d+)$/i);
                if (hdu) return 'https://acm.hdu.edu.cn/showproblem.php?pid=' + hdu[1];
                const nc = p.match(/^NC(\d+)$/i);
                if (nc) return 'https://ac.nowcoder.com/acm/problem/' + nc[1];
                return 'https://www.luogu.com.cn/problem/list?keyword=' + encodeURIComponent(p);
            }

            function getOJSource(pid) {
                if (!pid) return '?';
                const p = pid.trim();
                if (p.startsWith('AT_')) return '洛谷(AT)';
                if (/^P\d+$/i.test(p)) return '洛谷';
                if (p.startsWith('CF') && !p.startsWith('GYM')) return '洛谷(CF)';
                if (p.startsWith('GYM')) return 'GYM';
                if (/^(ARC|AGC|ABC|APC)/i.test(p)) return 'AtCoder';
                if (/^POJ/i.test(p)) return 'POJ';
                if (/^UOJ/i.test(p)) return 'UOJ';
                if (/^QOJ/i.test(p)) return 'QOJ';
                if (/^LOJ/i.test(p)) return 'LOJ';
                if (/^SPOJ/i.test(p)) return 'SPOJ';
                if (/^HDU/i.test(p)) return 'HDU';
                if (/^NC/i.test(p) || p.includes('牛客')) return '牛客';
                return '?';
            }

            function utf8ToBase64(str) {
                const data = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            }

            async function uploadToGit() {
                const s = getGitHubSettings();
                if (!s.username || !s.repo || !s.token) { showToast('请填写完整的 GitHub 信息', 'warning'); return; }
                saveGitHubSettings();
                if (!confirm('确定上传到 ' + s.username + '/' + s.repo + ' 的 /data/problem_lists.json 吗？')) return;
                const apiUrl = 'https://api.github.com/repos/' + s.username + '/' + s.repo +
                    '/contents/data/problem_lists.json';
                const contentBase64 = utf8ToBase64(JSON.stringify(getFullData(), null, 2));
                try {
                    let sha = null;
                    try {
                        const getResp = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + s.token,
                                'Accept': 'application/vnd.github.v3+json' } });
                        if (getResp.ok) { const d = await getResp.json();
                            sha = d.sha; } else if (getResp.status !== 404) { throw new Error('获取文件信息失败'); }
                    } catch (e) { if (e.message && e.message.includes('404')) {} else throw e; }
                    const putResp = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: { 'Authorization': 'token ' + s.token, 'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: '更新题单数据 ' + new Date().toISOString(), content: contentBase64,
                            sha: sha || undefined })
                    });
                    if (!putResp.ok) { const err = await putResp.json(); throw new Error(err.message || '上传失败'); }
                    showToast('数据已上传至 GitHub', 'success');
                } catch (error) { console.error(error);
                    showToast('上传失败: ' + error.message, 'error'); }
            }

                const s = getGitHubSettings();
                if (!s.username || !s.repo || !s.token) { showToast('请填写完整的 GitHub 信息', 'warning'); return; }
                saveGitHubSettings();
                if (!confirm('从 ' + s.username + '/' + s.repo + ' 导入数据？\n将替换当前所有本地数据！')) return;
                const apiUrl = 'https://api.github.com/repos/' + s.username + '/' + s.repo +
                    '/contents/data/problem_lists.json';
                try {
                    const resp = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + s.token,
                            'Accept': 'application/vnd.github.v3+json' } });
                    if (!resp.ok) { if (resp.status === 404) throw new Error('远程文件不存在，请先上传');
                        throw new Error('获取失败'); }
                    const respData = await resp.json();
                    const imported = JSON.parse(base64ToUtf8(respData.content));
                    if (!imported.lists || typeof imported.lists !== 'object') throw new Error('数据格式错误');
                    loadFullData(imported);
                    showToast('从 GitHub 导入成功', 'success');

            function isOldFormat(lists) {
                for (const name in lists) {
                    const problems = lists[name];
                    if (Array.isArray(problems) && problems.length > 0) {
                        const first = problems[0];
                        if (first && typeof first === 'object' && !('status' in first)) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function migrateProblem(p) {
                return {
                    pid: p.pid || '',
                    name: p.name || '',
                    difficulty: (p.difficulty !== undefined && p.difficulty !== null) ? Number(p.difficulty) : 0,
                    status: p.done ? 'independent' : 'pending',
                    think: p.think || 5,
                    code: p.code || 5,
                    quality: p.quality || 8,
                    feel: p.feel || 5,
                    tags: Array.isArray(p.tags) ? p.tags : [],
                    date: p.date || fmtDate(new Date()),
                    expanded: p.expanded || false,
                };
            }

            function migrateData(oldData) {
                const newLists = {};
                for (const name in oldData.lists) {
                    const problems = oldData.lists[name];
                    if (Array.isArray(problems)) {
                        newLists[name] = problems.map(migrateProblem);
                    } else {
                        newLists[name] = [];
                    }
                }
                return { lists: newLists, currentList: oldData.currentList || null };
            }

                                data.lists = migrated.lists;
                                data.currentList = migrated.currentList || (Object.keys(migrated.lists).length > 0 ?
                                    Object.keys(migrated.lists)[0] : null);
                            } else {
                                data.lists = parsed.lists;
                                data.currentList = parsed.currentList || (Object.keys(parsed.lists).length > 0 ? Object
                                    .keys(parsed.lists)[0] : null);
                            }
                        }
                    }
                } catch (e) { console.warn('Load data error', e); }

                if (Object.keys(data.lists).length === 0) {

            function setupPasteParser() {
                const pidInput = document.getElementById('problemPidInput');
                const nameInput = document.getElementById('problemNameInput');
                pidInput.addEventListener('paste', function(e) {
                    const pasted = (e.clipboardData || window.clipboardData).getData('text');
                    if (!pasted) return;
                    if (pasted.includes('\n')) return;
                    let pid = '',
                        name = '';
                    if (pasted.includes('\t')) {
                        const parts = pasted.split('\t');
                        pid = parts[0].trim();
                        name = parts.slice(1).join(' ').trim();
                    } else if (pasted.includes(' ')) {
                        const idx = pasted.indexOf(' ');
                        pid = pasted.slice(0, idx).trim();
                        name = pasted.slice(idx + 1).trim();
                    }
                    if (pid && name) {
                        e.preventDefault();
                        pidInput.value = pid;
                        nameInput.value = name;
                        nameInput.focus();
                        showToast('已解析：题号「' + pid + '」，名称「' + name + '」', 'success');
                    }
                });
            }

                    const oa = getOJSource(a.pid);
                    const ob = getOJSource(b.pid);
                    if (oa !== ob) return oa.localeCompare(ob);
                    return a.pid.localeCompare(b.pid);

                saveData();
                renderAll();
                showToast('已按 OJ 排序', 'info');

                const listName = getCurrentListName();
                if (!listName) return;
                const problems = data.lists[listName];
                problems.sort((a, b) => {
                    if (a.difficulty !== b.difficulty) return a.difficulty - b.difficulty;
                    return a.pid.localeCompare(b.pid);
                });
                saveData();
                renderAll();
                showToast('已按难度排序', 'info');
            }

            // ---- 拖拽 ----
            let dragItem = null;

            function handleDragStart(e) {
                const item = e.target.closest('.problem-item');
                if (!item) return;
                dragItem = item;
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.dataset.pid);
            }

            function handleDragEnd(e) {
                const item = e.target.closest('.problem-item');
                if (item) item.classList.remove('dragging');
                document.querySelectorAll('.problem-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                dragItem = null;
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.target.closest('.problem-item');
                if (!target || target === dragItem) return;
                document.querySelectorAll('.problem-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                target.classList.add('drag-over');
            }

            function handleDragLeave(e) {
                const target = e.target.closest('.problem-item');
                if (target) target.classList.remove('drag-over');
            }

            function handleDrop(e) {
                e.preventDefault();
                const target = e.target.closest('.problem-item');
                if (!target || !dragItem || target === dragItem) { document.querySelectorAll('.problem-item.drag-over')
                        .forEach(el => el.classList.remove('drag-over')); return; }
                const listName = getCurrentListName();
                if (!listName) return;
                const problems = data.lists[listName];
                const fromPid = dragItem.dataset.pid;
                const toPid = target.dataset.pid;
                const fromIdx = problems.findIndex(p => p.pid === fromPid);
                const toIdx = problems.findIndex(p => p.pid === toPid);
                if (fromIdx === -1 || toIdx === -1) return;
                const [moved] = problems.splice(fromIdx, 1);
                problems.splice(toIdx, 0, moved);
                document.querySelectorAll('.problem-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                dragItem.classList.remove('dragging');
                saveData();
                renderAll();
                showToast('已调整顺序', 'info');
            }

            // ================================================================
            //  批量导入
            // ================================================================
            function openBatchImport() {
                const listName = getCurrentListName();
                if (!listName) { showToast('请先选择题单', 'warning'); return; }
                document.getElementById('batchInput').value = '';
                document.getElementById('batchPreview').innerHTML = '';
                document.getElementById('batchStats').textContent = '已解析 0 条';
                batchParsedData = [];
                document.getElementById('batchModal').classList.add('show');
                setTimeout(() => document.getElementById('batchInput').focus(), 200);
            }

            function parseBatch() {
                const text = document.getElementById('batchInput').value;
                const lines = text.split('\n').filter(line => line.trim() !== '');
                const result = [];
                for (const line of lines) {
                    let parts = line.split('\t');
                    if (parts.length === 2) { result.push({ pid: parts[0].trim().toUpperCase(), name: parts[1].trim() });
                        continue; }
                    const match = line.match(/^(\S+)\s+(.+)$/);
                    if (match) { result.push({ pid: match[1].trim().toUpperCase(), name: match[2].trim() });
                        continue; }
                    if (parts.length === 1 && parts[0].trim()) { result.push({ pid: parts[0].trim().toUpperCase(),
                            name: '' }); }
                }
                batchParsedData = result;
                document.getElementById('batchStats').textContent = '已解析 ' + result.length + ' 条';
                const preview = document.getElementById('batchPreview');
                if (result.length === 0) { preview.innerHTML =
                        '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">没有解析到有效数据</div>'; return; }
                preview.innerHTML = result.map((item) =>
                    '<div class="preview-item"><span class="p-pid">' + escapeHtml(item.pid) +
                    '</span><span class="p-name">' + escapeHtml(item.name || '未知题目') +
                    '</span><span style="font-size:11px;color:var(--text-muted);flex-shrink:0;">' + escapeHtml(
                        getOJSource(item.pid)) + '</span></div>'
                ).join('');
            }

            function confirmBatchImport() {
                if (batchParsedData.length === 0) { showToast('请先粘贴数据并解析', 'warning'); return; }
                const listName = getCurrentListName();
                if (!listName) { showToast('请先选择题单', 'warning'); return; }
                const problems = data.lists[listName];
                let added = 0,
                    skipped = 0;
                const now = fmtDate(new Date());
                for (const item of batchParsedData) {
                    if (!item.pid) { skipped++; continue; }
                    if (problems.some(p => p.pid === item.pid)) { skipped++; continue; }
                    problems.push({ pid: item.pid, name: item.name || '未知题目', difficulty: 0, status: 'pending',
                        think: 5, code: 5, quality: 8, feel: 5, tags: [], date: now, expanded: false });
                    added++;
                }
                disableMultiSelect();
                clearSelected();
                saveData();
                renderAll();
                closeModal('batchModal');
                showToast('成功导入 ' + added + ' 题' + (skipped > 0 ? '，' + skipped + ' 条跳过' : ''), 'success');
            }

            // ================================================================

            // ================================================================
            function exportData() {
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '题单_' + fmtDate(new Date()) + '.json';
                a.click();
                URL.revokeObjectURL(url);

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.lists || typeof imported.lists !== 'object') throw new Error('格式错误');
                        let finalData = imported;
                        if (isOldFormat(imported.lists)) {
                            if (confirm('检测到旧版数据格式，是否自动迁移？')) {
                                finalData = migrateData(imported);
                                showToast('数据已迁移', 'info');
                            } else {
                                showToast('导入已取消', 'warning');
                                return;
                            }
                        }
                        data.lists = finalData.lists;
                        data.currentList = finalData.currentList || (Object.keys(data.lists).length > 0 ? Object.keys(
                            data.lists)[0] : null);
                        disableMultiSelect();
                        clearSelected();
                        saveData();
                        renderAll();
                        showToast('成功导入', 'success');
                    } catch (err) { showToast('导入失败：' + err.message, 'warning'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ================================================================
            //  统计面板
            // ================================================================
            function renderStatsPanel() {
                const allProblems = [];
                for (const listName in data.lists) {
                    for (const p of data.lists[listName]) {
                        allProblems.push(p);
                    }
                }
                const total = allProblems.length;
                const done = allProblems.filter(p => p.status !== 'pending').length;
                document.getElementById('statsTotal').textContent = total;
                document.getElementById('statsDone').textContent = done;

                const doneProblems = allProblems.filter(p => p.status !== 'pending');
                const dates = [];
                for (let i = 6; i >= 0; i--) { const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(fmtDate(d)); }
                const counts = dates.map(d => doneProblems.filter(p => p.date === d).length);
                const heatColors = ['#e8ecf0', '#d0d8e0', '#b0c4d4', '#8aaccc', '#6a8aaa', '#4a6a8a', '#3a5a7a', '#2a4a6a'];
                let cells = '',
                    labels = '';
                dates.forEach((d, i) => {
                    const cnt = counts[i];
                    const colorIdx = Math.min(cnt, heatColors.length - 1);
                    cells += '<div class="heatmap-cell" style="background:' + heatColors[colorIdx] +
                        '" title="' + d + ': ' + cnt + '题">' + cnt + '</div>';
                    labels += '<span>' + d.slice(5) + '</span>';
                });
                document.getElementById('statsHeatmap').innerHTML =
                    '<div class="heatmap-row">' + cells + '</div><div class="heatmap-labels">' + labels + '</div>';
            }

            // ================================================================
            //  随机跳题
            // ================================================================
            function randomPick() {
                const minD = parseInt(document.getElementById('randomDiffMin').value);
                const maxD = parseInt(document.getElementById('randomDiffMax').value);
                const scope = randomScope;

                let pool = [];
                if (scope === 'global') {
                    for (const listName in data.lists) {
                        for (const p of data.lists[listName]) {
                            if (p.difficulty >= minD && p.difficulty <= maxD && p.status === 'pending') {
                                pool.push({ ...p, listName });
                            }
                        }
                    }
                } else {
                    const listName = getCurrentListName();
                    if (!listName) { showToast('请先选择题单', 'warning'); return; }
                    const problems = data.lists[listName] || [];
                    for (const p of problems) {
                        if (p.difficulty >= minD && p.difficulty <= maxD && p.status === 'pending') {
                            pool.push({ ...p, listName });
                        }
                    }
                }

                if (pool.length === 0) {
                    document.getElementById('randomResult').innerHTML =
                        '<div class="rp-empty">没有符合条件的未做题目</div>';
                    return;
                }
                const shuffled = pool.slice();
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                const selected = shuffled.slice(0, 5);
                const diffColors = { 0: '#AAAAAA', 1: '#d44141', 2: '#e68d3a', 3: '#e7db30', 4: '#47c49a', 5: '#58c1d1',
                    6: '#648fec', 7: '#a482db', 8: '#2863bb' };
                let html = '';
                for (const p of selected) {
                    html += '<div class="rp-item">' +
                        '<span class="rp-pid" onclick="window.open(\'' + getProblemUrl(p.pid) +
                        '\',\'_blank\')">' + escapeHtml(p.pid) + '</span>' +
                        '<span class="rp-diff" style="background:' + (diffColors[p.difficulty] || '#AAAAAA') +
                        ';">' + (DIFF_NAMES[p.difficulty] || '?') + '</span>' +
                        '<span class="rp-list">' + escapeHtml(p.listName || '') + '</span>' +
                        '</div>';
                }
                document.getElementById('randomResult').innerHTML = html;
                showToast('已随机选 ' + selected.length + ' 道未做题目', 'info');
            }

                    container.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));

            // ================================================================
            //  深色模式
            // ================================================================
            function setupTheme() {
                const html = document.documentElement;
                const toggleBtn = document.getElementById('themeToggleBtn');
                let savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
                if (!savedTheme) {
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        savedTheme = 'dark';
                    } else {
                        savedTheme = 'light';
                    }
                }
                applyTheme(savedTheme);
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                mediaQuery.addEventListener('change', function(e) {
                    if (!localStorage.getItem(THEME_STORAGE_KEY)) {
                        applyTheme(e.matches ? 'dark' : 'light');
                    }
                });

                toggleBtn.addEventListener('click', function() {
                    const current = html.getAttribute('data-theme') || 'light';
                    const next = current === 'dark' ? 'light' : 'dark';
                    applyTheme(next);
                    localStorage.setItem(THEME_STORAGE_KEY, next);
                });

                function applyTheme(theme) {
                    if (theme === 'dark') {
                        html.setAttribute('data-theme', 'dark');
                        toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                    } else {
                        html.removeAttribute('data-theme');
                        toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                    }
                }
            }

            function renderLists() {
                const container = document.getElementById('listContainer');
                const keys = sortLists();
                if (keys.length === 0) {
                    container.innerHTML =
                        '<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>还没有题单</p></div>';
                    return;
                }
                const currentName = getCurrentListName();
                container.innerHTML = keys.map(name => {
                    const isActive = name === currentName;
                    const count = data.lists[name] ? data.lists[name].length : 0;
                    const doneCount = data.lists[name] ? data.lists[name].filter(p => p.status !== 'pending')
                        .length : 0;
                    const progress = count > 0 ? Math.round((doneCount / count) * 100) : 0;
                    const isRenaming = renamingList === name;
                    const safeName = escapeHtml(name);
                    if (isRenaming) {
                        return '<div class="list-item ' + (isActive ? 'active' : '') +
                            '" data-name="' + safeName +
                            '" data-action="rename">' +
                            '<input class="li-name-input" type="text" value="' + safeName +
                            '" data-old-name="' + safeName +
                            '" onblur="confirmRenameList(this.dataset.oldName, this.value)" onkeydown="if(event.key===\'Enter\'){confirmRenameList(this.dataset.oldName, this.value);} else if(event.key===\'Escape\'){renamingList=null;renderLists();}" />' +
                            '<span class="li-count">' + count + '</span>' +
                            '<div class="li-actions"><button class="rename-list" data-action="rename" title="重命名"><i class="fas fa-pen"></i></button><button class="del-list" data-action="delete" data-name="' +
                            safeName + '" title="删除"><i class="fas fa-trash-alt"></i></button></div>' +
                            '</div>';
                    }
                    return '<div class="list-item ' + (isActive ? 'active' : '') + '" data-name="' + safeName +
                        '" data-action="select">' +
                        '<span class="li-name">' + safeName + '</span>' +
                        '<span class="li-count">' + count + '</span>' +
                        '<div class="li-actions"><button class="rename-list" data-action="rename" title="重命名"><i class="fas fa-pen"></i></button><button class="del-list" data-action="delete" data-name="' +
                        safeName + '" title="删除"><i class="fas fa-trash-alt"></i></button></div>' +
                        '<div class="progress-wrap"><div class="progress-bar"><div class="fill" style="width:' +
                        progress + '%;"></div></div><div class="progress-label">' + doneCount + '/' + count +
                        ' (' + progress + '%)</div></div>' +
                        '</div>';
                }).join('');

                container.onclick = function(e) {
                    const target = e.target.closest('button') || e.target.closest('.list-item');
                    if (!target) return;
                    const item = target.closest('.list-item');
                    if (!item) return;
                    const action = target.dataset.action || item.dataset.action;
                    const name = item.dataset.name || target.dataset.name;
                    if (!name) return;
                    switch (action) {
                        case 'select':
                            selectList(name);
                            break;
                        case 'delete':
                            deleteList(name);
                            break;
                        case 'rename':
                            startRenameList(name);
                            break;
                    }
                };

            const origToggleGitHub = toggleGitHubPanel;
            toggleGitHubPanel = function() {
                githubPanelOpen = !githubPanelOpen;
                const panel = document.getElementById('githubPanel');
                if (githubPanelOpen) {
                    panel.classList.add('open');
                    if (statsOpen) { statsOpen = false;
                        document.getElementById('statsPanel').classList.remove('open'); }
                    if (randomOpen) { randomOpen = false;
                        document.getElementById('randomPanel').classList.remove('open'); }
                } else {
                    panel.classList.remove('open');
                }
            };

            document.getElementById('statsFabBtn').addEventListener('click', toggleStats);
            document.getElementById('closeStatsBtn').addEventListener('click', toggleStats);
            document.getElementById('randomFabBtn').addEventListener('click', toggleRandom);
            document.getElementById('closeRandomBtn').addEventListener('click', toggleRandom);
            document.getElementById('randomGoBtn').addEventListener('click', randomPick);

            document.getElementById('randomScopeToggle').addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                const scope = btn.dataset.scope;
                if (scope === randomScope) return;
                randomScope = scope;
                this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('randomResult').innerHTML =
                    '<div class="rp-empty">点击「随机跳题」随机选5题</div>';
            });

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('batchModal').classList.contains('show')) closeModal('batchModal');
                    if (document.getElementById('editModal').classList.contains('show')) closeModal('editModal');
                    if (document.getElementById('confirmModal').classList.contains('show')) closeModal('confirmModal');
                    if (githubPanelOpen) toggleGitHubPanel();
                    if (renamingList) { renamingList = null;
                        renderLists(); }
                    if (multiSelectMode) toggleMultiSelect();
                    if (statsOpen) toggleStats();
                    if (randomOpen) toggleRandom();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active && active.id === 'problemPidInput') { e.preventDefault();
                        document.getElementById('problemNameInput').focus(); return; }
                    if (active && active.id === 'problemNameInput') { e.preventDefault();
                        addProblem(); return; }
                    if (active && active.id === 'listNameInput') { e.preventDefault();
                        addList(); return; }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                    const active = document.activeElement;
                    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName ===
                            'SELECT')) { return; }
                    const listName = getCurrentListName();
                    if (listName && data.lists[listName] && data.lists[listName].length > 0) {
                        e.preventDefault();
                        if (!multiSelectMode) {
                            toggleMultiSelect();
                            setTimeout(() => { const cb = document.getElementById('selectAllCheckbox'); if (cb) { cb
                                    .checked = true;
                                    _doSelectAll(true); } }, 50);
                        } else {
                            const cb = document.getElementById('selectAllCheckbox');
                            if (cb) { const filtered = getFilteredProblems();
                                const isAll = filtered.length > 0 && filtered.every(p => selectedProblems.has(p
                                .pid));
                                cb.checked = !isAll;
                                _doSelectAll(!isAll); }
                        }
                    }
                }
            });

            // ================================================================
            //  全局暴露
            // ================================================================
            window.addList = addList;
            window.deleteList = deleteList;
            window.selectList = selectList;
            window.deleteCurrentList = deleteCurrentList;
            window.startRenameList = startRenameList;
            window.confirmRenameList = confirmRenameList;
            window.addProblem = addProblem;
            window.deleteProblem = deleteProblem;
            window.toggleProblemStatus = toggleProblemStatus;
            window.changeProblemDifficulty = changeProblemDifficulty;
            window.openProblemLink = openProblemLink;
            window.toggleExpandProblem = toggleExpandProblem;
            window.openEditModal = openEditModal;
            window.saveEditProblem = saveEditProblem;
            window.openBatchImport = openBatchImport;
            window.parseBatch = parseBatch;
            window.confirmBatchImport = confirmBatchImport;
            window.closeModal = closeModal;
            window.exportData = exportData;
            window.importData = importData;
            window.confirmClearAll = confirmClearAll;
            window.sortByOJ = sortByOJ;
            window.sortByDiff = sortByDiff;
            window.toggleMultiSelect = toggleMultiSelect;
            window.toggleSelectProblem = toggleSelectProblem;
            window.toggleSelectAll = toggleSelectAll;
            window.exportSelected = exportSelected;
            window.deleteSelected = deleteSelected;
            window.moveSelected = moveSelected;
            window.openSelectedProblems = openSelectedProblems;
            window.batchSetDifficultyString = batchSetDifficultyString;
            window.randomPick = randomPick;
            window.migrateLocalStorage = migrateLocalStorage;
            window.selectedProblems = selectedProblems;
            window.renamingList = renamingList;

            // ================================================================
            //  启动
            // ================================================================
            loadData();
            loadGitHubSettings();
            setupTheme();
            setupViewToggle();
            setupPasteParser();
            document.getElementById('editSaveBtn').addEventListener('click', saveEditProblem);

            console.log('题单 · 题库管理 (三栏桌面式) — 修复展开不全问题');
            console.log('已加载 ' + Object.keys(data.lists).length + ' 个题单');
            console.log('快捷键：Ctrl+A 多选全选 · Esc 关闭面板');
        })();
    </script>

</body>
</html>
