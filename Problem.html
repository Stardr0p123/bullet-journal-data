            const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[
                m
            ]));
            const fmtDate = d => { let dt = new Date(d); return isNaN(dt) ? fmtDate(new Date()) :
                    `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
            const genId = () => Date.now() + '_' + Math.random().toString(36).slice(2, 6);

            function showToast(msg, type = 'info') {
                const container = $('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.textContent = msg;
                container.appendChild(t);
                requestAnimationFrame(() => t.classList.add('show'));
                setTimeout(() => {
                    t.classList.remove('show');
                    t.classList.add('hide');
                    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
                }, 2500);
            }

            // ============================================================
            //  Mouse follower
            // ============================================================
            let mTimer;
            document.addEventListener('mousemove', e => {
                if (mTimer) cancelAnimationFrame(mTimer);
                mTimer = requestAnimationFrame(() => {
                    const x = (e.clientX / window.innerWidth * 100);
                    const y = (e.clientY / window.innerHeight * 100);
                    document.body.style.setProperty('--mouse-x', x + '%');
                    document.body.style.setProperty('--mouse-y', y + '%');
                });
            }, { passive: true });

            // ============================================================
            //  Data
            // ============================================================
            const STORAGE_KEY = 'unified_questions_v2';
            const ERROR_KEY = 'careless_errors_data';
            const GITHUB_SETTINGS_KEY = 'github_settings_liuli';

            let questions = [];
            let currentEditId = null;
            let errors = [];
            let shuffledQueue = [];
            let queueIndex = 0;
            let errorManageOpen = false;

            // ============================================================
            //  Questions CRUD
            // ============================================================
            function loadQuestions() {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    try {
                        const arr = JSON.parse(raw);
                        if (Array.isArray(arr) && arr.length) {
                            questions = arr.map(q => ({
                                ...q,
                                subDiff: q.subDiff || '中位',
                                status: q.status || 'D',
                                date: q.date || fmtDate(new Date()),
                                feel: q.feel !== undefined ? q.feel : 5,
                                tags: Array.isArray(q.tags) ? q.tags : []
                            }));
                        }
                    } catch (_) {}
                }
                if (!questions.length) {
                    questions = [
                        { id: Date.now() - 100000, pid: 'P1048', name: '采药', diff: '普及+/提高-', subDiff: '下位',
                            think: 5, code: 4, quality: 7, feel: 6, date: fmtDate(new Date(Date.now() -
                                    86400000 * 3)), status: 'A', tags: ['DP'] },
                        { id: Date.now() - 200000, pid: 'P1616', name: '疯狂的采药', diff: '普及+/提高-', subDiff: '上位',
                            think: 6, code: 5, quality: 8, feel: 7, date: fmtDate(new Date(Date.now() -
                                    86400000 * 1)), status: 'B', tags: ['DP'] },
                        { id: Date.now() - 300000, pid: 'CF1462E1', name: 'Close Tuples', diff: '提高',
                            subDiff: '下位', think: 7, code: 6, quality: 9, feel: 8, date: fmtDate(new Date()),
                            status: 'C', tags: ['数学'] },
                    ];
                    persistQuestions();
                }
                if (!recordDate.value) recordDate.value = fmtDate(new Date());
                renderAll();
            }

            function persistQuestions() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(questions));
            }

            function getFiltered() {
                let qs = [...questions];
                const kw = searchInput.value.trim().toLowerCase();
                if (kw) qs = qs.filter(q => q.pid.toLowerCase().includes(kw) || q.name.toLowerCase().includes(kw));
                const st = statusFilter.value;
                if (st === 'completed') qs = qs.filter(q => ['A', 'B', 'C', 'F'].includes(q.status));
                else if (st === 'unfinished') qs = qs.filter(q => q.status === 'E');
                else if (st !== 'all') qs = qs.filter(q => q.status === st);
                const d = dateFilterInput.value;
                if (d) qs = qs.filter(q => q.date === d);
                return qs;
            }

            // ============================================================
            //  Render
            // ============================================================
            function renderAll() {
                renderStats();
                renderList();
                renderHeatmap();
                updateContext();
            }

            function renderStats() {
                const qs = getFiltered();
                const cnt = qs.length;
                const counts = {};
                DIFF_NAMES.forEach(d => counts[d] = 0);
                let sumT = 0,
                    sumC = 0,
                    sumQ = 0,
                    sumF = 0;
                qs.forEach(q => {
                    const d = q.diff || '暂无评定';
                    if (counts[d] !== undefined) counts[d]++;
                    else counts['暂无评定']++;
                    sumT += q.think || 5;
                    sumC += q.code || 5;
                    sumQ += q.quality || 8;
                    sumF += q.feel || 5;
                });
                diffStats.innerHTML = DIFF_NAMES.map(d =>
                    `<span class="diff-dot" style="background:${DIFF_COLORS[d] || '#AAAAAA'}" title="${d}: ${counts[d]||0}">${counts[d]||0}</span>`
                ).join('');
                const avg = v => cnt ? (v / cnt).toFixed(1) : '0.0';
                avgMetrics.innerHTML =
                    `<div class="metric"><div class="metric-value">${avg(sumT)}</div><div class="metric-label">平均思维</div></div><div class="metric"><div class="metric-value">${avg(sumC)}</div><div class="metric-label">平均代码</div></div><div class="metric"><div class="metric-value">${avg(sumQ)}</div><div class="metric-label">平均质量</div></div><div class="metric"><div class="metric-value">${avg(sumF)}</div><div class="metric-label">平均手感</div></div><div class="metric"><div class="metric-value">${cnt}</div><div class="metric-label">总题数</div></div>`;
                filterHint.textContent = '全部';
            }

            function renderList() {
                const qs = getFiltered();
                recordCountBadge.textContent = qs.length;
                if (!qs.length) {
                    problemList.innerHTML =
                        '<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>还没有题目，添加一个吧</p></div>';
                    return;
                }
                problemList.innerHTML = qs.map(q => {
                    const c = DIFF_COLORS[q.diff] || '#94a3b8';
                    let subIcon = '';
                    if (q.subDiff === '上位') subIcon = `<i class="fas fa-arrow-up sub-arrow"></i>`;
                    else if (q.subDiff === '中位') subIcon = `<i class="fas fa-arrow-right sub-arrow"></i>`;
                    else if (q.subDiff === '下位') subIcon = `<i class="fas fa-arrow-down sub-arrow"></i>`;
                    else subIcon = `<i class="fas fa-circle sub-arrow" style="font-size:0.4rem;"></i>`;
                    const tagsHtml = (q.tags && q.tags.length) ?
                        `<span class="algo-tags">${q.tags.map(t => `<span class="algo-tag">${esc(t)}</span>`).join('')}</span>` :
                        '';
                    return `<div class="problem-item" data-qid="${q.id}">
                        <div class="q-row q-row-1">
                            <div class="q-left">
                                <span class="q-pid">${esc(q.pid)}</span>
                                <span class="q-title">${esc(q.name)}</span>
                            </div>
                            <div class="q-right">
                                <span class="q-status ${STATUS_CLASS[q.status] || 'status-D'}" data-status="${q.status}">${STATUS_MAP[q.status] || '未知'}</span>
                                <div class="q-actions-group">
                                    <button class="q-action-btn edit-q-btn" data-id="${q.id}" title="编辑"><i class="fas fa-edit"></i></button>
                                    <button class="q-action-btn status-cycle-btn" data-id="${q.id}" title="切换状态"><i class="fas fa-sync"></i></button>
                                    <button class="q-action-btn delete-q-btn" data-id="${q.id}" title="删除"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="q-row q-row-2">
                            <div class="q-left">
                                <span class="diff-circle" style="background-color:${c};">${subIcon}</span>
                                ${tagsHtml}
                            </div>
                            <div class="q-right">
                                <span class="q-meta-item"><i class="fas fa-brain"></i> ${q.think}</span>
                                <span class="q-meta-item"><i class="fas fa-code"></i> ${q.code}</span>
                                <span class="q-meta-item"><i class="fas fa-star"></i> ${q.quality}</span>
                                <span class="q-meta-item"><i class="fas fa-hand-peace"></i> ${q.feel || 5}</span>
                                <span class="q-meta-item"><i class="fas fa-calendar-alt"></i> ${q.date}</span>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            function renderHeatmap() {
                const dates = [];
                for (let i = 6; i >= 0; i--) { const d = new Date();
                    d.setDate(d.getDate() - i);
                    dates.push(fmtDate(d)); }
                const counts = dates.map(d => questions.filter(q => q.date === d).length);
                let cells = '',
                    labels = '';
                dates.forEach((d, i) => {
                    const cnt = counts[i];
                    const idx = Math.min(cnt, HEAT_COLORS.length - 1);
                    cells +=
                        `<div class="heatmap-cell" style="background:${HEAT_COLORS[idx]}" title="${d}: ${cnt}题">${cnt}</div>`;
                    labels += `<span style="width:32px;text-align:center;">${d.slice(5)}</span>`;
                });
                chartWrap.innerHTML =
                    `<div class="heatmap-row">${cells}</div><div class="heatmap-labels">${labels}</div>`;
            }

            function updateContext() {
                const st = statusFilter.value;
                const map = {
                    'all': '全部',
                    'completed': '已完成',
                    'unfinished': '未完成',
                    'A': '独立完成',
                    'B': '独立口胡',
                    'C': '看了题解',
                    'F': 'AI辅助',
                    'E': '待重做'
                };
                listContext.textContent = map[st] || '全部';
            }

            // ============================================================
            //  Form actions
            // ============================================================
            function getFormData() {
                const raw = algoInput.value.trim();
                const tags = raw ? raw.split(',').map(s => s.trim()).filter(s => s !== '') : [];
                return {
                    pid: pid.value.trim(),
                    name: name.value.trim(),
                    diff: diff.value,
                    subDiff: subDiff.value,
                    think: +think.value || 5,
                    code: +code.value || 5,
                    quality: +quality.value || 8,
                    feel: +feel.value || 5,
                    date: recordDate.value || fmtDate(new Date()),
                    status: statusSelect.value,
                    tags
                };
            }

            function setFormData(d) {
                pid.value = d.pid || '';
                name.value = d.name || '';
                diff.value = d.diff || '暂无评定';
                subDiff.value = d.subDiff || '中位';
                think.value = d.think || 5;
                code.value = d.code || 5;
                quality.value = d.quality || 8;
                feel.value = d.feel || 5;
                recordDate.value = d.date || fmtDate(new Date());
                statusSelect.value = d.status || 'A';
                algoInput.value = (d.tags && Array.isArray(d.tags)) ? d.tags.join(',') : '';
            }

            function resetForm() {
                setFormData({
                    pid: '',
                    name: '',
                    diff: '暂无评定',
                    subDiff: '中位',
                    think: 5,
                    code: 5,
                    quality: 8,
                    feel: 5,
                    date: fmtDate(new Date()),
                    status: 'A',
                    tags: []
                });
                currentEditId = null;
                editTip.classList.remove('show');
                saveBtn.innerHTML = '<i class="fas fa-save"></i> 保存题目';
            }

            function startEdit(id) {
                const q = questions.find(x => x.id === id);
                if (!q) return;
                currentEditId = id;
                setFormData(q);
                editTip.classList.add('show');
                editingId.textContent = q.pid;
                saveBtn.innerHTML = '<i class="fas fa-pen"></i> 更新题目';
            }

            function cancelEditing() { resetForm(); }

            function saveQuestion() {
                const data = getFormData();
                if (!data.pid || !data.name) { showToast('题号和名称必填', 'warning'); return; }
                if (currentEditId) {
                    const idx = questions.findIndex(q => q.id === currentEditId);
                    if (idx !== -1) questions[idx] = { ...questions[idx], ...data };
                    showToast('已更新', 'success');
                } else {
                    questions.unshift({ id: Date.now(), ...data });
                    showToast('已添加', 'success');
                }
                persistQuestions();
                resetForm();
                renderAll();
            }

            function deleteQuestion(id) {
                if (!confirm('删除此题？')) return;
                questions = questions.filter(q => q.id !== id);
                persistQuestions();
                renderAll();
                showToast('已删除', 'info');
            }

            function cycleStatus(id) {
                const q = questions.find(x => x.id === id);
                if (!q) return;
                const idx = STATUS_CYCLE.indexOf(q.status);
                q.status = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
                persistQuestions();
                renderAll();
            }

            // ============================================================
            //  Event delegation
            // ============================================================
            problemList.addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (btn) {
                    const qid = +btn.dataset.id;
                    if (btn.classList.contains('edit-q-btn')) startEdit(qid);
                    else if (btn.classList.contains('status-cycle-btn')) cycleStatus(qid);
                    else if (btn.classList.contains('delete-q-btn')) deleteQuestion(qid);
                    return;
                }
                const st = e.target.closest('.q-status');
                if (st) { const item = st.closest('.problem-item'); if (item) cycleStatus(+item.dataset.qid); }
            });

            // ============================================================
            //  Filter listeners
            // ============================================================
            [searchInput, statusFilter, dateFilterInput].forEach(el => {
                el.addEventListener(el === searchInput ? 'input' : 'change', renderAll);
            });
            resetFilterBtn.addEventListener('click', () => {
                searchInput.value = '';
                statusFilter.value = 'all';
                dateFilterInput.value = '';
                renderAll();
            });

            // ============================================================
            //  Form buttons
            // ============================================================
            saveBtn.addEventListener('click', saveQuestion);
            clearFormBtn.addEventListener('click', cancelEditing);
            cancelEdit.addEventListener('click', e => { e.preventDefault();
                cancelEditing(); });

            // ============================================================
            //  Redo
            // ============================================================
            $('redoBtn').addEventListener('click', function() {
                let pool = questions.filter(q => q.status !== 'A' && q.status !== 'E');
                if (!pool.length) { showToast('没有可重做的题目', 'warning'); return; }
                const today = new Date();
                pool = pool.map(q => {
                    let w = 1;
                    if (q.status === 'C') w += 5;
                    if (q.status === 'B') w += 2;
                    if (q.status === 'D') w += 0.5;
                    const days = Math.max(1, Math.floor((today - new Date(q.date)) / 86400000));
                    w += days * 0.5;
                    return { q, w };
                });
                const sel = [];
                const cnt = Math.min(5, pool.length);
                for (let i = 0; i < cnt; i++) {
                    let total = pool.reduce((s, x) => s + x.w, 0),
                        rnd = Math.random() * total,
                        acc = 0;
                    for (let j = 0; j < pool.length; j++) {
                        acc += pool[j].w;
                        if (rnd <= acc) { sel.push(pool[j].q);
                            pool.splice(j, 1); break; }
                    }
                }
                sel.forEach(q => q.status = 'E');
                persistQuestions();
                renderAll();
                showToast(`已推荐 ${sel.length} 题重做`, 'success');
            });

            // ============================================================
            //  Errors
            // ============================================================
            function loadErrors() {
                const raw = localStorage.getItem(ERROR_KEY);
                if (raw) {
                    try { const d = JSON.parse(raw); if (Array.isArray(d)) errors = d; } catch (_) {}
                }
                if (!errors.length) {
                    errors = [
                        { id: genId(), category: 'DP', text: '忘记初始化 dp 数组' },
                        { id: genId(), category: '图论', text: '边数开小了，RE' },
                        { id: genId(), category: '通用', text: '没关同步流，TLE' },
                        { id: genId(), category: '字符串', text: 'KMP next 数组搞混' },
                        { id: genId(), category: '数学', text: '快速幂忘记取模' },
                    ];
                    saveErrors();
                }
                renderErrorAll();
                rebuildQueue();
            }

            function saveErrors() { localStorage.setItem(ERROR_KEY, JSON.stringify(errors)); }

            function getErrorFilteredIds() {
                const f = errorFilterCategory.value;
                if (f === 'all') return errors.map(e => e.id);
                return errors.filter(e => e.category === f).map(e => e.id);
            }

            function rebuildQueue() {
                const ids = getErrorFilteredIds();
                shuffledQueue = ids.slice();
                for (let i = shuffledQueue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledQueue[i], shuffledQueue[j]] = [shuffledQueue[j], shuffledQueue[i]];
                }
                queueIndex = 0;
                updateErrorPlaceholder();
            }

            function getNextError() {
                const ids = getErrorFilteredIds();
                if (!ids.length) return null;
                const current = shuffledQueue;
                const allMatch = ids.length === current.length && ids.every(id => current.includes(id));
                if (!allMatch) rebuildQueue();
                if (!shuffledQueue.length) rebuildQueue();
                if (queueIndex >= shuffledQueue.length) queueIndex = 0;
                const id = shuffledQueue[queueIndex++];
                if (queueIndex >= shuffledQueue.length) rebuildQueue();
                return errors.find(e => e.id === id) || null;
            }

            function updateErrorPlaceholder() {
                const ids = getErrorFilteredIds();
                errorTipText.textContent = ids.length ? '点击"随机提醒"查看一条错误' : '当前筛选下没有错误，换个分类或添加一些吧';
                errorStatsDisplay.textContent = `共 ${ids.length} 条`;
            }

            function renderErrorManageList() {
                if (!errors.length) {
                    errorManageList.innerHTML = '<div class="empty-message">暂无记录</div>';
                    return;
                }
                errorManageList.innerHTML = errors.map(e =>
                    `<div class="error-manage-item" data-id="${e.id}">
                        <span class="cat-badge">${e.category}</span>
                        <span class="text">${esc(e.text)}</span>
                        <button class="del-btn" data-id="${e.id}"><i class="fas fa-times"></i></button>
                    </div>`
                ).join('');
                errorManageList.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        errors = errors.filter(e => e.id !== id);
                        saveErrors();
                        renderErrorAll();
                        rebuildQueue();
                    });
                });
            }

            function renderErrorAll() {
                updateErrorPlaceholder();
                renderErrorManageList();
            }

            function addError() {
                const cat = errorCategorySelect.value;
                const text = errorDesc.value.trim();
                if (!text) { showToast('请输入错误描述', 'warning'); return; }
                errors.push({ id: genId(), category: cat, text });
                saveErrors();
                renderErrorAll();
                rebuildQueue();
                errorDesc.value = '';
                errorTipText.textContent = '✅ 已添加！';
                setTimeout(updateErrorPlaceholder, 1200);
                showToast('已添加错误', 'success');
            }

            function showErrorModal() {
                const e = getNextError();
                if (!e) { errorTipText.textContent = '当前筛选下没有错误，换个分类或添加一些吧'; return; }
                errorTipText.textContent = `[${e.category}] ${e.text}`;
                const emojis = ['🧐', '😅', '🤔', '⚠️', '💡', '🔥', '🤯', '😤'];
                errorModalEmoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                errorModalTitle.textContent = '⚠️ 错误提醒';
                errorModalCategory.textContent = e.category;
                errorModalText.textContent = e.text;
                errorModalOverlay.classList.add('show');
            }

            addErrorBtn.addEventListener('click', addError);
            errorDesc.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                    addErrorBtn.click(); } });
            errorFilterCategory.addEventListener('change', () => { renderErrorAll();
                rebuildQueue(); });
            randomTipBtn.addEventListener('click', showErrorModal);
            toggleErrorManageBtn.addEventListener('click', function() {
                errorManageOpen = !errorManageOpen;
                errorManagePanel.classList.toggle('open', errorManageOpen);
                this.innerHTML = errorManageOpen ? '<i class="fas fa-times"></i> 关闭管理' :
                    '<i class="fas fa-list-ul"></i> 管理记录';
                if (errorManageOpen) renderErrorManageList();
            });
            clearAllErrorsBtn.addEventListener('click', () => {
                if (!errors.length) return;
                if (confirm('确定清空所有错误记录吗？')) { errors = [];
                    saveErrors();
                    renderErrorAll();
                    rebuildQueue(); }
            });
            errorModalCloseBtn.addEventListener('click', () => errorModalOverlay.classList.remove('show'));
            errorModalOverlay.addEventListener('click', e => { if (e.target === errorModalOverlay) errorModalOverlay
                    .classList.remove('show'); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && errorModalOverlay.classList.contains(
                    'show')) errorModalOverlay.classList.remove('show'); });

            // ============================================================
            //  Export / Import
            // ============================================================
            $('exportBtn').addEventListener('click', () => {
                const data = { questions, errors };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `做题记录_${fmtDate(new Date())}.json`;
                a.click();
                showToast('导出成功', 'success');
            });

            $('importBtn').addEventListener('click', () => {
                const inp = document.createElement('input');
                inp.type = 'file';
                inp.accept = '.json';
                inp.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = re => {
                        try {
                            const d = JSON.parse(re.target.result);
                            if (d.questions) {
                                questions = d.questions.map(q => ({ ...q, subDiff: q.subDiff || '中位',
                                    status: q.status || 'D', date: q.date || fmtDate(new Date()),
                                    feel: q.feel !== undefined ? q.feel : 5,
                                    tags: Array.isArray(q.tags) ? q.tags : []
                                }));
                                persistQuestions();
                            }
                            if (d.errors && Array.isArray(d.errors)) { errors = d.errors;
                                saveErrors();
                                renderErrorAll();
                                rebuildQueue(); }
                            renderAll();
                            showToast('导入成功', 'success');
                        } catch (_) { showToast('解析失败', 'warning'); }
                    };
                    reader.readAsText(file);
                };
                inp.click();
            });

            // ============================================================
            //  Old data migration
            // ============================================================
            function migrateOldDiff(d) {
                const map = {
                    '红题': '入门',
                    '橙题': '普及-',
                    '黄题': '普及',
                    '绿题': '普及+/提高-',
                    '蓝题': '提高',
                    '紫题': '省选/NOI-',
                    '黑题': 'NOI/NOI+/CTS'
                };
                return map[d] || d;
            }

            function migrateOldData(d) {
                if (!d || !d.questions) return d;
                d.questions = d.questions.map(q => {
                    if (q.diff) q.diff = migrateOldDiff(q.diff);
                    if (!q.tags) q.tags = [];
                    if (!q.subDiff) q.subDiff = '中位';
                    if (!q.status) q.status = 'D';
                    if (!q.date) q.date = fmtDate(new Date());
                    if (q.feel === undefined) q.feel = 5;
                    return q;
                });
                return d;
            }

            $('migrateImportBtn').addEventListener('click', () => {
                const inp = document.createElement('input');
                inp.type = 'file';
                inp.accept = '.json';
                inp.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = re => {
                        try {
                            let d = JSON.parse(re.target.result);
                            if (!d.questions) { showToast('未找到题目数据，请选择正确的旧版导出文件',
                                'warning'); return; }
                            d = migrateOldData(d);
                            if (d.questions) {
                                questions = d.questions.map(q => ({ ...q, subDiff: q.subDiff ||
                                        '中位', status: q.status || 'D', date: q.date || fmtDate(
                                        new Date()),
                                        feel: q.feel !== undefined ? q.feel : 5,
                                        tags: Array.isArray(q.tags) ? q.tags : []
                                    }));
                                persistQuestions();
                            }
                            if (d.errors && Array.isArray(d.errors)) { errors = d.errors;
                                saveErrors();
                                renderErrorAll();
                                rebuildQueue(); }
                            renderAll();
                            showToast('✅ 旧数据导入并迁移成功！', 'success');
                        } catch (_) { showToast('解析失败，请确认文件格式正确', 'warning'); }
                    };
                    reader.readAsText(file);
                };
                inp.click();
            });

            // ============================================================
            //  GitHub
            // ============================================================
            function loadGitHubSettings() {
                try {
                    const raw = localStorage.getItem(GITHUB_SETTINGS_KEY);
                    if (raw) { const s = JSON.parse(raw);
                        githubUsername.value = s.username || '';
                        githubRepo.value = s.repo || '';
                        githubToken.value = s.token || ''; }
                } catch (_) {}
            }

            function saveGitHubSettings() {
                const s = { username: githubUsername.value.trim(), repo: githubRepo.value.trim(), token: githubToken
                        .value.trim() };
                try { localStorage.setItem(GITHUB_SETTINGS_KEY, JSON.stringify(s)); } catch (_) {}
            }

            function getGitHubSettings() {
                return { username: githubUsername.value.trim(), repo: githubRepo.value.trim(), token: githubToken
                        .value.trim() };
            }

            function utf8ToBase64(str) {
                const enc = new TextEncoder();
                const data = enc.encode(str);
                let bin = '';
                for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
                return btoa(bin);
            }

            function base64ToUtf8(b64) {
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            }

            function getFullData() { return { questions, errors }; }

            function loadFullData(d) {
                if (d.questions && Array.isArray(d.questions)) {
                    questions = d.questions.map(q => ({ ...q, subDiff: q.subDiff || '中位', status: q.status || 'D',
                        date: q.date || fmtDate(new Date()), feel: q.feel !== undefined ? q.feel : 5,
                        tags: Array.isArray(q.tags) ? q.tags : []
                    }));
                    persistQuestions();
                }
                if (d.errors && Array.isArray(d.errors)) { errors = d.errors;
                    saveErrors();
                    renderErrorAll();
                    rebuildQueue(); }
                renderAll();
            }

            async function uploadToGit() {
                const s = getGitHubSettings();
                if (!s.username || !s.repo || !s.token) { showToast('请填写完整的 GitHub 信息', 'warning'); return; }
                saveGitHubSettings();
                if (!confirm(`确定上传到 ${s.username}/${s.repo} 的 /data/problems.json 吗？`)) return;
                const apiUrl = `https://api.github.com/repos/${s.username}/${s.repo}/contents/data/problems.json`;
                const content = utf8ToBase64(JSON.stringify(getFullData(), null, 2));
                try {
                    let sha = null;
                    try {
                        const g = await fetch(apiUrl, { headers: { 'Authorization': `token ${s.token}`,
                                'Accept': 'application/vnd.github.v3+json' } });
                        if (g.ok) { const d = await g.json();
                            sha = d.sha; }
                    } catch (_) {}
                    const resp = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${s.token}`, 'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: '更新题集 ' + new Date().toISOString(), content,
                            sha: sha || undefined })
                    });
                    if (!resp.ok) { const err = await resp.json(); throw new Error(err.message || '上传失败'); }
                    showToast('✅ 数据已上传至 GitHub!', 'success');
                } catch (err) { showToast('❌ 上传失败: ' + err.message, 'error'); }
            }

            async function importFromGit() {
                const s = getGitHubSettings();
                if (!s.username || !s.repo || !s.token) { showToast('请填写完整的 GitHub 信息', 'warning'); return; }
                saveGitHubSettings();
                if (!confirm(`从 ${s.username}/${s.repo} 导入数据？将替换当前所有本地数据！`)) return;
                const apiUrl = `https://api.github.com/repos/${s.username}/${s.repo}/contents/data/problems.json`;
                try {
                    const resp = await fetch(apiUrl, { headers: { 'Authorization': `token ${s.token}`,
                            'Accept': 'application/vnd.github.v3+json' } });
                    if (!resp.ok) {
                        if (resp.status === 404) throw new Error('远程文件不存在，请先上传');
                        throw new Error('获取失败');
                    }
                    const d = await resp.json();
                    const imported = JSON.parse(base64ToUtf8(d.content));
                    if (!imported.questions || !Array.isArray(imported.questions)) throw new Error('数据格式错误');
                    loadFullData(imported);
                    showToast('✅ 从 GitHub 导入成功!', 'success');
                } catch (err) { showToast('❌ 导入失败: ' + err.message, 'error'); }
            }

            function openGitHubRepo() {
                const s = getGitHubSettings();
                if (!s.username || !s.repo) { showToast('请先填写用户名和仓库名', 'warning'); return; }
                saveGitHubSettings();
                window.open(`https://github.com/${s.username}/${s.repo}`, '_blank');
                showToast('正在打开仓库...', 'info');
            }

            let gpOpen = false;

            function toggleGP() {
                gpOpen = !gpOpen;
                githubPanel.classList.toggle('open', gpOpen);
                githubToggleBtn.style.display = gpOpen ? 'none' : 'flex';
            }

            openGitHubBtn.addEventListener('click', toggleGP);
            githubToggleBtn.addEventListener('click', toggleGP);
            closeGitHubPanelBtn.addEventListener('click', toggleGP);
            uploadToGitBtn.addEventListener('click', uploadToGit);
            importFromGitBtn.addEventListener('click', importFromGit);
            linkToGitBtn.addEventListener('click', openGitHubRepo);

            // ============================================================
            //  External links
            // ============================================================
            document.querySelectorAll('[data-url]').forEach(b => b.addEventListener('click', () => window.open(b.dataset
                .url, '_blank')));

            // ============================================================
            //  Init
            // ============================================================
            loadQuestions();
            loadErrors();
            loadGitHubSettings();

            if (errors.length) {
                setTimeout(() => {
                    const first = getNextError();
                    if (first) errorTipText.textContent = `[${first.category}] ${first.text}`;
                }, 150);
            }

            document.addEventListener('keydown', e => { if (e.key === 'Escape' && gpOpen) toggleGP(); });

            console.log('📀 做题记录 · 题单管理风格 (青蓝色系)');
            console.log(`  📊 ${questions.length} 题 · ${errors.length} 条错误`);
            console.log('  🎨 9档难度 · 毛玻璃 · 鼠标跟随');

        })();
    </script>

</body>
</html>
