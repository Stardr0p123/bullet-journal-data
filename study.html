<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>沉浸学习 · 速记+番茄</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'%3E%3Cpath fill='%23000000' d='M102.8 57.3C108.2 51.9 116.6 51.1 123 55.3L241.9 134.5C250.8 140.4 256.1 150.4 256.1 161.1L256.1 210.7L346.9 301.5C380.2 286.5 420.8 292.6 448.1 320L574.2 446.1C592.9 464.8 592.9 495.2 574.2 514L514.1 574.1C495.4 592.8 465 592.8 446.2 574.1L320.1 448C292.7 420.6 286.6 380.1 301.6 346.8L210.8 256L161.2 256C150.5 256 140.5 250.7 134.6 241.8L55.4 122.9C51.2 116.6 52 108.1 57.4 102.7L102.8 57.3zM247.8 360.8C241.5 397.7 250.1 436.7 274 468L179.1 563C151 591.1 105.4 591.1 77.3 563C49.2 534.9 49.2 489.3 77.3 461.2L212.7 325.7L247.9 360.8zM416.1 64C436.2 64 455.5 67.7 473.2 74.5C483.2 78.3 485 91 477.5 98.6L420.8 155.3C417.8 158.3 416.1 162.4 416.1 166.6L416.1 208C416.1 216.8 423.3 224 432.1 224L473.5 224C477.7 224 481.8 222.3 484.8 219.3L541.5 162.6C549.1 155.1 561.8 156.9 565.6 166.9C572.4 184.6 576.1 203.9 576.1 224C576.1 267.2 558.9 306.3 531.1 335.1L482 286C448.9 253 403.5 240.3 360.9 247.6L304.1 190.8L304.1 161.1L303.9 156.1C303.1 143.7 299.5 131.8 293.4 121.2C322.8 86.2 366.8 64 416.1 63.9z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ================================================================
           1.  CSS 变量
           ================================================================ */
        :root {
            --primary: #06b6d4;
            --primary-dark: #0e7490;
            --primary-light: #67e8f9;

            --menu-bg: rgba(255, 255, 255, 0.60);
            --menu-border: rgba(255, 255, 255, 0.20);
            --menu-shadow: 0 8px 48px rgba(0, 0, 0, 0.08);
            --glass-blur: 24px;

            --text: #0f172a;
            --text-muted: #94a3b8;
            --text-hint: #64748b;

            --radius: 16px;
            --radius-sm: 10px;

            --icon-size: 42px;
            --item-gap: 6px;
            --menu-width: 220px;

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;

            /* 组合按钮配色 — 草绿 + 淡钴蓝 */
            --green-half: #7ccd7c;
            --green-half-hover: #66bb6a;
            --blue-half: #6cb2ff;
            --blue-half-hover: #5b9bd5;

            --tomato-bg: rgba(255, 255, 255, 0.50);
            --tomato-border: rgba(255, 255, 255, 0.15);
            --tomato-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        /* ================================================================
           2.  全局重置
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            font-size: 15px;
            color: var(--text);
            background: #dce8ef;
            -webkit-font-smoothing: antialiased;
            contain: layout style paint;
        }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.20);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.40);
        }

        /* ================================================================
           3.  全屏 iframe 内容区
           ================================================================ */
        .main-content {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            overflow: hidden;
            contain: layout style paint;
        }

        .main-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
            position: relative;
            z-index: 0;
            will-change: transform;
            contain: layout style paint;
        }

        .iframe-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: var(--text-muted);
            font-size: 13px;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.4s ease;
            contain: layout style;
        }
        .iframe-placeholder .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(6, 182, 212, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 10px;
            will-change: transform;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .iframe-placeholder .load-text {
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0.4;
        }
        .iframe-placeholder .load-text i {
            margin-right: 8px;
            color: var(--primary);
            opacity: 0.6;
        }
        .iframe-placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ================================================================
           4.  汉堡按钮 — 固定在左上角
           ================================================================ */
        .hamburger-fixed {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.25s ease, border-color 0.25s ease;
            will-change: transform;
            user-select: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .hamburger-fixed:hover {
            background: rgba(255, 255, 255, 0.50);
            transform: scale(1.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border-color: rgba(255, 255, 255, 0.30);
        }
        .hamburger-fixed:active {
            transform: scale(0.90);
        }
        .hamburger-fixed .hamburger-icon {
            display: inline-block;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }
        .hamburger-fixed.open .hamburger-icon {
            transform: rotate(90deg);
        }

        /* ================================================================
           5.  悬浮菜单面板
           ================================================================ */
        .menu-panel {
            position: fixed;
            top: 72px;
            left: 16px;
            z-index: 150;
            width: var(--menu-width);
            max-height: calc(100% - 100px);
            background: var(--menu-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--menu-border);
            border-radius: var(--radius);
            box-shadow: var(--menu-shadow);
            padding: 16px 10px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateX(-120%) scale(0.96);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.30s ease,
                visibility 0.30s ease;
            visibility: hidden;
            pointer-events: none;
            overflow: hidden;
            contain: layout style;
            transform-origin: top left;
        }
        .menu-panel.open {
            transform: translateX(0) scale(1);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .menu-panel .tool-list {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: var(--item-gap);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            scrollbar-width: thin;
        }
        .menu-panel .tool-list::-webkit-scrollbar {
            width: 2px;
        }
        .menu-panel .tool-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.15);
            border-radius: 4px;
        }

        .menu-panel .tool-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.25s ease;
            will-change: transform;
            user-select: none;
            color: var(--text);
            text-decoration: none;
            position: relative;
            min-height: var(--icon-size);
            width: 100%;
            border: 1px solid transparent;
        }
        .menu-panel .tool-item:hover {
            background: rgba(255, 255, 255, 0.50);
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.20);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .menu-panel .tool-item:active {
            transform: scale(0.96) !important;
            transition-duration: 0.08s;
        }
        .menu-panel .tool-item.active {
            background: rgba(255, 255, 255, 0.55);
            border-color: rgba(6, 182, 212, 0.20);
            box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.06), 0 4px 16px rgba(6, 182, 212, 0.04);
        }
        .menu-panel .tool-item.active::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            border-radius: 4px;
            background: var(--primary);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
        }

        .menu-panel .tool-item .icon-wrap {
            flex: 0 0 var(--icon-size);
            width: var(--icon-size);
            height: var(--icon-size);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            background: var(--item-grad, linear-gradient(135deg, #94a3b8, #64748b));
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
            flex-shrink: 0;
        }
        .menu-panel .tool-item:hover .icon-wrap {
            transform: scale(1.06);
        }

        .menu-panel .tool-item .tool-info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
        }
        .menu-panel .tool-item .tool-name {
            font-weight: 600;
            font-size: 14px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-panel .tool-item .tool-hint {
            font-size: 11px;
            color: var(--text-hint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.6;
        }

        .menu-panel .tool-item .active-dot {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            transition: transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.30);
            flex-shrink: 0;
        }
        .menu-panel .tool-item.active .active-dot {
            transform: translateY(-50%) scale(1);
        }

        .menu-panel .panel-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            opacity: 0.6;
            font-size: 12px;
            color: var(--text-muted);
        }
        .menu-panel .panel-footer .count {
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .menu-panel .panel-footer .reload-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease, transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }
        .menu-panel .panel-footer .reload-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text);
            transform: rotate(60deg);
        }

        /* ================================================================
           6.  右上角组合按钮（草绿 · 淡钴蓝）
           ================================================================ */
        .combo-wrapper {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 180;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .combo-wrapper.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .combo-btn {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: var(--tomato-shadow);
            border: 2px solid rgba(255, 255, 255, 0.30);
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: #fff;
        }
        .combo-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }
        .combo-btn:active {
            transform: scale(0.92);
        }

        .combo-btn .half {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            cursor: pointer;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        .combo-btn .half.left {
            left: 0;
            background: var(--green-half);
            border-right: 1px solid rgba(255, 255, 255, 0.25);
        }
        .combo-btn .half.left:hover {
            background: var(--green-half-hover);
        }
        .combo-btn .half.right {
            right: 0;
            background: var(--blue-half);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }
        .combo-btn .half.right:hover {
            background: var(--blue-half-hover);
        }
        .combo-btn .half i {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.05));
        }

        /* 运行小圆点 */
        .combo-btn .fab-badge {
            position: absolute;
            top: 3px;
            right: 3px;
            font-size: 14px;
            color: var(--primary);
            text-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
            line-height: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .combo-btn .fab-badge.active {
            opacity: 1;
            animation: dotPulse 1.8s infinite ease-in-out;
        }
        @keyframes dotPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ================================================================
           7.  番茄钟卡片（右上角展开）
           ================================================================ */
        .tomato-clock {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 185;
            background: var(--tomato-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tomato-border);
            border-radius: var(--radius);
            box-shadow: var(--tomato-shadow);
            padding: 14px 18px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
            pointer-events: none;
            transform-origin: top right;
        }
        .tomato-clock.open {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .tomato-clock .tomato-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .tomato-clock .tomato-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-hint);
            opacity: 0.7;
        }
        .tomato-clock .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s ease, transform 0.3s ease, color 0.2s ease;
            line-height: 1;
        }
        .tomato-clock .close-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text);
            transform: rotate(90deg);
        }

        .tomato-clock .timer-display {
            font-size: 28px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            text-align: center;
            letter-spacing: 2px;
            color: var(--text);
            line-height: 1.2;
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .tomato-clock .timer-display.prep {
            color: #f59e0b;
        }
        .tomato-clock .timer-display.running {
            color: var(--primary);
        }
        .tomato-clock .timer-display.idle {
            color: var(--text-muted);
        }

        .tomato-clock .timer-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tomato-clock .timer-controls button {
            background: rgba(255, 255, 255, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: var(--radius-sm);
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.20s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .tomato-clock .timer-controls button:hover {
            background: rgba(255, 255, 255, 0.50);
            transform: scale(1.04);
        }
        .tomato-clock .timer-controls button:active {
            transform: scale(0.94);
        }
        .tomato-clock .timer-controls button.primary-btn {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .tomato-clock .timer-controls button.primary-btn:hover {
            background: var(--primary-dark);
        }
        .tomato-clock .timer-controls button.settings-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            padding: 4px 6px;
            color: var(--text-muted);
        }
        .tomato-clock .timer-controls button.settings-btn:hover {
            color: var(--text);
            transform: rotate(30deg);
        }

        /* ================================================================
           8.  速记便签卡片（右上角展开 · 3:4 · 占屏约1/16）
           ================================================================ */
        .note-panel {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 185;
            background: var(--tomato-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tomato-border);
            border-radius: var(--radius);
            box-shadow: var(--tomato-shadow);
            padding: 14px 16px;
            width: 16vw;
            height: 21.33vw;
            min-width: 180px;
            min-height: 240px;
            max-width: 360px;
            max-height: 480px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
            pointer-events: none;
            transform-origin: top right;
        }
        .note-panel.open {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .note-panel .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .note-panel .note-header .note-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-hint);
            opacity: 0.7;
        }
        .note-panel .note-header .close-note {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s ease, transform 0.3s ease, color 0.2s ease;
            line-height: 1;
        }
        .note-panel .note-header .close-note:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text);
            transform: rotate(90deg);
        }

        .note-panel .note-body {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }
        .note-panel .note-body textarea {
            flex: 1 1 auto;
            width: 100%;
            padding: 6px 8px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 13px;
            font-family: var(--font-sans);
            color: var(--text);
            resize: none;
            outline: none;
            transition: background 0.2s ease;
            min-height: 60px;
            line-height: 1.5;
        }
        .note-panel .note-body textarea:focus {
            background: rgba(255, 255, 255, 0.35);
        }
        .note-panel .note-body textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .note-panel .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 8px;
        }
        .note-panel .note-footer .save-status {

            transition: opacity 0.3s ease;
        }
        .note-panel .note-footer .save-status.saved {
            color: var(--primary);
            opacity: 0.9;
        }
        .note-panel .note-footer .save-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);

        /* ================================================================
           9.  设置弹窗（仅番茄钟）
           ================================================================ */
        .settings-modal {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.20);

            -webkit-backdrop-filter: blur(6px);

        }
        .settings-modal.open {
            display: flex;
        }
        .settings-modal .modal-box {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 24px 28px;
            min-width: 240px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.10);

            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .settings-modal .modal-box h3 {
            font-size: 16px;

            margin: 0;

        .settings-modal .modal-box .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-modal .modal-box .setting-group label {
            font-size: 13px;

            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
        }
        .settings-modal .modal-box .setting-group input[type="number"] {
            width: 70px;
            padding: 4px 8px;
            border: 1px solid rgba(0, 0, 0, 0.10);
            border-radius: 6px;
            font-size: 15px;

        }
        .settings-modal .modal-box .modal-actions {

        .settings-modal .modal-box .modal-actions button {
            padding: 6px 20px;

            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .settings-modal .modal-box .modal-actions .save-btn {
            background: var(--primary);
            color: #fff;
        }
        .settings-modal .modal-box .modal-actions .save-btn:hover {
            background: var(--primary-dark);
        }
        .settings-modal .modal-box .modal-actions .cancel-btn {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text);
        }
        .settings-modal .modal-box .modal-actions .cancel-btn:hover {
            background: rgba(0, 0, 0, 0.10);
        }

        /* ================================================================
           10. 全局涟漪
           ================================================================ */
        .global-ripple {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.50) 0%, rgba(6, 182, 212, 0.12) 50%, transparent 70%);
            transform: scale(0);
            animation: globalRippleAnim 0.6s ease-out forwards;
            will-change: transform, opacity;
            z-index: 9998;
        }
        @keyframes globalRippleAnim {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ================================================================
           11. 响应式
           ================================================================ */

<body>

    <!-- ============================================================
    全屏 iframe 内容区
    ============================================================ -->
    <main class="main-content" id="mainContent">
        <div class="iframe-placeholder" id="placeholder">
            <div class="spinner"></div>
            <span class="load-text"><i class="fas fa-folder-open"></i> 加载工具…</span>
        </div>
        <iframe id="toolFrame" name="toolFrame" title="工具页面" src=""
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
        loading="lazy"></iframe>
    </main>

    <!-- ============================================================
    左上角：汉堡按钮
    ============================================================ -->
    <button class="hamburger-fixed" id="hamburgerBtn" aria-label="切换菜单" tabindex="0">
        <span class="hamburger-icon"><i class="fas fa-bars"></i></span>
    </button>

    <!-- ============================================================
    左侧：悬浮菜单面板
    ============================================================ -->
    <aside class="menu-panel" id="menuPanel" role="navigation" aria-label="学习工具导航">
        <ul class="tool-list" id="toolList">
            <!-- 由 JS 动态生成 -->
        </ul>
        <div class="panel-footer">
            <span class="count" id="navCount">1 / 4</span>
            <button class="reload-btn" id="reloadBtn" aria-label="刷新当前工具" title="刷新当前工具">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </aside>

    <!-- ============================================================
    右上角：组合按钮（左草绿 · 右淡钴蓝）
    ============================================================ -->
    <div class="combo-wrapper" id="comboWrapper">
        <div class="combo-btn" id="comboBtn">
            <div class="half left" id="tomatoTrigger" title="番茄钟">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="half right" id="noteTrigger" title="速记便签">
                <i class="fas fa-sticky-note"></i>
            </div>
            <span class="fab-badge" id="fabBadge">●</span>
        </div>
    </div>

    <!-- ============================================================
    番茄钟卡片（右上角展开）
    ============================================================ -->
    <div class="tomato-clock" id="tomatoClock">
        <div class="tomato-header">
            <span class="tomato-title">🍅 番茄钟</span>
            <button class="close-btn" id="tomatoClose" title="收起"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="timer-display idle" id="timerDisplay">25:00</div>
        <div class="timer-controls">
            <button class="primary-btn" id="startStudyBtn"><i class="fas fa-play"></i> 开始做题</button>
            <button id="tomatoBtn"><i class="fas fa-clock"></i> 番茄钟</button>
            <button class="settings-btn" id="settingsBtn"><i class="fas fa-cog"></i></button>
        </div>
    </div>

    <!-- ============================================================
    速记便签卡片（右上角展开 · 3:4 · 占屏约1/16）
    ============================================================ -->
    <div class="note-panel" id="notePanel">
        <div class="note-header">
            <span class="note-title">📝 速记</span>
            <button class="close-note" id="noteClose" title="收起"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="note-body">
            <textarea id="noteText" placeholder="记录灵感… 自动保存"></textarea>
        </div>
        <div class="note-footer">
            <span class="save-status" id="saveStatus">已保存</span>
            <button class="save-btn" id="noteSaveBtn">保存</button>
        </div>
    </div>

    <!-- ============================================================
    设置弹窗（仅番茄钟）
    ============================================================ -->
    <div class="settings-modal" id="settingsModal">
        <div class="modal-box">
            <h3>⏱ 番茄钟设置</h3>
            <div class="setting-group">
                <label>
                    默认时长（分钟）
                    <input type="number" id="tomatoMinutes" value="25" min="1" max="120" step="1" />
                </label>
            </div>
            <div class="modal-actions">
                <button class="save-btn" id="saveSettings">保存</button>
                <button class="cancel-btn" id="cancelSettings">取消</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    核心脚本
    ============================================================ -->
    <script>
        // ================================================================
        //  工具数据 — 4 个「沉浸学习」工具
        // ================================================================
        const TOOLS = [{
            id: 'tool-state',
            name: '出题灵感',
            icon: 'fa-lightbulb',
            hint: '题目构思 · 笔记沉淀',
            url: 'https://stardr0p123.github.io/bullet-journal-data/State.html',
            gradient: 'linear-gradient(135deg, #10b981 0%, #06b6d4 100%)'
        }, {
            id: 'tool-review',
            name: '复习计划',
            icon: 'fa-brain',
            hint: '算法追踪 · 间隔复习',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Review.html',
            gradient: 'linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)'
        }, {
            id: 'tool-problem',
            name: '做题记录',
            icon: 'fa-list-check',
            hint: '题集管理 · 状态追踪',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Problem.html',
            gradient: 'linear-gradient(135deg, #06b6d4 0%, #67e8f9 100%)'
        }, {
            id: 'tool-problemset',
            name: '题单管理',
            icon: 'fa-layer-group',
            hint: '多OJ题集 · 批量导入',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Problemset.html',
            gradient: 'linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%)'
        }];

        // ================================================================
        //  核心逻辑 (菜单 & iframe)
        // ================================================================
        const frame = document.getElementById('toolFrame');
        const placeholder = document.getElementById('placeholder');
        const toolList = document.getElementById('toolList');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const menuPanel = document.getElementById('menuPanel');
        const navCount = document.getElementById('navCount');
        const reloadBtn = document.getElementById('reloadBtn');

        let currentId = null;
        let isFirstLoad = true;
        let isMenuOpen = false;
        let loadTimeout = null;

        // ----- 渲染工具列表 -----
        function renderTools() {
            toolList.innerHTML = '';
            TOOLS.forEach((tool, index) => {
                const li = document.createElement('li');
                li.className = 'tool-item';
                li.dataset.toolId = tool.id;
                li.dataset.index = index;
                li.setAttribute('role', 'tab');
                li.setAttribute('aria-selected', 'false');

                const iconWrap = document.createElement('span');
                iconWrap.className = 'icon-wrap';
                iconWrap.style.setProperty('--item-grad', tool.gradient);
                iconWrap.innerHTML = `<i class="fas ${tool.icon}"></i>`;

                const info = document.createElement('span');
                info.className = 'tool-info';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'tool-name';
                nameSpan.textContent = tool.name;

                const hintSpan = document.createElement('span');
                hintSpan.className = 'tool-hint';
                hintSpan.textContent = tool.hint;

                info.appendChild(nameSpan);
                info.appendChild(hintSpan);

                const dot = document.createElement('span');
                dot.className = 'active-dot';

                li.appendChild(iconWrap);
                li.appendChild(info);
                li.appendChild(dot);

                li.addEventListener('click', (e) => {
                    if (e.button !== 0) return;
                    const id = li.dataset.toolId;
                    switchTool(id);
                    closeMenu();
                });

                li.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const id = li.dataset.toolId;
                    switchTool(id);
                    closeMenu();
                }, { passive: false });

                toolList.appendChild(li);
            });

            const first = toolList.querySelector('.tool-item');
            if (first) {
                first.classList.add('active');
                first.setAttribute('aria-selected', 'true');
            }
            updateCount();
        }

        function updateCount() {
            const idx = currentId ? TOOLS.findIndex(t => t.id === currentId) + 1 : 1;
            navCount.textContent = `${idx} / ${TOOLS.length}`;
        }

        function switchTool(toolId) {
            const tool = TOOLS.find(t => t.id === toolId);
            if (!tool) return;

            if (currentId === toolId && !isFirstLoad) {
                reloadCurrent();
                return;
            }

            currentId = toolId;
            isFirstLoad = false;

            const items = toolList.querySelectorAll('.tool-item');
            items.forEach(item => {
                const isActive = item.dataset.toolId === toolId;
                item.classList.toggle('active', isActive);
                item.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            updateCount();

            placeholder.classList.remove('hidden');
            clearTimeout(loadTimeout);

            loadTimeout = setTimeout(() => {
                frame.src = tool.url;
            }, 50);
        }

        function onIframeLoad() {
            placeholder.classList.add('hidden');
            clearTimeout(loadTimeout);
            try {
                const win = frame.contentWindow;
                if (win) {
                    win.postMessage({ type: 'NAV_LOADED', toolId: currentId, timestamp: Date.now() }, '*');
                }
            } catch (_) { /* 跨域忽略 */ }
        }

        function handleMessage(event) {
            const data = event.data;
            if (!data || typeof data !== 'object') return;
            if (data.type === 'NAV_SWITCH' && data.toolId) {
                const target = TOOLS.find(t => t.id === data.toolId);
                if (target) switchTool(target.id);
            }
            if (data.type === 'NAV_LOG') {
                console.log('[子页面]', data.message);
            }
        }

        function openMenu() {
            isMenuOpen = true;
            menuPanel.classList.add('open');
            hamburgerBtn.classList.add('open');
            hamburgerBtn.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            isMenuOpen = false;
            menuPanel.classList.remove('open');
            hamburgerBtn.classList.remove('open');
            hamburgerBtn.setAttribute('aria-expanded', 'false');
        }

        function toggleMenu() {
            if (isMenuOpen) closeMenu();
            else openMenu();
        }

        function reloadCurrent() {
            if (!frame.src) return;
            placeholder.classList.remove('hidden');
            try {
                const win = frame.contentWindow;
                if (win && win.location) {
                    win.location.reload(true);
                    setTimeout(() => { placeholder.classList.add('hidden'); }, 3000);
                    return;
                }
            } catch (e) { /* fallback */ }
            const src = frame.src;
            frame.src = '';
            clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => { frame.src = src; }, 30);
            setTimeout(() => { placeholder.classList.add('hidden'); }, 3000);
        }

        // ================================================================
        //  番茄钟逻辑（基于时间戳，抗节能）
        // ================================================================
        const timerDisplay = document.getElementById('timerDisplay');
        const startStudyBtn = document.getElementById('startStudyBtn');
        const tomatoBtn = document.getElementById('tomatoBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const tomatoMinutes = document.getElementById('tomatoMinutes');
        const saveSettings = document.getElementById('saveSettings');
        const cancelSettings = document.getElementById('cancelSettings');

        const tomatoClock = document.getElementById('tomatoClock');
        const tomatoClose = document.getElementById('tomatoClose');
        const comboWrapper = document.getElementById('comboWrapper');
        const fabBadge = document.getElementById('fabBadge');

        const tomatoTrigger = document.getElementById('tomatoTrigger');
        const noteTrigger = document.getElementById('noteTrigger');
        const notePanel = document.getElementById('notePanel');
        const noteClose = document.getElementById('noteClose');
        const noteText = document.getElementById('noteText');
        const noteSaveBtn = document.getElementById('noteSaveBtn');
        const saveStatus = document.getElementById('saveStatus');

        let timerState = 'idle';
        let timerMode = 'countdown';
        let timerInterval = null;
        let remainingSeconds = 25 * 60;
        let totalSeconds = 25 * 60;
        let prepSeconds = 5;
        let startTimestamp = null;

        // ----- 番茄钟折叠/展开 -----
        let isTomatoOpen = false;

        function openTomato() {
            if (isNoteOpen) closeNote();
            isTomatoOpen = true;
            tomatoClock.classList.add('open');
            comboWrapper.classList.add('hidden');
        }

        function closeTomato() {
            isTomatoOpen = false;
            tomatoClock.classList.remove('open');
            comboWrapper.classList.remove('hidden');
        }

        function toggleTomato() {
            if (isTomatoOpen) closeTomato();
            else openTomato();
        }

        // ----- 速记便签折叠/展开 -----
        let isNoteOpen = false;

        function openNote() {
            if (isTomatoOpen) closeTomato();
            isNoteOpen = true;
            notePanel.classList.add('open');
            comboWrapper.classList.add('hidden');
            loadNote();
            noteText.focus();
        }

        function closeNote() {
            isNoteOpen = false;
            notePanel.classList.remove('open');
            comboWrapper.classList.remove('hidden');
            saveNote();
        }

        function toggleNote() {
            if (isNoteOpen) closeNote();
            else openNote();
        }

        // ----- 速记便签存储 -----
        function loadNote() {
            try {
                const data = localStorage.getItem('quick_note');
                if (data) noteText.value = data;
            } catch (e) { /* ignore */ }
        }

        function saveNote() {
            try {
                localStorage.setItem('quick_note', noteText.value);
                saveStatus.textContent = '已保存';
                saveStatus.className = 'save-status saved';
                setTimeout(() => {
                    saveStatus.className = 'save-status';
                }, 2000);
            } catch (e) { /* ignore */ }
        }

        function autoSaveNote() {
            try {
                localStorage.setItem('quick_note', noteText.value);
                saveStatus.textContent = '已保存';
                saveStatus.className = 'save-status saved';
                clearTimeout(noteText._saveTimer);
                noteText._saveTimer = setTimeout(() => {
                    saveStatus.className = 'save-status';
                }, 1500);
            } catch (e) { /* ignore */ }
        }

        // ----- 计时器核心 -----
        function updateDisplayFromTimestamp() {
            if (timerState !== 'running' && timerState !== 'prep') return;
            if (startTimestamp === null) return;

            const now = Date.now();
            let elapsed = (now - startTimestamp) / 1000;

            if (timerMode === 'stopwatch') {
                const seconds = Math.floor(elapsed);
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                remainingSeconds = seconds;
            } else if (timerMode === 'countdown') {
                let remaining = totalSeconds - elapsed;
                if (remaining < 0) remaining = 0;
                const mins = Math.floor(remaining / 60);
                const secs = Math.floor(remaining % 60);
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                remainingSeconds = remaining;
                if (remaining <= 0) {
                    stopTimer();
                }
            }
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerState = 'idle';
            timerDisplay.className = 'timer-display idle';
            fabBadge.classList.remove('active');
            if (timerMode === 'countdown') {
                remainingSeconds = totalSeconds;
                const mins = Math.floor(remainingSeconds / 60);
                const secs = remainingSeconds % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            } else {
                remainingSeconds = 0;
                timerDisplay.textContent = '00:00';
            }
            startStudyBtn.innerHTML = '<i class="fas fa-play"></i> 开始做题';
            tomatoBtn.innerHTML = '<i class="fas fa-clock"></i> 番茄钟';
            startTimestamp = null;
        }

        function startStopwatch() {
            if (timerInterval) stopTimer();
            timerState = 'running';
            timerMode = 'stopwatch';
            startTimestamp = Date.now();
            remainingSeconds = 0;
            timerDisplay.textContent = '00:00';
            timerDisplay.className = 'timer-display running';
            fabBadge.classList.add('active');
            startStudyBtn.innerHTML = '<i class="fas fa-stop"></i> 停止';
            tomatoBtn.innerHTML = '<i class="fas fa-clock"></i> 番茄钟';

            timerInterval = setInterval(() => {
                updateDisplayFromTimestamp();
            }, 200);
        }

        function startCountdown() {
            if (timerInterval) stopTimer();
            timerState = 'running';
            timerMode = 'countdown';
            startTimestamp = Date.now();
            remainingSeconds = totalSeconds;
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            timerDisplay.className = 'timer-display running';
            fabBadge.classList.add('active');
            startStudyBtn.innerHTML = '<i class="fas fa-play"></i> 开始做题';
            tomatoBtn.innerHTML = '<i class="fas fa-stop"></i> 停止';

            timerInterval = setInterval(() => {
                updateDisplayFromTimestamp();
            }, 200);
        }

        function startPrep() {
            if (timerInterval) stopTimer();
            timerState = 'prep';
            timerMode = 'stopwatch';
            startTimestamp = Date.now();
            let prepLeft = prepSeconds;
            timerDisplay.textContent = `00:${String(prepLeft).padStart(2, '0')}`;
            timerDisplay.className = 'timer-display prep';
            fabBadge.classList.add('active');
            startStudyBtn.innerHTML = `<i class="fas fa-hourglass-half"></i> 准备 ${prepLeft}s`;
            tomatoBtn.innerHTML = '<i class="fas fa-clock"></i> 番茄钟';

            timerInterval = setInterval(() => {
                const now = Date.now();
                const elapsed = (now - startTimestamp) / 1000;
                const remainingPrep = prepSeconds - elapsed;
                if (remainingPrep <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    startStopwatch();
                } else {
                    const displaySecs = Math.ceil(remainingPrep);
                    timerDisplay.textContent = `00:${String(displaySecs).padStart(2, '0')}`;
                    startStudyBtn.innerHTML = `<i class="fas fa-hourglass-half"></i> 准备 ${displaySecs}s`;
                }
            }, 100);
        }

        function handleStartStudy() {
            if (timerState === 'idle') {
                startPrep();
                if (!isTomatoOpen) openTomato();
            } else if (timerState === 'prep') {
                stopTimer();
            } else if (timerState === 'running' && timerMode === 'stopwatch') {
                stopTimer();
            }
        }

        function handleTomato() {
            if (timerState === 'idle') {
                startCountdown();
                if (!isTomatoOpen) openTomato();
            } else if (timerState === 'prep') {
                stopTimer();
            } else if (timerState === 'running' && timerMode === 'countdown') {
                stopTimer();
            }
        }

        // ----- 设置功能 -----
        function openSettings() {
            tomatoMinutes.value = Math.floor(totalSeconds / 60);
            settingsModal.classList.add('open');
        }

        function closeSettings() {
            settingsModal.classList.remove('open');
        }

        function saveSettingsHandler() {
            let val = parseInt(tomatoMinutes.value);
            if (isNaN(val) || val < 1) val = 25;
            if (val > 120) val = 120;
            totalSeconds = val * 60;
            if (timerState === 'idle') {
                remainingSeconds = totalSeconds;
                const mins = Math.floor(remainingSeconds / 60);
                const secs = remainingSeconds % 60;
                timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                timerDisplay.className = 'timer-display idle';
            }
            closeSettings();
        }

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        // ================================================================
        //  全局涟漪
        // ================================================================
        const MAX_RIPPLES = 20;
        const ripples = [];

        function createGlobalRipple(e) {
            const x = e.clientX;
            const y = e.clientY;
            const size = 80;
            const el = document.createElement('div');
            el.className = 'global-ripple';
            el.style.left = (x - size / 2) + 'px';
            el.style.top = (y - size / 2) + 'px';
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            document.body.appendChild(el);
            ripples.push(el);
            if (ripples.length > MAX_RIPPLES) {
                const old = ripples.shift();
                if (old.parentNode) old.parentNode.removeChild(old);
            }
            el.addEventListener('animationend', function() {
                if (el.parentNode) el.parentNode.removeChild(el);
                const idx = ripples.indexOf(el);
                if (idx !== -1) ripples.splice(idx, 1);
            });
        }

        // ================================================================
        //  初始化
        // ================================================================
        function init() {
            renderTools();
            frame.addEventListener('load', onIframeLoad);
            window.addEventListener('message', handleMessage);

            hamburgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });
            hamburgerBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMenu();
                }
            });

            reloadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                reloadCurrent();
            });

            document.addEventListener('click', (e) => {
                if (isMenuOpen && !menuPanel.contains(e.target) && e.target !== hamburgerBtn && !hamburgerBtn
                    .contains(e.target)) {
                    closeMenu();
                }
                createGlobalRipple(e);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isMenuOpen) closeMenu();
                if ((e.key === 'r' || e.key === 'R') && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    reloadCurrent();
                }
            });

            // ---- 组合按钮事件 ----
            tomatoTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                openTomato();
            });

            noteTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                openNote();
            });

            // ---- 番茄钟事件 ----
            tomatoClose.addEventListener('click', closeTomato);

            startStudyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                handleStartStudy();
            });
            tomatoBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                handleTomato();
            });
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openSettings();
            });
            saveSettings.addEventListener('click', saveSettingsHandler);
            cancelSettings.addEventListener('click', closeSettings);

            // ---- 速记便签事件 ----
            noteClose.addEventListener('click', closeNote);
            noteSaveBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                saveNote();
            });
            noteText.addEventListener('input', autoSaveNote);

            // ---- 加载第一个工具 ----
            const first = TOOLS[0];
            if (first) {
                switchTool(first.id);
            }
            closeMenu();

            // 默认折叠所有卡片
            closeTomato();
            closeNote();
            comboWrapper.classList.remove('hidden');

            // 初始化计时器显示
            remainingSeconds = totalSeconds;
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            timerDisplay.className = 'timer-display idle';

            // 加载速记内容
            loadNote();

            setTimeout(() => {
                placeholder.classList.add('hidden');
            }, 5000);

            console.log('✅ 沉浸学习 · 组合按钮（草绿/淡钴蓝）+ 速记 + 番茄钟 已启动');
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

        // 暴露 API
        window.__learnNav = {
            switchTool,
            getTools: () => TOOLS,
            getCurrent: () => currentId,
            reload: reloadCurrent,
            openMenu,
            closeMenu,
            toggleMenu,
            isMenuOpen: () => isMenuOpen,
            openTomato,
            closeTomato,
            openNote,
            closeNote
        };
    </script>
</body>
</html>
