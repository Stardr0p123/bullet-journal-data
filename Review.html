        <div class="gp-actions">
            <button class="btn-sm btn-primary" id="uploadToGitBtn"><i class="fas fa-upload"></i> 上传至git</button>
            <button class="btn-sm btn-primary" id="importFromGitBtn"><i class="fas fa-download"></i> 从Git导入</button>
            <button class="btn-sm" id="linkToGitBtn"><i class="fas fa-link"></i> 链接至github</button>
        </div>
        <div class="gp-hint">
            <i class="fas fa-info-circle"></i> 令牌需具有 repo 权限。数据保存到 <code>/data/review_plan.json</code>
        </div>
    </div>

    <!-- ===== 浮动按钮 ===== -->
    <button class="github-toggle-btn" id="githubToggleBtn">
        <i class="fab fa-github"></i> 同步到GitHub
    </button>

    <!-- ========================== JavaScript ========================== -->
    <script>
        (function() {
            'use strict';

            // ================================================================
            //  背景鼠标跟随
            // ================================================================
            const body = document.body;

            function updateBackground(e) {
                const x = e.clientX / window.innerWidth * 100;
                const y = e.clientY / window.innerHeight * 100;
                body.style.setProperty('--mouse-x', x + '%');
                body.style.setProperty('--mouse-y', y + '%');
            }
            document.addEventListener('mousemove', updateBackground);

            // ================================================================
            //  配置 & 常量
            // ================================================================
            const STORAGE_KEY = 'algo_review_note_v5';
            const GITHUB_SETTINGS_KEY = 'github_settings_review_plan';
            const REVIEW_SCHEDULE = [
                { label: '第1次', daysAfter: 1, key: 'd1' },
                { label: '第2次', daysAfter: 2, key: 'd2' },
                { label: '第3次', daysAfter: 4, key: 'd4' },
                { label: '第4次', daysAfter: 7, key: 'd7' },
                { label: '第5次', daysAfter: 15, key: 'd15' },
                { label: '第6次', daysAfter: 30, key: 'd30' },
            ];

            // ================================================================
            //  状态
            // ================================================================
            let algorithms = [];
            let currentTab = 'all';
            let catFilter = 'all';
            let diffFilter = 'all';
            let expandedId = null;
            let selectedAlgoId = null;
            let formDiff = 'easy';
            let noteMode = 'edit';
            let noteSaveTimer = null;
            let isNoteDirty = false;
            let confirmCallback = null;

            // ================================================================
            //  工具
            // ================================================================
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function parseDate(s) { return new Date(s + 'T00:00:00'); }

            function formatDate(s) {
                const d = parseDate(s);
                const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
                return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + wd;
            }

            function formatDateShort(s) {
                const d = parseDate(s);
                return (d.getMonth() + 1) + '/' + d.getDate();
            }

            function genId() { return 'algo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ================================================================
            //  GitHub 相关存储
            // ================================================================
            function loadGitHubSettings() {
                try {
                    const raw = localStorage.getItem(GITHUB_SETTINGS_KEY);
                    if (raw) {
                        const settings = JSON.parse(raw);
                        document.getElementById('githubUsername').value = settings.username || '';
                        document.getElementById('githubRepo').value = settings.repo || '';
                        document.getElementById('githubToken').value = settings.token || '';
                    }
                } catch (e) { /* ignore */ }
            }

            function saveGitHubSettings() {
                const settings = {
                    username: document.getElementById('githubUsername').value.trim(),
                    repo: document.getElementById('githubRepo').value.trim(),
                    token: document.getElementById('githubToken').value.trim()
                };
                try {
                    localStorage.setItem(GITHUB_SETTINGS_KEY, JSON.stringify(settings));
                } catch (e) { /* ignore */ }
            }

            function getGitHubSettings() {
                return {
                    username: document.getElementById('githubUsername').value.trim(),
                    repo: document.getElementById('githubRepo').value.trim(),
                    token: document.getElementById('githubToken').value.trim()
                };
            }

            // ================================================================
            //  UTF-8 Base64 辅助
            // ================================================================
            function utf8ToBase64(str) {
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                const decoder = new TextDecoder('utf-8');
                return decoder.decode(bytes);
            }

            // ================================================================
            //  GitHub API 操作
            // ================================================================
            function getFullData() {
                return { algorithms };
            }

            function loadFullData(data) {
                if (data.algorithms && Array.isArray(data.algorithms)) {
                    algorithms = data.algorithms.map(a => ({
                        ...a,
                        reviewNodes: Array.isArray(a.reviewNodes) ? a.reviewNodes : buildNodes(a.learnDate),
                        note: a.note || '',
                        difficulty: a.difficulty || 'easy',
                    }));
                    algorithms.forEach(a => {
                        a.reviewNodes.forEach(n => { if (n.done === undefined) n.done = false; });
                    });
                    saveData();
                    if (algorithms.length > 0 && !selectedAlgoId) {
                        selectedAlgoId = algorithms[0].id;
                    }
                    updateAll();
                    updateNoteEditor();
                    showToast('✅ 成功从 GitHub 导入数据!', 'success');
                } else {
                    showToast('❌ 数据格式错误，缺少 algorithms 字段', 'warning');
                }
            }

            async function uploadToGit() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo || !settings.token) {
                    showToast('请填写完整的 GitHub 信息（用户名、仓库名、令牌）', 'warning');
                    return;
                }
                saveGitHubSettings();
                if (!confirm('确定将当前数据上传到 GitHub 仓库 ' + settings.username + '/' + settings.repo +
                        ' 的 /data/review_plan.json 吗？')) {
                    return;
                }

                const apiUrl =
                    `https://api.github.com/repos/${settings.username}/${settings.repo}/contents/data/review_plan.json`;
                const fullData = getFullData();
                const contentStr = JSON.stringify(fullData, null, 2);
                const contentBase64 = utf8ToBase64(contentStr);

                try {
                    let sha = null;
                    try {
                        const getResp = await fetch(apiUrl, {
                            headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json' }
                        });
                        if (getResp.ok) {
                            const data = await getResp.json();
                            sha = data.sha;
                        } else if (getResp.status !== 404) {
                            const err = await getResp.json();
                            throw new Error('获取文件信息失败: ' + (err.message || getResp.statusText));
                        }
                    } catch (e) { if (e.message && e.message.includes('404')) {} else throw e; }

                    const body = {
                        message: '更新复习计划数据 ' + new Date().toISOString(),
                        content: contentBase64,
                        sha: sha || undefined
                    };

                    const putResp = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${settings.token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (!putResp.ok) {
                        const err = await putResp.json();
                        throw new Error('上传失败: ' + (err.message || putResp.statusText));
                    }
                    showToast('✅ 数据已成功上传至 GitHub!', 'success');
                } catch (error) {
                    console.error('上传错误:', error);
                    showToast('❌ 上传失败: ' + error.message, 'error');
                }
            }

            async function importFromGit() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo || !settings.token) {
                    showToast('请填写完整的 GitHub 信息（用户名、仓库名、令牌）', 'warning');
                    return;
                }
                saveGitHubSettings();
                if (!confirm('确定从 GitHub 仓库 ' + settings.username + '/' + settings.repo +
                        ' 的 /data/review_plan.json 导入数据吗？\n这将替换当前所有本地数据！')) {
                    return;
                }

                const apiUrl =
                    `https://api.github.com/repos/${settings.username}/${settings.repo}/contents/data/review_plan.json`;

                try {
                    const resp = await fetch(apiUrl, {
                        headers: {
                            'Authorization': `token ${settings.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (!resp.ok) {
                        if (resp.status === 404) {
                            throw new Error('远程文件不存在，请先上传数据');
                        }
                        const err = await resp.json();
                        throw new Error('获取数据失败: ' + (err.message || resp.statusText));
                    }

                    const data = await resp.json();
                    const content = base64ToUtf8(data.content);
                    const imported = JSON.parse(content);

                    if (!imported.algorithms || !Array.isArray(imported.algorithms)) {
                        throw new Error('数据格式错误，缺少 algorithms 字段');
                    }

                    loadFullData(imported);
                } catch (error) {
                    console.error('导入错误:', error);
                    showToast('❌ 导入失败: ' + error.message, 'error');
                }
            }

            function openGitHubRepo() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo) {
                    showToast('请先填写用户名和仓库名', 'warning');
                    return;
                }
                saveGitHubSettings();
                window.open(`https://github.com/${settings.username}/${settings.repo}`, '_blank');
                showToast('正在打开仓库...', 'info');
            }

            // ================================================================
            //  面板开关 (使用 addEventListener)
            // ================================================================
            let githubPanelOpen = false;

            function toggleGitHubPanel() {
                githubPanelOpen = !githubPanelOpen;
                const panel = document.getElementById('githubPanel');
                const btn = document.getElementById('githubToggleBtn');
                if (githubPanelOpen) {
                    panel.classList.add('open');
                    btn.style.display = 'none';
                } else {
                    panel.classList.remove('open');
                    btn.style.display = 'flex';
                }
            }

            // ===== 使用 addEventListener 绑定三个按钮 =====
            document.getElementById('openGitHubBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('githubToggleBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('closeGitHubPanelBtn').addEventListener('click', toggleGitHubPanel);

            // ===== 绑定 GitHub 其他操作按钮 =====
            document.getElementById('uploadToGitBtn').addEventListener('click', uploadToGit);
            document.getElementById('importFromGitBtn').addEventListener('click', importFromGit);
            document.getElementById('linkToGitBtn').addEventListener('click', openGitHubRepo);

            // ================================================================
            //  数据管理
            // ================================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        algorithms = JSON.parse(raw);
                        algorithms.forEach(a => {
                            if (!a.difficulty) a.difficulty = 'easy';
                            if (!a.note) a.note = '';
                            if (!a.reviewNodes || a.reviewNodes.length === 0) {
                                a.reviewNodes = buildNodes(a.learnDate);
                            }
                            a.reviewNodes.forEach(n => { if (n.done === undefined) n.done = false; });
                        });
                    } else {
                        algorithms = [];
                    }
                } catch (e) {
                    console.error('加载失败', e);
                    algorithms = [];
                }
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(algorithms));
                } catch (e) {
                    console.error('保存失败', e);
                    showToast('保存失败，请检查存储空间', 'warning');
                }
            }

            function buildNodes(learnDate) {
                return REVIEW_SCHEDULE.map(s => {
                    const d = new Date(parseDate(learnDate));
                    d.setDate(d.getDate() + s.daysAfter);
                    const ds = d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0');
                    return { label: s.label, daysAfter: s.daysAfter, key: s.key, date: ds, done: false };
                });
            }

            function createAlgo(name, category, difficulty, desc, learnDate) {
                return {
                    id: genId(),
                    name,
                    category,
                    difficulty,
                    description: desc || '',
                    learnDate,
                    note: '',
                    reviewNodes: buildNodes(learnDate),
                    createdAt: new Date().toISOString(),
                };
            }

            // ================================================================
            //  核心操作
            // ================================================================
            function addAlgo(e) {
                e.preventDefault();
                const name = document.getElementById('algoName').value.trim();
                const category = document.getElementById('algoCategory').value;
                const learnDate = document.getElementById('algoLearnDate').value;
                const desc = document.getElementById('algoDesc').value.trim();
                if (!name) { showToast('请输入算法名称', 'warning');
                    document.getElementById('algoName').focus(); return; }
                if (!learnDate) { showToast('请选择学习日期', 'warning');
                    document.getElementById('algoLearnDate').focus(); return; }

                const algo = createAlgo(name, category, formDiff, desc, learnDate);
                algorithms.unshift(algo);
                saveData();
                updateAll();

                document.getElementById('algoName').value = '';
                document.getElementById('algoDesc').value = '';
                document.getElementById('algoLearnDate').value = getTodayStr();
                document.getElementById('algoCategory').value = '数据结构';
                formDiff = 'easy';
                document.querySelectorAll('#diffToggle .diff-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('#diffToggle .diff-btn[data-diff="easy"]')?.classList.add('active');
                document.getElementById('algoName').focus();

                showToast('✅ 已加入「' + algo.name + '」', 'success');
                triggerBurst(e);
            }

            function checkIn(algoId, nodeIdx, ev) {
                const algo = algorithms.find(a => a.id === algoId);
                if (!algo) return;
                const node = algo.reviewNodes[nodeIdx];
                if (!node || node.done) return;

                const today = getTodayStr();
                if (node.date > today) {
                    showToast('⏳ 该节点尚未解锁，' + formatDate(node.date) + ' 后方可打卡', 'warning');
                    return;
                }

                node.done = true;
                node.checkedAt = new Date().toISOString();
                saveData();
                updateAll();
                if (node.date === today) {
                    showToast('🎯 准时打卡！' + algo.name + ' ' + node.label, 'success');
                } else {
                    const days = Math.floor((parseDate(today) - parseDate(node.date)) / (1000 * 60 * 60 * 24));
                    showToast('📝 补打卡完成（逾期' + days + '天）', 'warning');
                }
                if (ev) triggerBurst(ev);
            }

            function deleteAlgo(algoId, ev) {
                if (ev) ev.stopPropagation();
                const algo = algorithms.find(a => a.id === algoId);
                if (!algo) return;
                showConfirm('删除算法', '确定要删除 <strong>' + escapeHtml(algo.name) + '</strong> 及其所有记录吗？<br><span style="font-size:11px;color:#94a3b8;">不可恢复</span>', () => {
                    algorithms = algorithms.filter(a => a.id !== algoId);
                    if (expandedId === algoId) expandedId = null;
                    if (selectedAlgoId === algoId) {
                        selectedAlgoId = null;
                        updateNoteEditor();
                    }
                    saveData();
                    updateAll();
                    showToast('已删除「' + algo.name + '」', 'info');
                });
            }

            // ================================================================
            //  笔记相关
            // ================================================================
            function selectAlgo(algoId) {
                if (selectedAlgoId === algoId) return;
                saveCurrentNote();
                selectedAlgoId = algoId;
                updateNoteEditor();
                renderList();
            }

            function getSelectedAlgo() {
                return algorithms.find(a => a.id === selectedAlgoId) || null;
            }

            function updateNoteEditor() {
                const algo = getSelectedAlgo();
                const nameEl = document.getElementById('noteAlgoName');
                const editor = document.getElementById('noteEditor');
                const preview = document.getElementById('notePreview');

                if (!algo) {
                    nameEl.innerHTML = '<span class="empty"><i class="fas fa-hand-point-left"></i> 选择算法查看笔记</span>';
                    editor.value = '';
                    preview.innerHTML = '';
                    document.getElementById('noteSaveStatus').textContent = '💾 已保存';
                    return;
                }

                nameEl.innerHTML = `
                        <span class="name-icon"><i class="fas fa-book"></i></span>
                        <span>${escapeHtml(algo.name)}</span>
                    `;
                editor.value = algo.note || '';
                renderPreview(algo.note || '');
                document.getElementById('noteSaveStatus').textContent = '💾 已保存';
                isNoteDirty = false;
                setNoteMode('edit', document.querySelector('.mode-btn[data-mode="edit"]'));
            }

            function onNoteChange() {
                isNoteDirty = true;
                document.getElementById('noteSaveStatus').textContent = '⏳ 未保存';
                if (noteSaveTimer) clearTimeout(noteSaveTimer);
                noteSaveTimer = setTimeout(() => { saveCurrentNote(); }, 500);
                if (noteMode === 'preview') {
                    const val = document.getElementById('noteEditor').value;
                    renderPreview(val);
                }
            }

            function saveCurrentNote() {
                const algo = getSelectedAlgo();
                if (!algo) return;
                const val = document.getElementById('noteEditor').value;
                if (algo.note !== val) {
                    algo.note = val;
                    saveData();
                }
                isNoteDirty = false;
                document.getElementById('noteSaveStatus').textContent = '💾 已保存';
                if (noteMode === 'preview') renderPreview(val);
            }

            function renderPreview(md) {
                const preview = document.getElementById('notePreview');
                if (!md || md.trim() === '') {
                    preview.innerHTML = '<span style="color:var(--text-muted);font-size:13px;"><i class="fas fa-pencil-alt"></i> 笔记为空，开始记录吧...</span>';
                    return;
                }
                try {
                    const html = marked.parse(md);
                    preview.innerHTML = html;
                    if (typeof renderMathInElement === 'function') {
                        renderMathInElement(preview, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false },
                                { left: '\\(', right: '\\)', display: false },
                                { left: '\\[', right: '\\]', display: true },
                            ],
                            throwOnError: false,
                        });
                    }
                } catch (e) {
                    preview.innerHTML = '<span style="color:var(--danger);">⚠️ 渲染错误：' + escapeHtml(e.message) + '</span>';
                }
            }

            function setNoteMode(mode, btn) {
                noteMode = mode;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');

                const editor = document.getElementById('noteEditor');
                const preview = document.getElementById('notePreview');

                if (mode === 'edit') {
                    editor.style.display = 'block';
                    preview.classList.remove('show');
                    saveCurrentNote();
                } else {
                    editor.style.display = 'none';
                    preview.classList.add('show');
                    const val = document.getElementById('noteEditor').value;
                    renderPreview(val);
                }
            }

            // ================================================================
            //  获取下一次复习节点
            // ================================================================
            function getNextReview(algo) {
                const today = getTodayStr();
                const upcoming = algo.reviewNodes.filter(n => !n.done && n.date >= today);
                if (upcoming.length === 0) return null;
                upcoming.sort((a, b) => a.date.localeCompare(b.date));
                return upcoming[0];
            }

            // ================================================================
            //  渲染算法列表
            // ================================================================
            function getFiltered() {
                const q = document.getElementById('searchInput')?.value?.trim().toLowerCase() || '';
                const today = getTodayStr();
                const td = new Date(parseDate(today));
                const threeLater = new Date(td);
                threeLater.setDate(threeLater.getDate() + 3);
                const threeStr = threeLater.getFullYear() + '-' +
                    String(threeLater.getMonth() + 1).padStart(2, '0') + '-' +
                    String(threeLater.getDate()).padStart(2, '0');

                let list = [...algorithms];

                if (catFilter !== 'all') list = list.filter(a => a.category === catFilter);
                if (diffFilter !== 'all') list = list.filter(a => a.difficulty === diffFilter);
                if (q) list = list.filter(a => a.name.toLowerCase().includes(q));

                if (currentTab === 'due') {
                    list = list.filter(a => a.reviewNodes.some(n => !n.done && n.date <= today));
                    list.sort((a, b) => {
                        const ao = a.reviewNodes.some(n => !n.done && n.date < today);
                        const bo = b.reviewNodes.some(n => !n.done && n.date < today);
                        if (ao && !bo) return -1;
                        if (!ao && bo) return 1;
                        return 0;
                    });
                } else if (currentTab === 'upcoming') {
                    list = list.filter(a => a.reviewNodes.some(n => !n.done && n.date > today && n.date <= threeStr));
                    list.sort((a, b) => {
                        const an = a.reviewNodes.filter(n => !n.done && n.date > today).sort((x, y) => x.date
                            .localeCompare(y.date))[0];
                        const bn = b.reviewNodes.filter(n => !n.done && n.date > today).sort((x, y) => x.date
                            .localeCompare(y.date))[0];
                        if (!an) return 1;
                        if (!bn) return -1;
                        return an.date.localeCompare(bn.date);
                    });
                }

                return list;
            }

            function getNodeStatus(node) {
                const today = getTodayStr();
                if (node.done) return 'done';
                if (node.date === today) return 'today';
                if (node.date < today) return 'overdue';
                return 'upcoming';
            }

            function renderList() {
                const list = getFiltered();
                const el = document.getElementById('algoList');

                if (list.length === 0) {
                    let icon = 'fa-inbox',
                        msg = '没有匹配的算法';
                    if (currentTab === 'due') { icon = 'fa-check-circle';
                        msg = '没有待复习的内容'; } else if (currentTab === 'upcoming') { icon = 'fa-calendar';
                        msg = '未来3天没有到期复习'; } else if (algorithms.length === 0) { icon = 'fa-inbox';
                        msg = '还没有算法，在中间栏添加吧！'; }
                    el.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas ${icon}"></i></div><p>${msg}</p></div>`;
                    updateCounts();
                    return;
                }

                const catMap = {
                    '数据结构': 'cat-ds',
                    '动态规划': 'cat-dp',
                    '字符串': 'cat-string',
                    '基础算法': 'cat-basic',
                    '数学': 'cat-math',
                    '图论': 'cat-graph',
                    '杂项': 'cat-misc'
                };

                el.innerHTML = list.map(algo => {
                    const isExp = expandedId === algo.id;
                    const isActive = selectedAlgoId === algo.id;
                    const total = algo.reviewNodes.length;
                    const done = algo.reviewNodes.filter(n => n.done).length;
                    const hasOverdue = algo.reviewNodes.some(n => getNodeStatus(n) === 'overdue');
                    const hasToday = algo.reviewNodes.some(n => getNodeStatus(n) === 'today');

                    const allDone = done === total;

                    let daysBadge = '';
                    if (allDone) {
                        daysBadge = `<span class="days-badge done">✓</span>`;
                    } else {
                        const next = getNextReview(algo);
                        if (next) {
                            const today = new Date(parseDate(getTodayStr()));
                            const nextDate = new Date(parseDate(next.date));
                            const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
                            let cls = 'days-badge';
                            if (diffDays < 0) cls += ' overdue';
                            else if (diffDays === 0) cls += ' today';
                            else if (diffDays <= 3) cls += ' soon';
                            const label = diffDays < 0 ? String(diffDays) : (diffDays === 0 ? '0' : String(diffDays));
                            daysBadge = `<span class="${cls}" title="距离下一次复习还有 ${diffDays} 天">${label}</span>`;
                        } else {
                            daysBadge = `<span class="days-badge warning" title="尚有逾期复习">⚠️</span>`;
                        }
                    }

                    const dotsHtml = isExp ? '' : algo.reviewNodes.map((n, idx) => {
                        const s = getNodeStatus(n);
                        return `<span class="dot ${s}" onclick="event.stopPropagation(); checkIn('${algo.id}',${idx},event)" title="${n.label}: ${n.date}"></span>`;
                    }).join('');

                    const panelDots = algo.reviewNodes.map((n, idx) => {
                        const s = getNodeStatus(n);
                        return `<span class="dot ${s}" onclick="event.stopPropagation(); checkIn('${algo.id}',${idx},event)" title="${n.label}: ${n.date}"></span>`;
                    }).join('');

                    let nextText = '';
                    if (allDone) {
                        nextText = '<span class="done-text">🎉 全部完成</span>';
                    } else {
                        const next = getNextReview(algo);
                        if (next) {
                            const diffDays = Math.ceil((parseDate(next.date) - parseDate(getTodayStr())) / (1000 * 60 *
                            60 * 24));
                            if (diffDays === 0) {
                                nextText = `<span>距离下一次复习还有 <span class="highlight">今天</span></span>`;
                            } else if (diffDays > 0) {
                                nextText = `<span>距离下一次复习还有 <span class="highlight">${diffDays} 天</span></span>`;
                            } else {
                                nextText = `<span class="danger-text">已逾期 ${Math.abs(diffDays)} 天，请尽快复习</span>`;
                            }
                        } else {
                            nextText = `<span class="danger-text">尚有逾期复习，请尽快完成</span>`;
                        }
                    }

                    const catClass = catMap[algo.category] || 'cat-misc';
                    const diffClass = algo.difficulty === 'hard' ? 'hard' : 'easy';
                    const diffLabel = algo.difficulty === 'hard' ? '困难' : '简单';
                    const descTitle = algo.description ? escapeHtml(algo.description) : '';

                    return `
                            <div class="algo-item ${isExp ? 'expanded' : ''} ${isActive ? 'active' : ''}">
                                <div class="algo-item-header" onclick="onAlgoClick('${algo.id}')">
                                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                                    ${daysBadge}
                                    <span class="cat-tag ${catClass}">${escapeHtml(algo.category)}</span>
                                    <span class="diff-tag ${diffClass}">${diffLabel}</span>
                                    <div class="info">
                                        <div class="name">
                                            <span class="name-text" title="${descTitle}">${escapeHtml(algo.name)}</span>
                                        </div>
                                    </div>
                                    <div class="dots">${dotsHtml}</div>
                                    ${hasOverdue ? '<span style="font-size:14px;" title="有逾期"><i class="fas fa-exclamation-circle" style="color:var(--danger);"></i></span>' : ''}
                                    ${hasToday && !hasOverdue ? '<span style="font-size:14px;" title="今日待复习"><i class="fas fa-clock" style="color:var(--warning);"></i></span>' : ''}
                                    <button class="del-btn" onclick="deleteAlgo('${algo.id}',event)" title="删除"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                <div class="review-panel">
                                    <div class="review-summary">
                                        <div class="review-dots">${panelDots}</div>
                                        <div class="review-next">${nextText}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                }).join('');

                updateCounts();
            }

            // ================================================================
            //  点击算法
            // ================================================================
            window.onAlgoClick = function(algoId) {
                if (expandedId === algoId) {
                    expandedId = null;
                } else {
                    expandedId = algoId;
                }
                if (selectedAlgoId !== algoId) {
                    saveCurrentNote();
                    selectedAlgoId = algoId;
                    updateNoteEditor();
                } else {
                    updateNoteEditor();
                }
                renderList();
                const cards = document.querySelectorAll('.algo-item');
                for (const card of cards) {
                    if (card.querySelector('.name-text')?.textContent === algorithms.find(a => a.id === algoId)?.name) {
                        card.scrollIntoView({ block: 'center', behavior: 'smooth' });
                        break;
                    }
                }
            };

            // ================================================================
            //  统计 & 计数
            // ================================================================
            function updateCounts() {
                const today = getTodayStr();
                const td = new Date(parseDate(today));
                const threeLater = new Date(td);
                threeLater.setDate(threeLater.getDate() + 3);
                const threeStr = threeLater.getFullYear() + '-' +
                    String(threeLater.getMonth() + 1).padStart(2, '0') + '-' +
                    String(threeLater.getDate()).padStart(2, '0');

                const total = algorithms.length;
                const due = algorithms.filter(a => a.reviewNodes.some(n => !n.done && n.date <= today)).length;
                const up = algorithms.filter(a => a.reviewNodes.some(n => !n.done && n.date > today && n.date <= threeStr))
                    .length;

                document.getElementById('tabCntAll').textContent = total;
                document.getElementById('tabCntDue').textContent = due;
                document.getElementById('tabCntUp').textContent = up;

                let doneNodes = 0,
                    allNodes = 0;
                algorithms.forEach(a => {
                    a.reviewNodes.forEach(n => {
                        allNodes++;
                        if (n.done) doneNodes++;
                    });
                });
                document.getElementById('statTotal').textContent = total;
                document.getElementById('statDue').textContent = due;
                document.getElementById('statDone').textContent = doneNodes;
                document.getElementById('statRate').textContent = allNodes > 0 ? Math.round(doneNodes / allNodes * 100) +
                    '%' : '0%';

                const badge = document.getElementById('headerDueBadge');
                document.getElementById('headerDueCount').textContent = due;
                const hasOverdue = algorithms.some(a => a.reviewNodes.some(n => !n.done && n.date < today));
                if (due === 0) {
                    badge.style.display = 'none';
                } else {
                    badge.style.display = 'inline-flex';
                    badge.classList.toggle('urgent', hasOverdue);
                }

                renderDueList();
                updateTabSlider();
            }

            function renderDueList() {
                const el = document.getElementById('dueList');
                const today = getTodayStr();
                const items = [];
                algorithms.forEach(algo => {
                    algo.reviewNodes.forEach((n, idx) => {
                        if (!n.done && n.date <= today) {
                            items.push({ algoId: algo.id, name: algo.name, nodeIdx: idx, label: n.label,
                                date: n.date, isOverdue: n.date < today });
                        }
                    });
                });
                items.sort((a, b) => {
                    if (a.isOverdue && !b.isOverdue) return -1;
                    if (!a.isOverdue && b.isOverdue) return 1;
                    return a.date.localeCompare(b.date);
                });

                if (items.length === 0) {
                    el.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-check-circle" style="color:var(--success);"></i></div><p>今天没有待复习</p></div>`;
                    return;
                }

                el.innerHTML = items.map(item => `
                        <div class="due-item" onclick="onAlgoClick('${item.algoId}')">
                            <span class="d-dot ${item.isOverdue ? 'urgent' : 'warn'}"></span>
                            <div class="d-info">
                                <div class="d-name">${escapeHtml(item.name)}</div>
                                <div class="d-stage">${item.label} · ${formatDate(item.date)} ${item.isOverdue ? '⚠️逾期' : '📌今天'}</div>
                            </div>
                            <button class="btn-checkin" onclick="event.stopPropagation(); checkIn('${item.algoId}',${item.nodeIdx},event)"><i class="fas fa-check"></i> 打卡</button>
                        </div>
                    `).join('');
            }

            // ================================================================
            //  滑动指示器更新
            // ================================================================
            function updateTabSlider() {
                const nav = document.getElementById('tabNav');
                const slider = document.getElementById('tabSlider');
                const activeBtn = nav.querySelector('.tab-btn.active');
                if (!activeBtn || !slider) return;
                const navRect = nav.getBoundingClientRect();
                const btnRect = activeBtn.getBoundingClientRect();
                const left = btnRect.left - navRect.left;
                const width = btnRect.width;
                slider.style.transform = `translateX(${left}px)`;
                slider.style.width = width + 'px';
            }

            window.addEventListener('resize', function() {
                updateTabSlider();
            });

            // ================================================================
            //  更新全部
            // ================================================================
            function updateAll() {
                renderList();
                updateCounts();
                if (selectedAlgoId && !algorithms.find(a => a.id === selectedAlgoId)) {
                    selectedAlgoId = null;
                    updateNoteEditor();
                } else if (selectedAlgoId) {
                    updateNoteEditor();
                }
                let overdue = 0;
                algorithms.forEach(a => a.reviewNodes.forEach(n => { if (!n.done && n.date < getTodayStr()) overdue++; }));
                document.title = overdue > 0 ? `(${overdue}) ⚠️ 复习计划` : '📚 复习计划';
                requestAnimationFrame(() => {
                    updateTabSlider();
                });
            }

                if (el) el.classList.add('active');

                if (el) el.classList.add('active');
            };

            // ================================================================
            //  示例数据
            // ================================================================
            window.loadSamples = function() {
                if (algorithms.length > 0) {
                    showConfirm('加载示例数据', '将 <strong style="color:#ef4444;">替换</strong> 当前所有数据，是否继续？', () => { doLoadSamples(); });
                } else {
                    doLoadSamples();
                }
            };

            function doLoadSamples() {
                const today = new Date(parseDate(getTodayStr()));
                const samples = [
                    { name: '快速排序', category: '基础算法', difficulty: 'easy', desc: '分治思想，平均 O(n log n)',
                    days: 0 },
                    { name: '归并排序', category: '基础算法', difficulty: 'easy', desc: '稳定排序，O(n log n)',
                    days: 1 },
                    { name: '二分查找', category: '基础算法', difficulty: 'easy', desc: '有序数组 O(log n)', days: 3 },
                    { name: 'Dijkstra算法', category: '图论', difficulty: 'hard', desc: '单源最短路径，优先队列优化',
                        days: 5 },
                    { name: '0-1背包', category: '动态规划', difficulty: 'hard', desc: '经典DP，状态转移方程', days: 8 },
                    { name: 'KMP', category: '字符串', difficulty: 'hard', desc: '前缀函数，O(n+m)', days: 2 },
                    { name: '红黑树', category: '数据结构', difficulty: 'hard', desc: '自平衡BST，O(log n)', days: 14 },
                    { name: '快速幂', category: '数学', difficulty: 'easy', desc: '二分幂，O(log b)', days: 6 },
                    { name: '并查集', category: '数据结构', difficulty: 'easy', desc: '路径压缩 + 按秩合并', days: 4 },
                    { name: '贪心算法', category: '基础算法', difficulty: 'easy', desc: '局部最优解', days: 2 },
                    { name: '堆排序', category: '数据结构', difficulty: 'hard', desc: '基于堆的排序', days: 7 },
                    { name: '位运算技巧', category: '杂项', difficulty: 'easy', desc: '常用位运算操作', days: 1 },
                ];

                algorithms = samples.map(s => {
                    const d = new Date(today);
                    d.setDate(d.getDate() - s.days);
                    const ds = d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0');
                    const algo = createAlgo(s.name, s.category, s.difficulty, s.desc, ds);
                    algo.reviewNodes.forEach(n => {
                        if (n.date < getTodayStr()) n.done = Math.random() > 0.3;
                    });
                    if (s.name === '快速排序') {
                        algo.note = '# 快速排序\n\n## 核心思想\n分治 + 基准值（pivot）\n\n## 时间复杂度\n- 平均：$O(n \\log n)$\n- 最坏：$O(n^2)$\n\n## 实现要点\n1. 选择基准值\n2. 分区（partition）\n3. 递归排序左右子数组\n\n```python\ndef quicksort(arr):\n    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr)//2]\n    left = [x for x in arr if x < pivot]\n    middle = [x for x in arr if x == pivot]\n    right = [x for x in arr if x > pivot]\n    return quicksort(left) + middle + quicksort(right)\n```';
                    } else if (s.name === 'Dijkstra算法') {
                        algo.note = '# Dijkstra 算法\n\n## 适用场景\n单源最短路径，**非负权边**\n\n## 核心步骤\n1. 初始化 dist[start] = 0\n2. 优先队列取出距离最小的节点\n3. 松弛邻接边\n\n## 复杂度\n$O((V+E) \\log V)$\n\n## 公式\n$$\\text{dist}[v] = \\min_{u \\in \\text{prev}(v)} (\\text{dist}[u] + w(u,v))$$';
                    } else if (s.name === '0-1背包') {
                        algo.note = '# 0-1 背包问题\n\n## 状态定义\n$dp[i][w]$ 表示前 $i$ 个物品，容量为 $w$ 时的最大价值\n\n## 转移方程\n$$dp[i][w] = \\max(dp[i-1][w], dp[i-1][w-w_i] + v_i)$$\n\n## 空间优化\n使用一维数组，倒序更新';
                    }
                    return algo;
                });

                expandedId = null;
                selectedAlgoId = null;
                saveData();
                updateAll();
                document.getElementById('searchInput').value = '';
                catFilter = 'all';
                diffFilter = 'all';
                currentTab = 'all';
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.tab-btn[data-tab="all"]')?.classList.add('active');
                document.querySelectorAll('#categoryFilterRow .filter-chip[data-cat]').forEach(c => c.classList.remove(
                'active'));
                document.querySelector('#categoryFilterRow .filter-chip[data-cat="all"]')?.classList.add('active');
                document.querySelectorAll('#difficultyFilterRow .diff-chip').forEach(c => c.classList.remove('active'));
                document.querySelector('#difficultyFilterRow .diff-chip[data-diff="all"]')?.classList.add('active');
                requestAnimationFrame(() => {
                    updateTabSlider();
                });
                showToast('示例数据加载成功！', 'success');
            }

            // ================================================================
            //  Toast / 模态 / 粒子
            // ================================================================
            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.textContent = msg;
                container.appendChild(t);
                setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2500);
            }

            function showConfirm(title, msg, cb) {
                document.getElementById('confirmTitle').innerHTML = title;
                document.getElementById('confirmMsg').innerHTML = msg;
                document.getElementById('confirmModal').classList.add('show');
                confirmCallback = cb;
                document.getElementById('confirmBtn').onclick = function() {
                    document.getElementById('confirmModal').classList.remove('show');
                    const fn = confirmCallback;
                    confirmCallback = null;
                    if (fn) fn();
                };
            }

            window.closeModal = function() {
                document.getElementById('confirmModal').classList.remove('show');
                confirmCallback = null;
            };
            window.closeModalIfOverlay = function(e) {
                if (e.target === document.getElementById('confirmModal')) closeModal();
            };

            window.confirmClear = function() {
                showConfirm('清空所有数据', '确定要 <strong style="color:#ef4444;">清空所有</strong> 算法记录吗？<br><span style="font-size:11px;color:#94a3b8;">建议先导出备份</span>', () => {
                    algorithms = [];
                    expandedId = null;
                    selectedAlgoId = null;
                    saveData();
                    updateAll();
                    updateNoteEditor();
                    document.title = '📚 复习计划';
                    showToast('已清空所有数据', 'info');
                });
            };

            function triggerBurst(ev) {
                const container = document.createElement('div');
                container.className = 'particle-burst';
                const x = ev?.clientX || window.innerWidth / 2;
                const y = ev?.clientY || window.innerHeight / 2;
                container.style.left = x + 'px';
                container.style.top = y + 'px';
                document.body.appendChild(container);
                const colors = ['#06b6d4', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
                for (let i = 0; i < 14; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const ang = (Math.PI * 2 / 14) * i + Math.random() * 0.3;
                    const dist = 20 + Math.random() * 35;
                    p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
                    p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
                    p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    p.style.animationDuration = (0.4 + Math.random() * 0.5) + 's';
                    container.appendChild(p);
                }
                setTimeout(() => { if (container.parentNode) container.parentNode.removeChild(container); }, 700);
            }

            // ================================================================
            //  导出 / 导入
            // ================================================================
            window.exportData = function() {
                const data = JSON.stringify(algorithms, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.download = '复习计划备份_' + ts + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('导出成功！', 'success');
            };

            window.importData = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!Array.isArray(data)) throw new Error('格式错误');
                        data.forEach(a => {
                            if (!a.id || !a.name || !a.learnDate || !Array.isArray(a.reviewNodes)) throw new Error(
                                '数据不完整');
                            if (!a.difficulty) a.difficulty = 'easy';
                            if (a.note === undefined) a.note = '';
                        });
                        showConfirm('导入数据', '即将导入 <strong>' + data.length + '</strong> 个算法，将 <span style="color:#ef4444;">替换</span> 当前所有数据，是否继续？', () => {
                            algorithms = data;
                            expandedId = null;
                            selectedAlgoId = null;
                            saveData();
                            updateAll();
                            updateNoteEditor();
                            showToast('成功导入 ' + data.length + ' 个算法！', 'success');
                        });
                    } catch (err) {
                        showToast('导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
                if (e.key === 'Escape') {
                    if (document.getElementById('confirmModal').classList.contains('show')) {
                        closeModal();
                    } else {
                        expandedId = null;
                        renderList();
                    }
                    if (githubPanelOpen) toggleGitHubPanel();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCurrentNote();
                    showToast('笔记已保存', 'success');
                }
            });

            // ================================================================
            //  初始化
            // ================================================================
            function init() {
                loadData();
                loadGitHubSettings();
                document.getElementById('algoLearnDate').value = getTodayStr();
                if (algorithms.length > 0) {
                    selectedAlgoId = algorithms[0].id;
                }
                updateAll();
                updateNoteEditor();
                setTimeout(() => {
                    updateTabSlider();
                }, 100);
                setInterval(() => {
                    updateCounts();
                    let overdue = 0;
                    algorithms.forEach(a => a.reviewNodes.forEach(n => { if (!n.done && n.date < getTodayStr())
                            overdue++; }));
                    document.title = overdue > 0 ? `(${overdue}) ⚠️ 复习计划` : '📚 复习计划';
                }, 30000);
                console.log('🧠 复习计划 · 已集成 GitHub 同步');
                console.log('  ✅ 完成状态基于 done === total');
                console.log('  ✅ 距离下一次复习还有 x 天');
                console.log('  ✅ 搜索图标 z-index 修复');
                console.log('  ✅ 笔记标题使用统一样式图标');
                console.log('  ⌨️  Ctrl+K 搜索 | Ctrl+S 保存笔记 | Esc 关闭面板');
                console.log('  📦 数据保存到 /data/review_plan.json');
                if (algorithms.length === 0) console.log('  💡 点击「示例数据」体验完整功能');
            }

            // 暴露全局
            window.addAlgo = addAlgo;
            window.deleteAlgo = deleteAlgo;
            window.checkIn = checkIn;
            window.onAlgoClick = onAlgoClick;
            window.renderList = renderList;
            window.updateAll = updateAll;
            window.switchTab = switchTab;
            window.setCatFilter = setCatFilter;
            window.setDiffFilter = setDiffFilter;
            window.setFormDiff = setFormDiff;
            window.onNoteChange = onNoteChange;
            window.setNoteMode = setNoteMode;
            window.saveCurrentNote = saveCurrentNote;
            window.loadSamples = loadSamples;
            window.confirmClear = confirmClear;
            window.exportData = exportData;
            window.importData = importData;
            window.closeModal = closeModal;
            window.closeModalIfOverlay = closeModalIfOverlay;
            window.toggleGitHubPanel = toggleGitHubPanel;

            init();

        })();
    </script>

</body>
</html>
