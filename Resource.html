<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>资源包合集</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'%3E%3Cpath fill='%23000000' d='M560.3 301.2C570.7 313 588.6 315.6 602.1 306.7C616.8 296.9 620.8 277 611 262.3L563 190.3C560.2 186.1 556.4 182.6 551.9 180.1L351.4 68.7C332.1 58 308.6 58 289.2 68.7L88.8 180C83.4 183 79.1 187.4 76.2 192.8L27.7 282.7C15.1 306.1 23.9 335.2 47.3 347.8L80.3 365.5L80.3 418.8C80.3 441.8 92.7 463.1 112.7 474.5L288.7 574.2C308.3 585.3 332.2 585.3 351.8 574.2L527.8 474.5C547.9 463.1 560.2 441.9 560.2 418.8L560.2 301.3zM320.3 291.4L170.2 208L320.3 124.6L470.4 208L320.3 291.4zM278.8 341.6L257.5 387.8L91.7 299L117.1 251.8L278.8 341.6z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ================================================================
           1.  CSS 变量 — 靛蓝 + 墨青 · 沉稳深邃
           ================================================================ */
        :root {
            --primary: #4a5a8a;
            --primary-dark: #3a4a7a;
            --primary-light: #8a9aba;
            --primary-soft: rgba(74, 90, 138, 0.12);
            --primary-glow: rgba(74, 90, 138, 0.20);
            --primary-gradient: linear-gradient(135deg, #4a5a8a 0%, #3a4a7a 100%);

            --accent: #3a7a7a;
            --accent-dark: #2a6a6a;
            --accent-light: #6aaaaa;
            --accent-soft: rgba(58, 122, 122, 0.18);
            --accent-glow: rgba(58, 122, 122, 0.25);
            --accent-gradient: linear-gradient(135deg, #3a7a7a 0%, #2a6a6a 100%);

            --success: #6a9a7a;
            --warning: #d4a86a;
            --danger: #c47a6a;

            --glass-bg: rgba(255, 252, 248, 0.40);
            --glass-bg-hover: rgba(255, 252, 248, 0.60);
            --glass-border: rgba(74, 90, 138, 0.15);
            --glass-shadow: 0 8px 32px rgba(40, 50, 90, 0.06), 0 0 0 1px rgba(74, 90, 138, 0.04) inset;
            --glass-hover-shadow: 0 16px 48px rgba(40, 50, 90, 0.10), 0 0 0 1px rgba(74, 90, 138, 0.08) inset;
            --glass-blur: 28px;

            --text: #1a2a3a;
            --text-secondary: #3a4a5a;
            --text-muted: #6a7a8a;

            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 20px;
            --radius-full: 9999px;

            --transition-smooth: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
            --font-mono: 'Jetbrains Mono', 'Fira Code', 'Consolas', monospace;

            --mouse-x: 50%;
            --mouse-y: 50%;

            --bg-start: #f0f2f6;
            --bg-end: #e4e8ee;
        }

        /* ================================================================
           2.  全局重置 & 丝滑渐变动画背景
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            min-height: 100vh;
            color: var(--text);
            background: var(--bg-start);
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(74, 90, 138, 0.04) 0%, rgba(138, 154, 186, 0.02) 40%, rgba(15, 23, 42, 0.01) 70%, transparent 100%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(58, 122, 122, 0.02) 0%, rgba(74, 90, 138, 0.01) 50%, transparent 80%),
                var(--bg-start);
            background-attachment: fixed;
            transition: background 0.08s ease;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, rgba(74, 90, 138, 0.02) 0%, rgba(58, 74, 122, 0.04) 30%, rgba(58, 122, 122, 0.02) 60%, rgba(255, 252, 248, 0.03) 100%);
            background-size: 400% 400%;
            animation: gradientFlow 22s ease-in-out infinite alternate;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(255, 252, 248, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(255, 252, 248, 0.03) 0%, transparent 40%);
            transition: background 0.08s ease;
            opacity: 0.8;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(74, 90, 138, 0.20);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(58, 122, 122, 0.35);
        }

        /* ================================================================
           3.  毛玻璃通用（增强版）
           ================================================================ */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 252, 248, 0.25) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.5;
            transition: opacity var(--transition-smooth);
            z-index: 0;
        }
        .glass:hover::before {
            opacity: 0.9;
        }
        .glass:hover {
            background: var(--glass-bg-hover);
            border-color: rgba(58, 122, 122, 0.25);
            box-shadow: var(--glass-hover-shadow), 0 0 20px rgba(58, 122, 122, 0.04);
            transform: translateY(-2px) scale(1.002);
        }
        .glass>* {
            position: relative;
            z-index: 1;
        }

        .glass::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .glass:hover::after {
            opacity: 1;
        }

        /* ================================================================
           4.  顶部导航 — 墨青点缀
           ================================================================ */
        .app-header {
            flex-shrink: 0;
            padding: 0 28px;
            background: rgba(255, 252, 248, 0.40);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-bottom: 1px solid rgba(58, 122, 122, 0.20);
            box-shadow: 0 1px 20px rgba(0, 0, 0, 0.01);
            transition: all var(--transition-smooth);
            width: 100%;
            position: relative;
            z-index: 10;
        }
        .app-header:hover {
            border-color: rgba(58, 122, 122, 0.30);
        }
        .header-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            gap: 16px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 2px 16px rgba(58, 122, 122, 0.25);
            transition: transform var(--transition-bounce), box-shadow var(--transition-smooth);
        }
        .logo-icon:hover {
            transform: scale(1.10) rotate(-4deg);
            box-shadow: 0 6px 28px rgba(58, 122, 122, 0.35);
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .logo-text .accent {
            color: var(--accent-dark);
        }
        .logo-sub {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 4px;
            letter-spacing: 0.2px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-ghost-sm {
            padding: 6px 16px;
            font-size: 13px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(74, 90, 138, 0.20);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all var(--transition-smooth);
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-ghost-sm:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: var(--accent);
            color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(58, 122, 122, 0.08);
        }
        .btn-ghost-sm:active {
            transform: scale(0.94);
        }

        /* ================================================================
           5.  主容器
           ================================================================ */
        .main-container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 18px 28px 20px;
            flex: 1;
            display: flex;
            gap: 24px;
            min-height: 0;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .col-left {
            flex: 0 0 25%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
        }

        .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
        }

        .col-left .glass,
        .col-right .glass {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .col-left .glass:nth-child(1) {
            flex: 3;
            min-height: 0;
        }
        .col-left .glass:nth-child(2) {
            flex: 2;
            min-height: 0;
        }

        .col-right .glass {
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
                height: auto;
            }
            .main-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
                padding: 14px 16px 18px;
                gap: 14px;
            }
            .col-left {
                flex: none;
                width: 100%;
                max-height: 500px;
                min-height: 360px;
            }
            .col-left .glass:nth-child(1) {
                flex: 3;
            }
            .col-left .glass:nth-child(2) {
                flex: 2;
            }
            .col-right {
                min-height: 340px;
                max-height: 600px;
            }
        }

        @media (max-width: 600px) {
            .app-header {
                padding: 0 14px;
            }
            .header-inner {
                flex-wrap: wrap;
                height: auto;
                padding: 6px 0;
                gap: 8px;
            }
            .logo-area {
                justify-content: center;
                width: 100%;
            }
            .header-actions {
                justify-content: center;
                width: 100%;
            }
            .main-container {
                padding: 10px 12px 14px;
                gap: 10px;
            }
            .col-left {
                max-height: 460px;
                min-height: 320px;
            }
            .col-right {
                min-height: 280px;
                max-height: 460px;
            }
        }

        /* ================================================================
           6.  左侧 — 添加/编辑表单（墨青强调）
           ================================================================ */
        .form-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .form-title i {
            color: var(--accent-dark);
        }
        .form-title .edit-badge {
            font-size: 11px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            padding: 0 10px;
            border-radius: var(--radius-full);
            margin-left: 4px;
            display: none;
            border: 1px solid rgba(58, 122, 122, 0.15);
        }
        .form-title .edit-badge.show {
            display: inline-block;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: flex-start;
        }
        .add-form .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .add-form .form-row .form-group {
            flex: 1;
            min-width: 40px;
        }
        .add-form .form-group {
            display: flex;
            flex-direction: column;
        }
        .add-form .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .add-form .form-group label .accent-star {
            color: var(--accent);
            margin-left: 2px;
        }
        .add-form .form-group input,
        .add-form .form-group select,
        .add-form .form-group textarea {
            width: 100%;
            padding: 7px 10px;
            font-size: 15px;
            border: 1px solid rgba(74, 90, 138, 0.15);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: all var(--transition-smooth);
            min-height: 34px;
            resize: vertical;
        }
        .add-form .form-group textarea {
            min-height: 50px;
            max-height: 90px;
            resize: vertical;
        }
        .add-form .form-group input:focus,
        .add-form .form-group select:focus,
        .add-form .form-group textarea:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.20);
            box-shadow: 0 0 0 3px rgba(58, 122, 122, 0.15);
        }
        .add-form .form-group input::placeholder,
        .add-form .form-group textarea::placeholder {
            color: var(--text-muted);
            font-size: 13px;
        }

        .btn-sm {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(58, 122, 122, 0.25);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 36px;
            justify-content: center;
            flex: 1;
        }
        .btn-sm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(58, 122, 122, 0.35);
        }
        .btn-sm:active {
            transform: scale(0.94);
        }
        .btn-sm.ghost {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid rgba(74, 90, 138, 0.08);
        }
        .btn-sm.ghost:hover {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: none;
            border-color: var(--accent);
        }
        .btn-sm.danger-ghost {
            background: rgba(196, 122, 106, 0.08);
            color: var(--danger);
            box-shadow: none;
            border: 1px solid rgba(196, 122, 106, 0.12);
        }
        .btn-sm.danger-ghost:hover {
            background: rgba(196, 122, 106, 0.16);
        }
        .btn-sm.primary {
            background: var(--primary-gradient);
            box-shadow: 0 2px 8px var(--primary-glow);
        }
        .btn-sm.primary:hover {
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .form-actions .btn-sm {
            flex: 1;
        }

        /* ================================================================
           7.  左侧 — 筛选器（墨青点缀）
           ================================================================ */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: flex-start;
        }
        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-row .filter-group {
            flex: 1;
            min-width: 50px;
        }
        .filter-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: block;
            margin-bottom: 2px;
        }
        .filter-group input[type="text"] {
            width: 100%;
            padding: 5px 8px;
            font-size: 13px;
            border: 1px solid rgba(74, 90, 138, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: all var(--transition-smooth);
            min-height: 30px;
        }
        .filter-group input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 2px rgba(58, 122, 122, 0.08);
        }

        .filter-stats {
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .filter-stats span {
            font-weight: 700;
            color: var(--accent-dark);
        }

        /* ================================================================
           8.  右侧 — 卡片网格（靛蓝+墨青）
           ================================================================ */
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .grid-header .title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .grid-header .title i {
            color: var(--accent-dark);
        }
        .grid-header .title .badge {
            font-size: 12px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            padding: 0 10px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(58, 122, 122, 0.12);
        }
        .grid-header .actions {
            display: flex;
            gap: 4px;
        }
        .grid-header .actions .btn-sm {
            font-size: 12px;
            padding: 3px 12px;
            min-height: 26px;
        }

        .card-grid {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-content: start;
            min-height: 20px;
        }
        .card-grid::-webkit-scrollbar {
            width: 3px;
        }
        .card-grid::-webkit-scrollbar-thumb {
            background: rgba(58, 122, 122, 0.25);
            border-radius: 3px;
        }

        /* ===== 卡片样式 — 靛蓝基底 + 墨青边框点缀 ===== */
        .card-item {
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(74, 90, 138, 0.06);
            padding: 14px 16px;
            transition: all var(--transition-smooth);
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 110px;
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.01);
        }
        .card-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(58, 122, 122, 0.0) 0%, rgba(58, 122, 122, 0.0) 40%, rgba(58, 122, 122, 0.15) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all var(--transition-smooth);
        }
        .card-item:hover::before {
            background: linear-gradient(135deg, rgba(58, 122, 122, 0.0) 0%, rgba(58, 122, 122, 0.20) 40%, rgba(58, 122, 122, 0.35) 100%);
        }
        .card-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(58, 122, 122, 0.15);
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 12px 36px rgba(40, 50, 90, 0.06), 0 0 20px rgba(58, 122, 122, 0.04);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-item .card-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-item .card-name a {
            color: var(--primary-dark);
            text-decoration: none;
            transition: color var(--transition-smooth);
        }
        .card-item .card-name a:hover {
            color: var(--accent-dark);
            text-decoration: underline;
        }

        /* ================================================================

            padding: 10px 20px;

            background: rgba(58, 50, 34, 0.72);

            border: 1px solid rgba(74, 90, 138, 0.06);

        }
        .toast.show {
            opacity: 1;

        .toast.hide {

        .toast.success {

        .toast.info {

        /* ================================================================

            position: fixed;

        .modal-box {

<body>

    <!-- ========================== 顶部导航 ========================== -->

                <button class="btn-ghost-sm" id="openGitHubBtn"><i class="fab fa-github"></i> Git</button>

                            <input type="text" id="filterSearch" placeholder="输入关键词..." />
                        </div>

        <!-- ===== 右栏 ===== -->
        <div class="col-right">
            <div class="glass">
                <div class="grid-header">
                    <span class="title">
                        <i class="fas fa-th-large"></i> 我的资源包

                    </span>
                    <div class="actions">
                        <button class="btn-sm ghost" onclick="window.resetFilters()"><i class="fas fa-undo-alt"></i> 重置</button>
                    </div>
                </div>
                <div class="card-grid" id="cardGrid">
                    <div class="empty-state">
                        <div class="icon"><i class="fas fa-box-open"></i></div>
                        <p>还没有资源包，添加一个吧</p>

    </div>

    <!-- ========================== 确认模态框 ========================== -->
    <div class="modal-overlay" id="confirmModal" onclick="if(event.target===this)window.closeModal()">
        <div class="modal-box">
            <h3 id="confirmTitle"><i class="fas fa-exclamation-triangle"></i> 确认</h3>
            <div class="msg" id="confirmMsg"></div>
            <div class="btn-row">
                <button class="btn btn-ghost-modal" onclick="window.closeModal()">取消</button>
                <button class="btn btn-danger-modal" id="confirmBtn">确认</button>

    <!-- ========================== GitHub 面板 ========================== -->
    <div class="github-panel" id="githubPanel">
        <div class="gp-title">
            <i class="fab fa-github"></i> GitHub 同步
            <span class="close-gp" id="closeGitHubPanelBtn"><i class="fas fa-times"></i></span>
        </div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="githubUsername" placeholder="你的 GitHub 用户名" />
        </div>
        <div class="form-group">
            <label>仓库名</label>
            <input type="text" id="githubRepo" placeholder="仓库名 (如: my-resources)" />
        </div>
        <div class="form-group">
            <label>令牌 (Personal Access Token)</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
        </div>
        <div class="gp-actions">
            <button class="btn-sm" id="uploadToGitBtn"><i class="fas fa-upload"></i> 上传</button>
            <button class="btn-sm" id="importFromGitBtn"><i class="fas fa-download"></i> 导入</button>
            <button class="btn-sm ghost" id="linkToGitBtn"><i class="fas fa-link"></i> 链接</button>
        </div>
        <div style="margin-top:8px; font-size:12px; color:var(--text-muted);">
            <i class="fas fa-info-circle" style="color:var(--accent);"></i> 令牌需具有 repo 权限。数据保存到 <code>/data/resources.json</code>
        </div>
    </div>

    <!-- ===== 浮动按钮 ===== -->
    <button class="github-toggle-btn" id="githubToggleBtn">
        <i class="fab fa-github"></i> 同步到GitHub
    </button>

    <!-- ========================== Toast ========================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ========================== JavaScript ========================== -->
    <script>
        (function() {
            'use strict';

            // ================================================================
            //  配置
            // ================================================================
            const STORAGE_KEY = 'resource_pack_data';
            const GITHUB_SETTINGS_KEY = 'github_settings_resource_pack';

            // ================================================================
            //  数据层
            // ================================================================
            let data = {
                items: []
            };
            let editingId = null;
            let confirmCallback = null;
            let githubPanelOpen = false;

            // ================================================================
            //  工具
            // ================================================================
            function genId() { return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

            function escapeHtml(str) {
                if (!str) return '';
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            // ================================================================
            //  Toast
            // ================================================================
            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.textContent = msg;
                container.appendChild(t);
                requestAnimationFrame(() => {
                    t.classList.add('show');
                });
                setTimeout(() => {
                    t.classList.remove('show');
                    t.classList.add('hide');
                    setTimeout(() => {
                        if (t.parentNode) t.parentNode.removeChild(t);
                    }, 300);
                }, 2200);
            }

            // ================================================================
            //  GitHub 设置
            // ================================================================
            function loadGitHubSettings() {
                try {
                    const raw = localStorage.getItem(GITHUB_SETTINGS_KEY);
                    if (raw) {
                        const settings = JSON.parse(raw);
                        document.getElementById('githubUsername').value = settings.username || '';
                        document.getElementById('githubRepo').value = settings.repo || '';
                        document.getElementById('githubToken').value = settings.token || '';
                    }
                } catch (e) { /* ignore */ }
            }

            function saveGitHubSettings() {
                const settings = {
                    username: document.getElementById('githubUsername').value.trim(),
                    repo: document.getElementById('githubRepo').value.trim(),
                    token: document.getElementById('githubToken').value.trim()
                };
                try {
                    localStorage.setItem(GITHUB_SETTINGS_KEY, JSON.stringify(settings));
                } catch (e) { /* ignore */ }
            }

            function getGitHubSettings() {
                return {
                    username: document.getElementById('githubUsername').value.trim(),
                    repo: document.getElementById('githubRepo').value.trim(),
                    token: document.getElementById('githubToken').value.trim()
                };
            }

            // ================================================================
            //  GitHub API 操作
            // ================================================================
            function utf8ToBase64(str) {
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                const decoder = new TextDecoder('utf-8');
                return decoder.decode(bytes);
            }

            async function uploadToGit() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo || !settings.token) {
                    showToast('请填写完整的 GitHub 信息', 'warning');
                    return;
                }
                saveGitHubSettings();
                if (!confirm('确定将当前数据上传到 GitHub 仓库 ' + settings.username + '/' + settings.repo +
                        ' 的 /data/resources.json 吗？')) {
                    return;
                }

                const apiUrl = `https://api.github.com/repos/${settings.username}/${settings.repo}/contents/data/resources.json`;

                try {
                    let sha = null;
                    try {
                        const getResp = await fetch(apiUrl, {
                            headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json' }
                        });
                        if (getResp.ok) {
                            const data = await getResp.json();
                            sha = data.sha;
                        } else if (getResp.status !== 404) {
                            const err = await getResp.json();
                            throw new Error('获取文件信息失败: ' + (err.message || getResp.statusText));
                        }
                    } catch (e) { if (e.message && e.message.includes('404')) {} else throw e; }

                    const contentStr = JSON.stringify({ items: data.items }, null, 2);
                    const contentBase64 = utf8ToBase64(contentStr);

                    const body = {
                        message: '更新资源包合集 ' + new Date().toISOString(),
                        content: contentBase64,
                        sha: sha || undefined
                    };

                    const putResp = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${settings.token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (!putResp.ok) {
                        const err = await putResp.json();
                        throw new Error('上传失败: ' + (err.message || putResp.statusText));
                    }
                    showToast('✅ 数据已成功上传至 GitHub!', 'success');
                } catch (error) {
                    console.error('上传错误:', error);
                    showToast('❌ 上传失败: ' + error.message, 'error');
                }
            }

            async function importFromGit() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo || !settings.token) {
                    showToast('请填写完整的 GitHub 信息', 'warning');
                    return;
                }
                saveGitHubSettings();
                if (!confirm('确定从 GitHub 仓库 ' + settings.username + '/' + settings.repo +
                        ' 的 /data/resources.json 导入数据吗？\n这将替换当前所有本地数据！')) {
                    return;
                }

                const apiUrl = `https://api.github.com/repos/${settings.username}/${settings.repo}/contents/data/resources.json`;

                try {
                    const resp = await fetch(apiUrl, {
                        headers: {
                            'Authorization': `token ${settings.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (!resp.ok) {
                        if (resp.status === 404) {
                            throw new Error('远程文件不存在，请先上传数据');
                        }
                        const err = await resp.json();
                        throw new Error('获取数据失败: ' + (err.message || resp.statusText));
                    }

                    const data = await resp.json();
                    const content = base64ToUtf8(data.content);
                    const imported = JSON.parse(content);

                    if (!imported.items || !Array.isArray(imported.items)) {
                        throw new Error('数据格式错误');
                    }

                    data.items = imported.items;
                    saveData();
                    cancelEdit();
                    renderAll();
                    showToast('✅ 成功从 GitHub 导入 ' + data.items.length + ' 个资源包!', 'success');
                } catch (error) {
                    console.error('导入错误:', error);
                    showToast('❌ 导入失败: ' + error.message, 'error');
                }
            }

            function openGitHubRepo() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo) {
                    showToast('请先填写用户名和仓库名', 'warning');
                    return;
                }
                saveGitHubSettings();
                window.open(`https://github.com/${settings.username}/${settings.repo}`, '_blank');
                showToast('正在打开仓库...', 'info');
            }

            // ================================================================
            //  面板开关
            // ================================================================
            function toggleGitHubPanel() {
                githubPanelOpen = !githubPanelOpen;
                const panel = document.getElementById('githubPanel');
                const btn = document.getElementById('githubToggleBtn');
                if (githubPanelOpen) {
                    panel.classList.add('open');
                    btn.style.display = 'none';
                } else {
                    panel.classList.remove('open');
                    btn.style.display = 'flex';
                }
            }

            document.getElementById('openGitHubBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('githubToggleBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('closeGitHubPanelBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('uploadToGitBtn').addEventListener('click', uploadToGit);
            document.getElementById('importFromGitBtn').addEventListener('click', importFromGit);
            document.getElementById('linkToGitBtn').addEventListener('click', openGitHubRepo);

            // ================================================================
            //  存储
            // ================================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed.items && Array.isArray(parsed.items)) {
                            data.items = parsed.items;
                        }
                    }
                } catch (e) { /* ignore */ }

                if (data.items.length === 0) {
                    // 示例数据
                    const samples = [
                        { name: 'Omnisphere 2 音色库', url: 'https://example.com/omnisphere', desc: '完整的Omnisphere 2扩展音色包，包含2000+预设' },
                        { name: 'Kontakt 7 标准库', url: 'https://example.com/kontakt7', desc: 'Kontakt 7 官方标准音色库，涵盖管弦乐、电子、世界音乐' },
                        { name: ' Serum 预设包 Vol.1', url: 'https://example.com/serum-vol1', desc: '100个电子音乐专用Serum预设，包含Bass、Lead、Pad' },
                        { name: 'EWQL 好莱坞管弦乐', url: 'https://example.com/ewql-hollywood', desc: '好莱坞级管弦乐音色库，适合电影配乐' },
                        { name: 'Spectrasonics Trilian', url: 'https://example.com/trilian', desc: '顶级贝斯音色库，包含电贝斯、原声贝斯、合成贝斯' },
                        { name: 'Addictive Drums 2 扩展', url: 'https://example.com/addictive-drums', desc: 'Addictive Drums 2 的额外鼓组扩展包' },
                        { name: 'Arturia V Collection 9', url: 'https://example.com/arturia-v9', desc: '经典合成器合集，包含Mini V、Jupiter-8等' },
                        { name: 'UVI Falcon 扩展包', url: 'https://example.com/uvi-falcon', desc: 'UVI Falcon 工作站的扩展音色包' },
                    ];
                    samples.forEach(s => {
                        data.items.push({
                            id: genId(),
                            name: s.name,
                            url: s.url,
                            desc: s.desc || '',
                        });
                    });
                    saveData();
                }

                renderAll();
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        items: data.items,
                    }));
                } catch (e) { /* ignore */ }
            }

            // ================================================================
            //  核心操作
            // ================================================================
            function saveItem(e) {
                e.preventDefault();

                const name = document.getElementById('inputName').value.trim();
                const url = document.getElementById('inputUrl').value.trim();
                const desc = document.getElementById('inputDesc').value.trim();
                const editId = document.getElementById('editId').value;

                if (!name) { showToast('请输入资源包名称', 'warning'); return; }
                if (!url) { showToast('请输入地址链接', 'warning'); return; }
                try { new URL(url); } catch (_) { showToast('请输入有效的URL地址', 'warning'); return; }

                if (editId) {
                    const index = data.items.findIndex(item => item.id === editId);
                    if (index !== -1) {
                        data.items[index] = {
                            ...data.items[index],
                            name,
                            url,
                            desc: desc || '',
                        };
                        saveData();
                        cancelEdit();
                        renderAll();
                        showToast('✅ 已更新资源包', 'success');
                    } else {
                        showToast('❌ 记录不存在', 'warning');
                    }
                } else {
                    data.items.push({
                        id: genId(),
                        name,
                        url,
                        desc: desc || '',
                    });
                    saveData();
                    document.getElementById('inputName').value = '';
                    document.getElementById('inputUrl').value = '';
                    document.getElementById('inputDesc').value = '';
                    renderAll();
                    showToast('✅ 已添加资源包', 'success');
                }
            }

            function editItem(id) {
                const item = data.items.find(i => i.id === id);
                if (!item) return;

                document.getElementById('editId').value = item.id;
                document.getElementById('inputName').value = item.name;
                document.getElementById('inputUrl').value = item.url;
                document.getElementById('inputDesc').value = item.desc || '';

                document.getElementById('editBadge').classList.add('show');
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-edit"></i> 更新';
                document.getElementById('cancelEditBtn').style.display = 'flex';
                document.getElementById('submitBtn').style.background = 'var(--accent-gradient)';

                document.querySelector('.col-left .glass:first-child').scrollIntoView({ behavior: 'smooth',
                    block: 'center' });
            }

            function cancelEdit() {
                document.getElementById('editId').value = '';
                document.getElementById('inputName').value = '';
                document.getElementById('inputUrl').value = '';
                document.getElementById('inputDesc').value = '';
                document.getElementById('editBadge').classList.remove('show');
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> 保存';
                document.getElementById('cancelEditBtn').style.display = 'none';
                document.getElementById('submitBtn').style.background = 'var(--accent-gradient)';
            }

            function deleteItem(id) {
                const item = data.items.find(i => i.id === id);
                if (!item) return;
                showConfirm('删除资源包', '确定要删除 <strong>' + escapeHtml(item.name) +
                    '</strong> 吗？<br><span style="font-size:12px;color:var(--text-muted);">' + escapeHtml(item.url) +
                    '</span>', () => {
                    data.items = data.items.filter(i => i.id !== id);
                    saveData();
                    if (editingId === id) cancelEdit();
                    renderAll();
                    showToast('已删除', 'info');
                });
            }

            // ================================================================
            //  筛选
            // ================================================================
            function getFilteredItems() {
                const search = document.getElementById('filterSearch').value.trim().toLowerCase();
                return data.items.filter(item => {
                    if (search && !item.name.toLowerCase().includes(search)) return false;
                    return true;
                });
            }

            function resetFilters() {
                document.getElementById('filterSearch').value = '';
                renderAll();
                showToast('已重置筛选', 'info');
            }

            // ================================================================
            //  模态框
            // ================================================================
            function showConfirm(title, msg, cb) {
                document.getElementById('confirmTitle').innerHTML = title;
                document.getElementById('confirmMsg').innerHTML = msg;
                const modal = document.getElementById('confirmModal');
                confirmCallback = cb;
                const confirmBtn = document.getElementById('confirmBtn');
                confirmBtn.onclick = function(e) {
                    e.stopPropagation();
                    const callback = confirmCallback;
                    closeModal();
                    if (typeof callback === 'function') {
                        callback();
                    }
                    confirmCallback = null;
                };
                modal.classList.add('show');
            }

            function closeModal() {
                const modal = document.getElementById('confirmModal');
                if (modal) {
                    modal.classList.remove('show');
                }
                if (confirmCallback) {
                    confirmCallback = null;
                }
            }

            // ================================================================
            //  清空全部
            // ================================================================
            function confirmClearAll() {
                if (data.items.length === 0) { showToast('没有数据可清空', 'warning'); return; }
                showConfirm('清空所有数据', '确定要 <strong style="color:#c47a6a;">清空所有</strong> 资源包吗？<br><span style="font-size:12px;color:var(--text-muted);">建议先导出备份</span>', () => {
                    data.items = [];
                    saveData();
                    cancelEdit();
                    renderAll();
                    showToast('已清空所有数据', 'info');
                });
            }

            // ================================================================
            //  导出 / 导入
            // ================================================================
            function exportData() {
                if (data.items.length === 0) { showToast('没有数据可导出', 'warning'); return; }
                const blob = new Blob([JSON.stringify({ items: data.items }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '资源包合集_' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('导出成功！', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.items || !Array.isArray(imported.items)) throw new Error('格式错误');
                        if (!confirm('将替换当前所有数据，是否继续？')) return;
                        data.items = imported.items;
                        saveData();
                        cancelEdit();
                        renderAll();
                        showToast('成功导入 ' + data.items.length + ' 个资源包！', 'success');
                    } catch (err) {
                        showToast('导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ================================================================
            //  渲染
            // ================================================================
            function renderAll() {
                renderCards();
                updateCounts();
            }

            function renderCards() {
                const grid = document.getElementById('cardGrid');
                const items = getFilteredItems();
                const sorted = [...items].sort((a, b) => a.name.localeCompare(b.name));

                if (sorted.length === 0) {
                    const isSearching = document.getElementById('filterSearch').value.trim() !== '';
                    grid.innerHTML = `
                            <div class="empty-state">
                                <div class="icon"><i class="fas ${isSearching ? 'fa-search' : 'fa-box-open'}"></i></div>
                                <p>${isSearching ? '没有匹配的资源包' : '还没有资源包，添加一个吧'}</p>
                                <span class="sub">${isSearching ? '试试其他关键词' : '左侧表单填写后点击「保存」'}</span>
                            </div>
                        `;
                    return;
                }

                grid.innerHTML = sorted.map(item => {
                    const displayUrl = item.url ? escapeHtml(item.url) : '--';

                    return `
                            <div class="card-item">
                                <div class="card-name">
                                    <i class="fas fa-link link-icon"></i>
                                    <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.name)}</a>
                                </div>
                                <div class="card-url">
                                    <i class="fas fa-globe"></i>
                                    <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${displayUrl}</a>
                                </div>
                                <div class="card-desc">
                                    ${item.desc ? escapeHtml(item.desc) : '<span class="empty-desc">— 没有简介 —</span>'}
                                </div>
                                <div class="card-actions">
                                    <button class="edit-card" onclick="window.editItem('${item.id}')" title="编辑"><i class="fas fa-pen"></i></button>
                                    <button class="del-card" onclick="window.deleteItem('${item.id}')" title="删除"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        `;
                }).join('');
            }

            function updateCounts() {
                const filtered = getFilteredItems();
                document.getElementById('filterCount').textContent = filtered.length;
                document.getElementById('totalCount').textContent = data.items.length;
            }

            // ================================================================
            //  背景鼠标跟随
            // ================================================================
            const body = document.body;
            document.addEventListener('mousemove', function(e) {
                const x = e.clientX / window.innerWidth * 100;
                const y = e.clientY / window.innerHeight * 100;
                body.style.setProperty('--mouse-x', x + '%');
                body.style.setProperty('--mouse-y', y + '%');
            });

            // ================================================================
            //  筛选器事件（实时搜索）
            // ================================================================
            document.getElementById('filterSearch').addEventListener('input', renderAll);

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('confirmModal').classList.contains('show')) closeModal();
                    if (githubPanelOpen) toggleGitHubPanel();
                    if (document.getElementById('editId').value) cancelEdit();
                }
            });

            // ================================================================
            //  全局暴露
            // ================================================================
            window.saveItem = saveItem;
            window.editItem = editItem;
            window.cancelEdit = cancelEdit;
            window.deleteItem = deleteItem;
            window.resetFilters = resetFilters;
            window.exportData = exportData;
            window.importData = importData;
            window.confirmClearAll = confirmClearAll;
            window.closeModal = closeModal;
            window.showConfirm = showConfirm;
            window.toggleGitHubPanel = toggleGitHubPanel;

            // ================================================================
            //  启动
            // ================================================================
            loadData();
            loadGitHubSettings();
            console.log('📦 资源包合集 · 靛蓝+墨青主题');
            console.log('  📦 已加载 ' + data.items.length + ' 个资源包');
            console.log('  ✏️  支持编辑 | 🔄 Git同步 | 💙 靛蓝墨青沉稳质感');

        })();
    </script>

</body>
</html>
