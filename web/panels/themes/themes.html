<div class="tp-page theme-page" data-page="themes">
  <section class="theme-section theme-main">
    <div class="theme-topline">
      <span class="theme-count" id="themeCount">8 款内置 · 0 款自定义</span>
      <span class="theme-current" id="themeCurrent"></span>
      <span class="theme-tip"><i class="fas fa-mouse-pointer"></i> 点击卡片切换 · 右键置顶 / 导出</span>
    </div>
    <div class="theme-scroll"><div class="theme-grid" id="themeGrid"></div></div>
    <input type="file" id="themeFileInput" accept=".json" style="display:none" />
  </section>

  <section class="theme-section diff-section">
    <div class="theme-section-head">
      <span><i class="fas fa-swatchbook"></i> 难度配色</span>
      <span class="theme-section-hint" id="diffPaletteCount"></span>
      <input type="file" id="diffPaletteFileInput" accept=".json" style="display:none" />
    </div>
    <div class="diff-palette-scroll"><div class="diff-palette-grid" id="diffPaletteGrid"></div></div>
  </section>
</div>
