<div class="tp-page" data-page="settings">
    <div class="tp-title"><i class="fas fa-cog"></i> 设置</div>
    <div class="settings-section">
      <div class="settings-title">字体</div>
      <div class="settings-row">
        <label>字体</label>
        <div class="settings-opts" id="fontOpts">
          <button class="set-opt" data-font="default">默认</button>
          <button class="set-opt" data-font="serif">衬线</button>
          <button class="set-opt" data-font="kai">楷体</button>
          <button class="set-opt" data-font="mono">等宽</button>
        </div>
      </div>
      <div class="settings-row">
        <label>字号</label>
        <div class="settings-opts" id="fsizeOpts">
          <button class="set-opt" data-fsize="s">小</button>
          <button class="set-opt" data-fsize="m">中</button>
          <button class="set-opt" data-fsize="l">大</button>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-title">GitHub 同步</div>
      <div class="form-group"><label>用户名</label><input type="text" id="githubUsername" /></div>
      <div class="form-group"><label>仓库名</label><input type="text" id="githubRepo" /></div>
      <div class="form-group"><label>令牌 (PAT)</label><input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" /></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn-sm" id="uploadToGitBtn"><i class="fas fa-upload"></i> 上传</button>
        <button class="btn-sm" id="importFromGitBtn"><i class="fas fa-download"></i> 导入</button>
        <button class="btn-sm ghost" id="linkToGitBtn"><i class="fas fa-link"></i> 链接</button>
      </div>
      <div class="hint" style="font-size:.71em;color:var(--text-muted);margin-top:6px;"><i class="fas fa-info-circle"></i> 令牌需 repo 权限 · <code style="background:var(--surface-hover);padding:1px 6px;border-radius:4px;font-family:var(--font-mono);">/data/problem_lists.json</code></div>
    </div>
    <div class="settings-section">
      <div class="settings-title">数据</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
        <button class="btn-sm ghost" id="exportDataBtn"><i class="fas fa-download"></i> 导出备份</button>
        <button class="btn-sm ghost" id="importDataBtn2"><i class="fas fa-upload"></i> 导入备份</button>
        <button class="btn-sm ghost" id="openTourBtn2"><i class="fas fa-graduation-cap"></i> 新手教程</button>
        <button class="btn-sm ghost" id="openShortcutsBtn2"><i class="fas fa-keyboard"></i> 快捷键指南</button>
      </div>
      <button class="btn-sm danger" id="clearAllBtn" style="width:100%;"><i class="fas fa-trash-alt"></i> 清空所有数据</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" />
  </div>
