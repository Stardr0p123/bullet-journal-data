<div class="tp-page" data-page="daily">
  <section class="dl-module dl-module-doing">
    <header class="dl-mod-head">
      <h3><i class="fas fa-bolt"></i> 进行中 <span class="dl-count" id="dlDoingCount">0/3</span></h3>
      <span class="dl-mod-tip">全局同时只允许 1 道题计时</span>
    </header>
    <div class="dl-doing" id="dlDoing"></div>
  </section>

  <div class="dl-cols">
    <section class="dl-module">
      <header class="dl-mod-head">
        <h3><i class="fas fa-inbox"></i> 待做池 <span class="dl-count" id="dlInboxCount">0/10</span></h3>
        <span class="dl-mod-tip">主界面右键「加入待做池」</span>
      </header>
      <div class="dl-list" id="dlInbox"></div>
    </section>

    <section class="dl-module">
      <header class="dl-mod-head">
        <h3><i class="fas fa-pause-circle"></i> 挂起区 <span class="dl-count" id="dlSuspendCount">0</span></h3>
        <span class="dl-mod-tip">会了没写，随时接回</span>
      </header>
      <div class="dl-list" id="dlSuspended"></div>
    </section>
  </div>

  <div class="dl-done-strip" id="dlDoneStrip"></div>
</div>
