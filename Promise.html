<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>约定记录 · 约定与借还</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ================================================================
           1.  CSS 变量 — 墨绿色 · 沉稳自然
           ================================================================ */
        :root {
            --primary: #3a6b4a;
            --primary-dark: #2d5a3d;
            --primary-light: #6a9a7a;
            --primary-soft: rgba(58, 107, 74, 0.12);
            --primary-glow: rgba(58, 107, 74, 0.20);
            --primary-gradient: linear-gradient(135deg, #3a6b4a 0%, #2d5a3d 100%);

            --success: #6a9a7a;
            --warning: #d4a86a;
            --danger: #c47a6a;

            --glass-bg: rgba(255, 252, 248, 0.40);
            --glass-bg-hover: rgba(255, 252, 248, 0.60);
            --glass-border: rgba(58, 107, 74, 0.15);
            --glass-shadow: 0 8px 32px rgba(40, 80, 60, 0.06), 0 0 0 1px rgba(58, 107, 74, 0.04) inset;
            --glass-hover-shadow: 0 16px 48px rgba(40, 80, 60, 0.10), 0 0 0 1px rgba(58, 107, 74, 0.08) inset;
            --glass-blur: 28px;

            --text: #2a3a2a;
            --text-secondary: #4a5a4a;
            --text-muted: #7a8a7a;

            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 20px;
            --radius-full: 9999px;

            --transition-smooth: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

            --mouse-x: 50%;
            --mouse-y: 50%;

            --bg-start: #f4f8f4;
            --bg-end: #e8ece8;
        }

        /* ================================================================
           2.  全局重置 & 丝滑渐变动画背景
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            min-height: 100vh;
            color: var(--text);
            background: var(--bg-start);
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(58, 107, 74, 0.04) 0%, rgba(106, 154, 122, 0.02) 40%, rgba(15, 23, 42, 0.01) 70%, transparent 100%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(45, 90, 61, 0.02) 0%, rgba(58, 107, 74, 0.01) 50%, transparent 80%),
                var(--bg-start);
            background-attachment: fixed;
            transition: background 0.08s ease;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, rgba(58, 107, 74, 0.02) 0%, rgba(45, 90, 61, 0.04) 30%, rgba(106, 154, 122, 0.02) 60%, rgba(255, 252, 248, 0.03) 100%);
            background-size: 400% 400%;
            animation: gradientFlow 22s ease-in-out infinite alternate;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(255, 252, 248, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(255, 252, 248, 0.03) 0%, transparent 40%);
            transition: background 0.08s ease;
            opacity: 0.8;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(58, 107, 74, 0.20);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(58, 107, 74, 0.35);
        }

        /* ================================================================
           3.  毛玻璃通用（增强版）
           ================================================================ */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 252, 248, 0.25) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.5;
            transition: opacity var(--transition-smooth);
            z-index: 0;
        }
        .glass:hover::before {
            opacity: 0.9;
        }
        .glass:hover {
            background: var(--glass-bg-hover);
            border-color: rgba(58, 107, 74, 0.12);
            box-shadow: var(--glass-hover-shadow);
            transform: translateY(-2px) scale(1.002);
        }
        .glass>* {
            position: relative;
            z-index: 1;
        }

        .glass::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .glass:hover::after {
            opacity: 1;
        }

        /* ================================================================
           4.  顶部导航
           ================================================================ */
        .app-header {
            flex-shrink: 0;
            padding: 0 28px;
            background: rgba(255, 252, 248, 0.40);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-bottom: 1px solid rgba(58, 107, 74, 0.12);
            box-shadow: 0 1px 20px rgba(0, 0, 0, 0.01);
            transition: all var(--transition-smooth);
            width: 100%;
            position: relative;
            z-index: 10;
        }
        .app-header:hover {
            border-color: rgba(58, 107, 74, 0.08);
        }
        .header-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            gap: 16px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 2px 16px rgba(58, 107, 74, 0.20);
            transition: transform var(--transition-bounce), box-shadow var(--transition-smooth);
        }
        .logo-icon:hover {
            transform: scale(1.10) rotate(-4deg);
            box-shadow: 0 6px 28px rgba(58, 107, 74, 0.30);
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .logo-sub {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 4px;
            letter-spacing: 0.2px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-ghost-sm {
            padding: 6px 16px;
            font-size: 13px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(58, 107, 74, 0.20);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all var(--transition-smooth);
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-ghost-sm:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(58, 107, 74, 0.15);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }
        .btn-ghost-sm:active {
            transform: scale(0.94);
        }

        /* ================================================================
           5.  主容器
           ================================================================ */
        .main-container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 18px 28px 20px;
            flex: 1;
            display: flex;
            gap: 24px;
            min-height: 0;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .col-left {
            flex: 0 0 25%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
        }

        .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
        }

        .col-left .glass,
        .col-right .glass {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .col-left .glass:nth-child(1) {
            flex: 3;
            min-height: 0;
        }
        .col-left .glass:nth-child(2) {
            flex: 2;
            min-height: 0;
        }

        .col-right .glass {
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
                height: auto;
            }
            .main-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
                padding: 14px 16px 18px;
                gap: 14px;
            }
            .col-left {
                flex: none;
                width: 100%;
                max-height: 500px;
                min-height: 360px;
            }
            .col-left .glass:nth-child(1) {
                flex: 3;
            }
            .col-left .glass:nth-child(2) {
                flex: 2;
            }
            .col-right {
                min-height: 340px;
                max-height: 600px;
            }
        }

        @media (max-width: 600px) {
            .app-header {
                padding: 0 14px;
            }
            .header-inner {
                flex-wrap: wrap;
                height: auto;
                padding: 6px 0;
                gap: 8px;
            }
            .logo-area {
                justify-content: center;
                width: 100%;
            }
            .header-actions {
                justify-content: center;
                width: 100%;
            }
            .main-container {
                padding: 10px 12px 14px;
                gap: 10px;
            }
            .col-left {
                max-height: 460px;
                min-height: 320px;
            }
            .col-right {
                min-height: 280px;
                max-height: 460px;
            }
        }

        /* ================================================================
           6.  左侧 — 添加/编辑表单（简化：无状态、无开始日期）
           ================================================================ */
        .form-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .form-title i {
            color: var(--primary-dark);
        }
        .form-title .edit-badge {
            font-size: 11px;
            background: var(--primary-soft);
            color: var(--primary-dark);
            padding: 0 10px;
            border-radius: var(--radius-full);
            margin-left: 4px;
            display: none;
        }
        .form-title .edit-badge.show {
            display: inline-block;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: flex-start;
        }
        .add-form .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .add-form .form-row .form-group {
            flex: 1;
            min-width: 40px;
        }
        .add-form .form-group {
            display: flex;
            flex-direction: column;
        }
        .add-form .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .add-form .form-group input,
        .add-form .form-group select,
        .add-form .form-group textarea {
            width: 100%;
            padding: 7px 10px;
            font-size: 15px;
            border: 1px solid rgba(58, 107, 74, 0.15);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: all var(--transition-smooth);
            min-height: 34px;
            resize: vertical;
        }
        .add-form .form-group textarea {
            min-height: 50px;
            max-height: 90px;
            resize: vertical;
        }
        .add-form .form-group input:focus,
        .add-form .form-group select:focus,
        .add-form .form-group textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.20);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        .add-form .form-group input::placeholder,
        .add-form .form-group textarea::placeholder {
            color: var(--text-muted);
            font-size: 13px;
        }

        .btn-sm {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            font-family: inherit;
            box-shadow: 0 2px 8px var(--primary-glow);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 36px;
            justify-content: center;
            flex: 1;
        }
        .btn-sm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-sm:active {
            transform: scale(0.94);
        }
        .btn-sm.ghost {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid rgba(58, 107, 74, 0.08);
        }
        .btn-sm.ghost:hover {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: none;
        }
        .btn-sm.danger-ghost {
            background: rgba(196, 122, 106, 0.08);
            color: var(--danger);
            box-shadow: none;
            border: 1px solid rgba(196, 122, 106, 0.12);
        }
        .btn-sm.danger-ghost:hover {
            background: rgba(196, 122, 106, 0.16);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .form-actions .btn-sm {
            flex: 1;
        }

        /* ================================================================
           7.  左侧 — 筛选器（保留状态筛选）
           ================================================================ */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: flex-start;
        }
        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-row .filter-group {
            flex: 1;
            min-width: 50px;
        }
        .filter-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: block;
            margin-bottom: 2px;
        }
        .filter-group select,
        .filter-group input[type="checkbox"] {
            width: 100%;
            padding: 5px 8px;
            font-size: 13px;
            border: 1px solid rgba(58, 107, 74, 0.12);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: all var(--transition-smooth);
            min-height: 30px;
        }
        .filter-group select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.18);
        }
        .filter-group.checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 4px;
        }
        .filter-group.checkbox-group label {
            display: inline;
            font-size: 13px;
            text-transform: none;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0;
        }
        .filter-group.checkbox-group input[type="checkbox"] {
            width: auto;
            min-height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .filter-stats {
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .filter-stats span {
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* ================================================================
           8.  右侧 — 卡片网格（两栏）
           ================================================================ */
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .grid-header .title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .grid-header .title .badge {
            font-size: 12px;
            background: var(--primary-soft);
            color: var(--primary-dark);
            padding: 0 10px;
            border-radius: var(--radius-full);
        }
        .grid-header .actions {
            display: flex;
            gap: 4px;
        }
        .grid-header .actions .btn-sm {
            font-size: 12px;
            padding: 3px 12px;
            min-height: 26px;
        }

        .card-grid {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-content: start;
            min-height: 20px;
        }
        .card-grid::-webkit-scrollbar {
            width: 3px;
        }
        .card-grid::-webkit-scrollbar-thumb {
            background: rgba(58, 107, 74, 0.15);
            border-radius: 3px;
        }

        /* ===== 卡片样式 ===== */
        .card-item {
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(58, 107, 74, 0.04);
            padding: 14px 16px;
            transition: all var(--transition-smooth);
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 110px;
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.01);
        }
        .card-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(58, 107, 74, 0.10);
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 12px 36px rgba(40, 80, 60, 0.04), 0 0 0 1px rgba(58, 107, 74, 0.04) inset;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-item .card-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-item .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .card-item .card-meta .tag {
            padding: 0 10px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 12px;
            line-height: 1.9;
            border: 1px solid transparent;
            transition: all var(--transition-smooth);
        }
        .tag-type {
            background: var(--primary-soft);
            color: var(--primary-dark);
            border-color: rgba(58, 107, 74, 0.06);
        }
        .tag-status-progress {
            background: rgba(58, 107, 74, 0.16);
            color: #2d5a3d;
            border-color: rgba(58, 107, 74, 0.08);
        }
        .tag-status-done {
            background: rgba(106, 154, 122, 0.16);
            color: #3a6b4a;
            border-color: rgba(106, 154, 122, 0.08);
        }
        .tag-status-overdue {
            background: rgba(196, 122, 106, 0.16);
            color: #b06a5a;
            border-color: rgba(196, 122, 106, 0.08);
        }

        .card-item .card-date {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-item .card-date i {
            font-size: 12px;
            opacity: 0.5;
        }

        .card-item .card-review {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
            margin-top: 2px;
            flex: 1;
            min-height: 1.4em;
        }
        .card-item .card-review .empty-review {
            color: var(--text-muted);
            font-style: italic;
            opacity: 0.4;
            font-size: 13px;
        }

        .card-item .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
            gap: 6px;
            flex-shrink: 0;
        }
        .card-item .card-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all var(--transition-smooth);
            opacity: 0.2;
        }
        .card-item:hover .card-actions button {
            opacity: 0.6;
        }
        .card-item .card-actions button:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.1);
        }
        .card-item .card-actions .edit-card:hover {
            color: var(--primary-dark);
        }
        .card-item .card-actions .del-card:hover {
            color: var(--danger);
        }
        .card-item .card-actions .done-card {
            color: var(--success);
        }
        .card-item .card-actions .done-card:hover {
            color: #4a8a5a;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 14px;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .empty-state .icon {
            font-size: 32px;
            opacity: 0.15;
        }
        .empty-state .sub {
            font-size: 13px;
            opacity: 0.5;
        }

        /* ================================================================
           9.  Toast
           ================================================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            background: rgba(58, 50, 34, 0.72);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(58, 107, 74, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            pointer-events: auto;
            max-width: 320px;
            opacity: 0;
            transform: translateX(30px) scale(0.92);
            transition: opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        .toast.hide {
            opacity: 0;
            transform: translateX(30px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .toast.success {
            background: rgba(106, 154, 122, 0.78);
        }
        .toast.info {
            background: rgba(58, 107, 74, 0.78);
            color: #fff;
        }
        .toast.warning {
            background: rgba(212, 168, 106, 0.78);
            color: #3a3222;
        }

        /* ================================================================
           10. 模态框
           ================================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(4px);

        }
        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            transition: visibility 0s linear 0s, opacity 0.25s ease;
        }
        .modal-box {
            background: rgba(255, 252, 248, 0.65);
            backdrop-filter: blur(32px);
            border: 1px solid rgba(58, 107, 74, 0.20);

        }
        .modal-overlay.show .modal-box {
            transform: scale(1) translateY(0);

        }
        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--text);

            align-items: center;
            gap: 8px;
        }
        .modal-box .msg {

            line-height: 1.6;
        }
        .modal-box .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-box .btn-row .btn {
            flex: 1;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition-smooth);
        }
        .btn-ghost-modal {
            background: rgba(255, 255, 255, 0.20);
            color: #5a4e3a;
        }
        .btn-ghost-modal:hover {

        /* ================================================================
           11. GitHub 面板
           ================================================================ */
        .github-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;

<body>

    <!-- ========================== 主容器 ========================== -->
    <div class="main-container">

        <!-- ===== 左栏 ===== -->
        <div class="col-left">

            <!-- 1. 添加/编辑表单（简化版） -->
            <div class="glass">
                <div class="form-title">
                    <i class="fas fa-pen-fancy"></i> 记录

                    <div class="form-row">

            <!-- 2. 筛选器 -->

        <!-- ===== 右栏 ===== -->
        <div class="col-right">

    <!-- ========================== 确认模态框 ========================== -->
    <div class="modal-overlay" id="confirmModal" onclick="if(event.target===this)window.closeModal()">
        <div class="modal-box">
            <h3 id="confirmTitle"><i class="fas fa-exclamation-triangle" style="color:#c47a6a;"></i> 确认</h3>
            <div class="msg" id="confirmMsg"></div>
            <div class="btn-row">

    <!-- ========================== GitHub 面板 ========================== -->
    <div class="github-panel" id="githubPanel">
        <div class="gp-title">
            <i class="fab fa-github"></i> GitHub 同步
            <span class="close-gp" id="closeGitHubPanelBtn"><i class="fas fa-times"></i></span>
        </div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="githubUsername" placeholder="你的 GitHub 用户名" />
        </div>
        <div class="form-group">
            <label>仓库名</label>
            <input type="text" id="githubRepo" placeholder="仓库名 (如: my-ledger)" />
        </div>
        <div class="form-group">
            <label>令牌 (Personal Access Token)</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
        </div>
        <div class="gp-actions">
            <button class="btn-sm" id="uploadToGitBtn" style="background:var(--primary-gradient);color:#fff;border:none;box-shadow:0 2px 8px var(--primary-glow);"><i class="fas fa-upload"></i> 上传</button>
            <button class="btn-sm" id="importFromGitBtn" style="background:var(--primary-gradient);color:#fff;border:none;box-shadow:0 2px 8px var(--primary-glow);"><i class="fas fa-download"></i> 导入</button>

    <!-- ===== 浮动按钮 ===== -->
    <button class="github-toggle-btn" id="githubToggleBtn">

    </button>

    <!-- ========================== Toast ========================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ========================== JavaScript ========================== -->
    <script>
        (function() {
            'use strict';

            // ================================================================
            //  配置
            // ================================================================
            const STORAGE_KEY = 'promise_log_data';
            const GITHUB_SETTINGS_KEY = 'github_settings_promise_log';

            // ================================================================
            //  数据层
            // ================================================================
            let data = {
                items: []
            };
            let editingId = null;
            let confirmCallback = null;
            let githubPanelOpen = false;

            // ================================================================
            //  工具
            // ================================================================
            function genId() { return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

            function escapeHtml(str) {
                if (!str) return '';
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function formatDate(dateStr) {
                if (!dateStr) return '--';
                const d = new Date(dateStr);
                if (isNaN(d)) return dateStr;
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            // ================================================================
            //  自动状态管理（仅根据截止日期）
            // ================================================================
            function autoAdjustStatus(item) {
                if (item.status === '已完成') return '已完成';
                if (!item.ddl) return '进行中';
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const ddl = new Date(item.ddl);
                ddl.setHours(0, 0, 0, 0);
                return (ddl < today) ? '逾期' : '进行中';
            }

            // ================================================================
            //  Toast
            // ================================================================
            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.textContent = msg;
                container.appendChild(t);
                requestAnimationFrame(() => {
                    t.classList.add('show');
                });
                setTimeout(() => {
                    t.classList.remove('show');
                    t.classList.add('hide');
                    setTimeout(() => {
                        if (t.parentNode) t.parentNode.removeChild(t);
                    }, 300);
                }, 2200);
            }

            // ================================================================
            //  GitHub 设置
            // ================================================================
            function loadGitHubSettings() {
                try {
                    const raw = localStorage.getItem(GITHUB_SETTINGS_KEY);
                    if (raw) {
                        const settings = JSON.parse(raw);
                        document.getElementById('githubUsername').value = settings.username || '';
                        document.getElementById('githubRepo').value = settings.repo || '';
                        document.getElementById('githubToken').value = settings.token || '';
                    }
                } catch (e) { /* ignore */ }
            }

            function saveGitHubSettings() {
                const settings = {
                    username: document.getElementById('githubUsername').value.trim(),
                    repo: document.getElementById('githubRepo').value.trim(),
                    token: document.getElementById('githubToken').value.trim()
                };
                try {
                    localStorage.setItem(GITHUB_SETTINGS_KEY, JSON.stringify(settings));
                } catch (e) { /* ignore */ }
            }

            function getGitHubSettings() {
                return {
                    username: document.getElementById('githubUsername').value.trim(),
                    repo: document.getElementById('githubRepo').value.trim(),
                    token: document.getElementById('githubToken').value.trim()
                };
            }

            // ================================================================
            //  GitHub API 操作
            // ================================================================
            function utf8ToBase64(str) {
                const encoder = new TextEncoder();
                const data = encoder.encode(str);
                let binary = '';
                for (let i = 0; i < data.length; i++) {
                    binary += String.fromCharCode(data[i]);
                }
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                const decoder = new TextDecoder('utf-8');
                return decoder.decode(bytes);
            }

            async function uploadToGit() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo || !settings.token) {
                    showToast('请填写完整的 GitHub 信息', 'warning');
                    return;
                }
                saveGitHubSettings();
                if (!confirm('确定将当前数据上传到 GitHub 仓库 ' + settings.username + '/' + settings.repo +
                        ' 的 /data/promise.json 吗？')) {
                    return;
                }

                const apiUrl = `https://api.github.com/repos/${settings.username}/${settings.repo}/contents/data/promise.json`;

                try {
                    let sha = null;
                    try {
                        const getResp = await fetch(apiUrl, {
                            headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json' }
                        });
                        if (getResp.ok) {
                            const data = await getResp.json();
                            sha = data.sha;
                        } else if (getResp.status !== 404) {
                            const err = await getResp.json();
                            throw new Error('获取文件信息失败: ' + (err.message || getResp.statusText));
                        }
                    } catch (e) { if (e.message && e.message.includes('404')) {} else throw e; }

                    const contentStr = JSON.stringify({ items: data.items }, null, 2);
                    const contentBase64 = utf8ToBase64(contentStr);

                    const body = {
                        message: '更新约定日志 ' + new Date().toISOString(),
                        content: contentBase64,
                        sha: sha || undefined
                    };

                    const putResp = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${settings.token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (!putResp.ok) {
                        const err = await putResp.json();
                        throw new Error('上传失败: ' + (err.message || putResp.statusText));
                    }
                    showToast('✅ 数据已成功上传至 GitHub!', 'success');
                } catch (error) {
                    console.error('上传错误:', error);
                    showToast('❌ 上传失败: ' + error.message, 'error');
                }
            }

            async function importFromGit() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo || !settings.token) {
                    showToast('请填写完整的 GitHub 信息', 'warning');
                    return;
                }
                saveGitHubSettings();
                if (!confirm('确定从 GitHub 仓库 ' + settings.username + '/' + settings.repo +
                        ' 的 /data/promise.json 导入数据吗？\n这将替换当前所有本地数据！')) {
                    return;
                }

                const apiUrl = `https://api.github.com/repos/${settings.username}/${settings.repo}/contents/data/promise.json`;

                try {
                    const resp = await fetch(apiUrl, {
                        headers: {
                            'Authorization': `token ${settings.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (!resp.ok) {
                        if (resp.status === 404) {
                            throw new Error('远程文件不存在，请先上传数据');
                        }
                        const err = await resp.json();
                        throw new Error('获取数据失败: ' + (err.message || resp.statusText));
                    }

                    const data = await resp.json();
                    const content = base64ToUtf8(data.content);
                    const imported = JSON.parse(content);

                    if (!imported.items || !Array.isArray(imported.items)) {
                        throw new Error('数据格式错误');
                    }

                    data.items = imported.items;
                    // 自动调整所有状态
                    data.items.forEach(item => {
                        item.status = autoAdjustStatus(item);
                    });
                    saveData();
                    cancelEdit();
                    renderAll();
                    showToast('✅ 成功从 GitHub 导入 ' + data.items.length + ' 条记录!', 'success');
                } catch (error) {
                    console.error('导入错误:', error);
                    showToast('❌ 导入失败: ' + error.message, 'error');
                }
            }

            function openGitHubRepo() {
                const settings = getGitHubSettings();
                if (!settings.username || !settings.repo) {
                    showToast('请先填写用户名和仓库名', 'warning');
                    return;
                }
                saveGitHubSettings();
                window.open(`https://github.com/${settings.username}/${settings.repo}`, '_blank');
                showToast('正在打开仓库...', 'info');
            }

            // ================================================================
            //  面板开关
            // ================================================================
            function toggleGitHubPanel() {
                githubPanelOpen = !githubPanelOpen;
                const panel = document.getElementById('githubPanel');
                const btn = document.getElementById('githubToggleBtn');
                if (githubPanelOpen) {
                    panel.classList.add('open');
                    btn.style.display = 'none';
                } else {
                    panel.classList.remove('open');
                    btn.style.display = 'flex';
                }
            }

            document.getElementById('openGitHubBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('githubToggleBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('closeGitHubPanelBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('uploadToGitBtn').addEventListener('click', uploadToGit);
            document.getElementById('importFromGitBtn').addEventListener('click', importFromGit);
            document.getElementById('linkToGitBtn').addEventListener('click', openGitHubRepo);

            // ================================================================
            //  存储
            // ================================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed.items && Array.isArray(parsed.items)) {
                            data.items = parsed.items;
                            data.items.forEach(item => {
                                item.status = autoAdjustStatus(item);
                            });
                        }
                    }
                } catch (e) { /* ignore */ }

                if (data.items.length === 0) {
                    // 示例数据
                    const samples = [
                        { name: '张三', type: '借出', content: '借出《三体》三部曲', ddl: '2026-07-20', status: '进行中',
                            note: '约好一个月后还' },
                        { name: '李四', type: '约定', content: '下周五一起吃饭', ddl: '2026-07-05', status: '进行中', note: '地点待定' },
                        { name: '王五', type: '借入', content: '借了充电宝', ddl: '2026-06-15', status: '逾期', note: '忘记还了，尽快还' },
                        { name: '赵六', type: '约定', content: '帮忙修改简历', ddl: '2026-06-20', status: '已完成', note: '已改完发回' },
                        { name: '孙七', type: '借出', content: '借出200元', ddl: '2026-06-08', status: '逾期', note: '说好一周还' },
                        { name: '周八', type: '约定', content: '一起看演唱会', ddl: '2026-07-20', status: '进行中', note: '票已买好' },
                        { name: '吴九', type: '借入', content: '借了《人类简史》', ddl: '2026-06-12', status: '已完成', note: '已归还' },
                    ];
                    samples.forEach(s => {
                        data.items.push({
                            id: genId(),
                            name: s.name,
                            type: s.type,
                            content: s.content,
                            ddl: s.ddl,
                            status: s.status,
                            note: s.note || '',
                        });
                    });
                    saveData();
                }

                // 给截止日期输入框设默认值（一周后）
                if (!document.getElementById('inputDdl').value) {
                    const d = new Date();
                    d.setDate(d.getDate() + 7);
                    document.getElementById('inputDdl').value = d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0');
                }

                renderAll();
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        items: data.items,
                    }));
                } catch (e) { /* ignore */ }
            }

            // ================================================================
            //  核心操作
            // ================================================================
            function saveItem(e) {
                e.preventDefault();

                const name = document.getElementById('inputName').value.trim();
                const type = document.getElementById('inputType').value;
                const content = document.getElementById('inputContent').value.trim();
                const ddl = document.getElementById('inputDdl').value;
                const note = document.getElementById('inputNote').value.trim();
                const editId = document.getElementById('editId').value;

                if (!name) { showToast('请输入对方姓名/称呼', 'warning'); return; }
                if (!content) { showToast('请输入事项内容', 'warning'); return; }
                if (!ddl) { showToast('请选择截止日期', 'warning'); return; }

                // 自动计算状态
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const ddlDate = new Date(ddl);
                ddlDate.setHours(0, 0, 0, 0);
                let status = (ddlDate < today) ? '逾期' : '进行中';

                // 如果是编辑，且原状态为已完成，则保留已完成（除非用户有意修改，但此处强制根据ddl重新计算）
                // 更合理：如果原状态是已完成，我们保留已完成（因为已完成是手动标记的）
                // 但用户已移除状态选择，所以编辑时如果之前是已完成，我们保留已完成，否则自动计算
                if (editId) {
                    const existing = data.items.find(item => item.id === editId);
                    if (existing && existing.status === '已完成') {
                        status = '已完成';
                    }
                }

                if (editId) {
                    const index = data.items.findIndex(item => item.id === editId);
                    if (index !== -1) {
                        data.items[index] = {
                            ...data.items[index],
                            name,
                            type,
                            content,
                            ddl,
                            status: status,
                            note: note || '',
                        };
                        saveData();
                        cancelEdit();
                        renderAll();
                        showToast('✅ 已更新记录', 'success');
                    } else {
                        showToast('❌ 记录不存在', 'warning');
                    }
                } else {
                    data.items.push({
                        id: genId(),
                        name,
                        type,
                        content,
                        ddl,
                        status: status,
                        note: note || '',
                    });
                    saveData();
                    document.getElementById('inputName').value = '';
                    document.getElementById('inputContent').value = '';
                    document.getElementById('inputNote').value = '';
                    const d = new Date();
                    d.setDate(d.getDate() + 7);
                    document.getElementById('inputDdl').value = d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0');
                    renderAll();
                    showToast('✅ 已添加记录', 'success');
                }
            }

            function editItem(id) {
                const item = data.items.find(i => i.id === id);
                if (!item) return;

                document.getElementById('editId').value = item.id;
                document.getElementById('inputName').value = item.name;
                document.getElementById('inputType').value = item.type;
                document.getElementById('inputContent').value = item.content;
                document.getElementById('inputDdl').value = item.ddl || '';
                document.getElementById('inputNote').value = item.note || '';

                document.getElementById('editBadge').classList.add('show');
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-edit"></i> 更新';
                document.getElementById('cancelEditBtn').style.display = 'flex';
                document.getElementById('submitBtn').style.background = 'var(--primary-gradient)';

                document.querySelector('.col-left .glass:first-child').scrollIntoView({ behavior: 'smooth',
                    block: 'center' });
            }

            function cancelEdit() {
                document.getElementById('editId').value = '';
                document.getElementById('inputName').value = '';
                document.getElementById('inputType').value = '约定';
                document.getElementById('inputContent').value = '';
                const d = new Date();
                d.setDate(d.getDate() + 7);
                document.getElementById('inputDdl').value = d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
                document.getElementById('inputNote').value = '';
                document.getElementById('editBadge').classList.remove('show');
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> 保存';
                document.getElementById('cancelEditBtn').style.display = 'none';
                document.getElementById('submitBtn').style.background = '';
            }

            function deleteItem(id) {
                const item = data.items.find(i => i.id === id);
                if (!item) return;
                showConfirm('删除记录', '确定要删除 <strong>' + escapeHtml(item.content) +
                    '</strong> 吗？<br><span style="font-size:12px;color:var(--text-muted);">对方: ' + escapeHtml(item
                    .name) + ' · 类型: ' + escapeHtml(item.type) + '</span>', () => {
                    data.items = data.items.filter(i => i.id !== id);
                    saveData();
                    if (editingId === id) cancelEdit();
                    renderAll();
                    showToast('已删除', 'info');
                });
            }

            // 标记完成
            function markDone(id) {
                const item = data.items.find(i => i.id === id);
                if (!item) return;
                if (item.status === '已完成') {
                    showToast('已经是已完成状态', 'warning');
                    return;
                }
                item.status = '已完成';
                saveData();
                renderAll();
                showToast('🎉 已标记完成', 'success');
            }

            // ================================================================
            //  筛选
            // ================================================================
            function getFilteredItems() {
                const type = document.getElementById('filterType').value;
                const status = document.getElementById('filterStatus').value;
                const hideDone = document.getElementById('filterHideDone').checked;

                return data.items.filter(item => {
                    if (type !== 'all' && item.type !== type) return false;
                    if (status !== 'all' && item.status !== status) return false;
                    if (hideDone && item.status === '已完成') return false;
                    return true;
                });
            }

            function resetFilters() {
                document.getElementById('filterType').value = 'all';
                document.getElementById('filterStatus').value = 'all';
                document.getElementById('filterHideDone').checked = true;
                renderAll();
                showToast('已重置筛选', 'info');
            }

            // ================================================================
            //  模态框
            // ================================================================
            function showConfirm(title, msg, cb) {
                document.getElementById('confirmTitle').innerHTML = title;
                document.getElementById('confirmMsg').innerHTML = msg;
                const modal = document.getElementById('confirmModal');
                confirmCallback = cb;
                const confirmBtn = document.getElementById('confirmBtn');
                confirmBtn.onclick = function(e) {
                    e.stopPropagation();
                    const callback = confirmCallback;
                    closeModal();
                    if (typeof callback === 'function') {
                        callback();
                    }
                    confirmCallback = null;
                };
                modal.classList.add('show');
            }

            function closeModal() {
                const modal = document.getElementById('confirmModal');
                if (modal) {
                    modal.classList.remove('show');
                }
                if (confirmCallback) {
                    confirmCallback = null;
                }
            }

            // ================================================================
            //  清空全部
            // ================================================================
            function confirmClearAll() {
                if (data.items.length === 0) { showToast('没有数据可清空', 'warning'); return; }
                showConfirm('清空所有数据', '确定要 <strong style="color:#c47a6a;">清空所有</strong> 记录吗？<br><span style="font-size:12px;color:var(--text-muted);">建议先导出备份</span>', () => {
                    data.items = [];
                    saveData();
                    cancelEdit();
                    renderAll();
                    showToast('已清空所有数据', 'info');
                });
            }

            // ================================================================
            //  导出 / 导入
            // ================================================================
            function exportData() {
                if (data.items.length === 0) { showToast('没有数据可导出', 'warning'); return; }
                const blob = new Blob([JSON.stringify({ items: data.items }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '约定记录_' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('导出成功！', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.items || !Array.isArray(imported.items)) throw new Error('格式错误');
                        if (!confirm('将替换当前所有数据，是否继续？')) return;
                        data.items = imported.items;
                        data.items.forEach(item => {
                            item.status = autoAdjustStatus(item);
                        });
                        saveData();
                        cancelEdit();
                        renderAll();
                        showToast('成功导入 ' + data.items.length + ' 条记录！', 'success');
                    } catch (err) {
                        showToast('导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ================================================================
            //  渲染
            // ================================================================
            function renderAll() {
                renderCards();
                updateCounts();
            }

            function renderCards() {
                const grid = document.getElementById('cardGrid');
                const items = getFilteredItems();
                const sorted = [...items].sort((a, b) => {
                    if (a.ddl && b.ddl) {
                        if (a.ddl !== b.ddl) return a.ddl.localeCompare(b.ddl);
                    }
                    return a.name.localeCompare(b.name);
                });

                if (sorted.length === 0) {
                    const isFiltering = document.getElementById('filterType').value !== 'all' ||
                        document.getElementById('filterStatus').value !== 'all' ||
                        document.getElementById('filterHideDone').checked;
                    grid.innerHTML = `
                            <div class="empty-state">
                                <div class="icon"><i class="fas ${isFiltering ? 'fa-search' : 'fa-box-open'}"></i></div>
                                <p>${isFiltering ? '没有匹配的记录' : '还没有记录，添加一条吧'}</p>
                                <span class="sub">${isFiltering ? '试试调整筛选条件' : '左侧表单填写后点击「保存」'}</span>
                            </div>
                        `;
                    return;
                }

                grid.innerHTML = sorted.map(item => {
                    const statusClass = item.status === '已完成' ? 'tag-status-done' :
                        item.status === '逾期' ? 'tag-status-overdue' : 'tag-status-progress';
                    const ddlDisplay = item.ddl ? formatDate(item.ddl) : '--';

                    // 类型图标
                    let typeIcon = '';
                    if (item.type === '约定') typeIcon = '<i class="fas fa-handshake" style="color:var(--primary-dark);"></i>';
                    else if (item.type === '借出') typeIcon = '<i class="fas fa-arrow-right" style="color:#d4a86a;"></i>';
                    else if (item.type === '借入') typeIcon = '<i class="fas fa-arrow-left" style="color:#6a9a7a;"></i>';

                    const doneBtn = (item.status !== '已完成') ?
                        `<button class="done-card" onclick="window.markDone('${item.id}')" title="标记完成"><i class="fas fa-check-circle"></i></button>` :
                        '';

                    return `
                            <div class="card-item">
                                <div class="card-name">
                                    ${typeIcon}
                                    ${escapeHtml(item.content)}
                                </div>
                                <div class="card-meta">
                                    <span class="tag tag-type">${escapeHtml(item.type)}</span>
                                    <span class="tag ${statusClass}">${escapeHtml(item.status)}</span>
                                    <span class="card-date"><i class="far fa-hourglass"></i> 截止: ${ddlDisplay}</span>
                                </div>
                                <div class="card-review">
                                    ${item.note ? escapeHtml(item.note) : '<span class="empty-review">— 没有备注 —</span>'}
                                    <span style="font-size:12px;color:var(--text-muted);margin-left:8px;">· ${escapeHtml(item.name)}</span>
                                </div>
                                <div class="card-actions">
                                    ${doneBtn}
                                    <button class="edit-card" onclick="window.editItem('${item.id}')" title="编辑"><i class="fas fa-pen"></i></button>
                                    <button class="del-card" onclick="window.deleteItem('${item.id}')" title="删除"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        `;
                }).join('');
            }

            function updateCounts() {
                const filtered = getFilteredItems();
                document.getElementById('filterCount').textContent = filtered.length;
                document.getElementById('totalCount').textContent = data.items.length;
            }

            // ================================================================
            //  背景鼠标跟随
            // ================================================================
            const body = document.body;
            document.addEventListener('mousemove', function(e) {
                const x = e.clientX / window.innerWidth * 100;
                const y = e.clientY / window.innerHeight * 100;
                body.style.setProperty('--mouse-x', x + '%');
                body.style.setProperty('--mouse-y', y + '%');
            });

            // ================================================================
            //  筛选器事件
            // ================================================================
            document.getElementById('filterType').addEventListener('change', renderAll);
            document.getElementById('filterStatus').addEventListener('change', renderAll);
            document.getElementById('filterHideDone').addEventListener('change', renderAll);

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('confirmModal').classList.contains('show')) closeModal();
                    if (githubPanelOpen) toggleGitHubPanel();
                    if (document.getElementById('editId').value) cancelEdit();
                }
            });

            // ================================================================
            //  全局暴露
            // ================================================================
            window.saveItem = saveItem;
            window.editItem = editItem;
            window.cancelEdit = cancelEdit;
            window.deleteItem = deleteItem;
            window.markDone = markDone;
            window.resetFilters = resetFilters;
            window.exportData = exportData;
            window.importData = importData;
            window.confirmClearAll = confirmClearAll;
            window.closeModal = closeModal;
            window.showConfirm = showConfirm;
            window.toggleGitHubPanel = toggleGitHubPanel;

            // ================================================================
            //  启动
            // ================================================================
            loadData();
            loadGitHubSettings();
            console.log('📓 约定记录 · 墨绿色主题');
            console.log('  📦 已加载 ' + data.items.length + ' 条记录');
            console.log('  ✏️  支持编辑 | 🔄 Git同步 | ✨ 自动状态管理');

        })();
    </script>

</body>
</html>
