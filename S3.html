                    statement: '# 题目描述\n给定模式串 $P$，构建其 KMP 自动机，即对于每个状态 $i$ 和字符 $c$，计算转移 $go[i][c]$。',
                    solution: '# KMP 自动机\n- 状态：当前已匹配的前缀长度\n- 转移：`go[i][c] = (i < n && P[i] == c) ? i+1 : (i == 0 ? 0 : go[pi[i-1]][c])`\n- 预处理 `pi` 数组后，BFS 计算所有转移。',
                    code: '```cpp\nconst int ALPHA = 26;\nint go[N][ALPHA];\n\nvoid build_automaton(string s) {\n    int n = s.size();\n    vector<int> pi(n);\n    for (int i = 1; i < n; i++) {\n        int j = pi[i-1];\n        while (j > 0 && s[i] != s[j]) j = pi[j-1];\n        if (s[i] == s[j]) j++;\n        pi[i] = j;\n    }\n    for (int i = 0; i <= n; i++)\n        for (int c = 0; c < ALPHA; c++)\n            go[i][c] = (i < n && s[i] == \'a\'+c) ? i+1 : (i == 0 ? 0 : go[pi[i-1]][c]);\n}\n```'
                }];
                selectedId = problems[0].id;
                saveProblems();
                renderAll();
                showToast('示例数据加载成功！', 'success');
            }

            // ============================================================
            //  导出 / 导入
            // ============================================================
            function exportData() {
                if (problems.length === 0) { showToast('没有数据可导出', 'warning'); return; }
                saveCurrentContent();
                const data = { problems: problems, tagLibrary: tagLibrary };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '出题灵感_' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('导出成功！', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.problems || !Array.isArray(data.problems)) throw new Error('格式错误');
                        showConfirm('导入数据', '即将导入 <strong>' + data.problems.length +
                            '</strong> 个题目，将 <span style="color:#ef4444;">替换</span> 当前所有题目数据，是否继续？', () => {
                            problems = data.problems;
                            if (data.tagLibrary && Array.isArray(data.tagLibrary)) {
                                tagLibrary = data.tagLibrary;
                                saveTagLibrary();
                            }
                            selectedId = problems.length > 0 ? problems[0].id : null;
                            saveProblems();
                            renderAll();
                            showToast('成功导入 ' + problems.length + ' 个题目！', 'success');
                        });
                    } catch (err) {
                        showToast('导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ============================================================
            //  键盘快捷键
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    if (document.activeElement?.id === 'editorArea') {
                        e.preventDefault();
                        saveCurrentContent();
                        showToast('笔记已保存', 'success');
                    }
                }
                if (e.key === 'Escape') {
                    if (document.getElementById('editModal').classList.contains('show')) closeEditModal();
                    if (document.getElementById('confirmModal').classList.contains('show')) closeModal();
                }
                if (e.key === 'Enter' && document.activeElement?.id === 'inputNewTag') {
                    e.preventDefault();
                    addNewTag();
                }
            });

            // ============================================================
            //  背景鼠标跟随
            // ============================================================
            const body = document.body;
            document.addEventListener('mousemove', e => {
                const x = e.clientX / window.innerWidth * 100;
                const y = e.clientY / window.innerHeight * 100;
                body.style.setProperty('--mouse-x', x + '%');
                body.style.setProperty('--mouse-y', y + '%');
            });

            // ============================================================
            //  初始化 & 全局暴露
            // ============================================================
            window.addNewTag = addNewTag;
            window.toggleTag = toggleTag;
            window.addProblem = addProblem;
            window.deleteProblem = deleteProblem;
            window.selectProblem = selectProblem;
            window.switchTab = switchTab;
            window.setEditorMode = setEditorMode;
            window.onContentChange = onContentChange;
            window.loadSample = loadSample;
            window.confirmClear = confirmClear;
            window.exportData = exportData;
            window.importData = importData;
            window.closeModal = closeModal;
            window.openEditModal = openEditModal;
            window.closeEditModal = closeEditModal;
            window.toggleEditTag = toggleEditTag;
            window.removeTagFromLibrary = removeTagFromLibrary;

            // 启动
            loadData();
            if (problems.length > 0 && !selectedId) {
                selectedId = problems[0].id;
            }
            renderAll();
            setEditorMode('edit', document.querySelector('.editor-toolbar .mode-btn[data-mode="edit"]'));
            console.log('💡 出题灵感记录器 (彻底无边框版本)');
            console.log(`  📊 已加载 ${problems.length} 个题目`);

        })();
    </script>

</body>
</html>
