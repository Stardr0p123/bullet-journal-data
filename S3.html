<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>出题灵感记录器</title>

    <!-- 第三方库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js">
    </script>

    <style>
        /* ================================================================
           1. CSS 变量 & 重置 — 绿色调，彻底无边框
           ================================================================ */
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #6ee7b7;
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --primary-soft: rgba(16, 185, 129, 0.12);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.42);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            --glass-blur: 24px;
            --glass-hover-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition-smooth: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
            min-height: 100vh;
            color: var(--text);
            background: #dce8ef;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(16, 185, 129, 0.15) 0%, rgba(56, 189, 248, 0.04) 40%, rgba(15, 23, 42, 0.01) 70%, transparent 100%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(6, 182, 212, 0.08) 0%, rgba(16, 185, 129, 0.02) 50%, transparent 80%),
                #dce8ef;
            background-attachment: fixed;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 4px;
            transition: background var(--transition-smooth);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.45);
        }

        /* ================================================================
           2. 毛玻璃通用 — 无边框、无内阴影
           ================================================================ */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            transition: box-shadow var(--transition-smooth), transform var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.4;
            transition: opacity var(--transition-smooth);
        }
        .glass:hover::before {
            opacity: 0.7;
        }
        .glass:hover {
            box-shadow: var(--glass-hover-shadow);
            transform: translateY(-3px);
        }
        .glass-glow {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        .glass-glow:hover {
            box-shadow: 0 12px 44px rgba(16, 185, 129, 0.08);
        }

        /* ================================================================
           3. 顶部导航 — 无边框、无内阴影
           ================================================================ */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 28px;
            background: rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: none;
            box-shadow: 0 1px 20px rgba(0, 0, 0, 0.02);
            transition: box-shadow var(--transition-smooth), background var(--transition-smooth);
        }
        .app-header:hover {
            box-shadow: 0 2px 28px rgba(0, 0, 0, 0.04);
        }
        .header-inner {
            max-width: 1640px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            gap: 16px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
            transition: transform var(--transition-bounce), box-shadow var(--transition-smooth);
        }
        .logo-icon:hover {
            transform: scale(1.15) rotate(-8deg) !important;
            box-shadow: 0 8px 36px rgba(16, 185, 129, 0.40);
        }
        .logo-text {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.4px;
        }
        .logo-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 4px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-ghost-sm {
            padding: 6px 16px;
            font-size: 12px;
            border-radius: var(--radius-sm);
            border: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all var(--transition-smooth);
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-ghost-sm:hover {
            background: rgba(255, 255, 255, 0.40);
            color: var(--text);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
        }
        .btn-ghost-sm:active {
            transform: scale(0.95);
        }

        /* ================================================================
           4. 主布局
           ================================================================ */
        .main-container {
            max-width: 1640px;
            margin: 0 auto;
            padding: 20px 28px 28px;
            display: flex;
            gap: 22px;
            height: calc(100vh - 60px);
            min-height: 500px;
            overflow: hidden;
        }
        .left-panel {
            flex: 0 0 340px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }
        .right-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .left-panel .glass,
        .right-panel .glass {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 18px;
            overflow: hidden;
        }
        .left-panel .glass:first-child {
            flex: 0 0 auto;
            padding: 14px 16px;
            overflow-y: auto;
        }
        .left-panel .glass:last-child {
            flex: 1;
            min-height: 0;
        }

        /* ================================================================
           5. 表单 — 无边框、无内阴影
           ================================================================ */
        .form-group {
            margin-bottom: 8px;
        }
        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
            transition: color var(--transition-smooth);
        }
        .form-group:hover label {
            color: var(--primary-dark);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 6px 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(4px);
            color: var(--text);
            transition: all var(--transition-smooth);
            outline: none;
            box-shadow: none;
        }
        .form-group input:hover,
        .form-group select:hover {
            background: rgba(255, 255, 255, 0.22);
        }
        .form-group input:focus,
        .form-group select:focus {
            background: rgba(255, 255, 255, 0.30);
            transform: translateY(-1px);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.06);
        }

        /* ================================================================
           6. 标签库 — 无边框、无内阴影
           ================================================================ */
        .tag-library-section .section-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tag-library-section .section-label .count-badge {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            background: rgba(255, 255, 255, 0.06);
            padding: 0 8px;
            border-radius: var(--radius-full);
            transition: background var(--transition-smooth);
        }
        .tag-library-section .section-label:hover .count-badge {
            background: rgba(255, 255, 255, 0.12);
        }

        .selected-tags-display {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            min-height: 30px;
            padding: 4px 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            border: none;
            margin-bottom: 6px;
            align-items: center;
            transition: background var(--transition-smooth);
            box-shadow: none;
        }
        .selected-tags-display:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .selected-tags-display .placeholder {
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .tag-chip-selected {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px 2px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.15);
            transition: all var(--transition-smooth);
            border: none;
        }
        .tag-chip-selected:hover {
            transform: scale(1.06);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
        }
        .tag-chip-selected .remove-selected {
            cursor: pointer;
            font-size: 12px;
            opacity: 0.7;
            transition: all var(--transition-smooth);
            line-height: 1;
        }
        .tag-chip-selected .remove-selected:hover {
            opacity: 1;
            transform: scale(1.25) rotate(90deg);
        }

        .tag-library-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 90px;
            overflow-y: auto;
            padding: 4px 2px;
            align-content: flex-start;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            transition: max-height var(--transition-smooth), background var(--transition-smooth);
            border: none;
            box-shadow: none;
        }
        .tag-library-list:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .tag-library-list::-webkit-scrollbar {
            width: 3px;
        }
        .tag-library-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.20);
            border-radius: 3px;
        }
        .tag-library-list::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.40);
        }
        .tag-library-list .empty-tags {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 6px 0;
            opacity: 0.5;
        }

        .tag-chip-library {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px 2px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            transition: all var(--transition-smooth);
            user-select: none;
            white-space: nowrap;
            box-shadow: none;
        }
        .tag-chip-library:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .tag-chip-library:active {
            transform: scale(0.92);
        }
        .tag-chip-library.selected {
            background: var(--primary-soft);
            color: var(--primary-dark);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.06);
            transform: scale(1.02);
        }
        .tag-chip-library.selected:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.10), 0 4px 20px rgba(16, 185, 129, 0.06);
        }
        .tag-chip-library .del-tag-btn {
            cursor: pointer;
            font-size: 11px;
            opacity: 0.3;
            transition: all var(--transition-smooth);
            line-height: 1;
            color: var(--text-muted);
            margin-left: 2px;
        }
        .tag-chip-library .del-tag-btn:hover {
            opacity: 1;
            color: var(--danger);
            transform: scale(1.3) rotate(90deg);
        }

        .tag-add-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            align-items: center;
        }
        .tag-add-row input {
            flex: 1;
            padding: 4px 10px;
            border: none;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            color: var(--text);
            transition: all var(--transition-smooth);
            outline: none;
            min-width: 0;
            box-shadow: none;
        }
        .tag-add-row input:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .tag-add-row input:focus {
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.06);
            transform: translateY(-1px);
        }
        .tag-add-row input::placeholder {
            color: var(--text-muted);
            font-size: 11px;
            opacity: 0.6;
        }
        .btn-tag-add {
            padding: 4px 14px;
            border-radius: var(--radius-full);
            border: none;
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            white-space: nowrap;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.10);
        }
        .btn-tag-add:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.25);
        }
        .btn-tag-add:active {
            transform: scale(0.92);
        }

        .btn-primary-sm {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary-gradient);
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            width: 100%;
            margin-top: 6px;
            font-family: inherit;
            box-shadow: 0 2px 12px rgba(16, 185, 129, 0.10);
            position: relative;
            overflow: hidden;
        }
        .btn-primary-sm::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 30%, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .btn-primary-sm:hover::after {
            opacity: 1;
        }
        .btn-primary-sm:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.25);
        }
        .btn-primary-sm:active {
            transform: scale(0.95);
        }

        /* ================================================================
           7. 题目列表 — 彻底无边框、无内阴影
           ================================================================ */
        .problem-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }
        .problem-list::-webkit-scrollbar {
            width: 3px;
        }
        .problem-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.20);
            border-radius: 3px;
        }

        .problem-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.20);
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            transition: all var(--transition-smooth);
            position: relative;
            box-shadow: none;
        }
        .problem-item:hover {
            background: rgba(255, 255, 255, 0.40);
            transform: translateX(4px) translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .problem-item.active {
            background: rgba(16, 185, 129, 0.16);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.06);
        }
        .problem-item.active:hover {
            background: rgba(16, 185, 129, 0.22);
        }

        .problem-item .p-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .problem-item .p-title .left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .problem-item .p-title .left .name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .problem-item .actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .problem-item.active .actions {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .problem-item .actions .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 12px;
            transition: all var(--transition-smooth);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .problem-item .actions .action-btn:hover {
            background: rgba(255, 255, 255, 0.20);
            transform: scale(1.15);
        }
        .problem-item .actions .edit-btn:hover {
            color: var(--primary-dark);
            background: rgba(16, 185, 129, 0.10);
        }
        .problem-item .actions .del-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.10);
        }

        .problem-item .p-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .problem-item .p-meta .cat-tag {
            padding: 1px 8px;
            border-radius: var(--radius-full);
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-muted);
            transition: all var(--transition-smooth);
        }
        .problem-item:hover .p-meta .cat-tag {
            background: rgba(148, 163, 184, 0.20);
        }
        .problem-item .p-meta .diff-tag {
            padding: 1px 8px;
            border-radius: var(--radius-full);
            background: rgba(245, 158, 11, 0.10);
            color: #b45309;
        }
        .problem-item .p-meta .tag-sm {
            padding: 1px 6px;
            border-radius: var(--radius-full);
            background: rgba(16, 185, 129, 0.08);
            color: var(--primary-dark);
            font-size: 10px;
            transition: all var(--transition-smooth);
        }
        .problem-item:hover .p-meta .tag-sm {
            background: rgba(16, 185, 129, 0.16);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .empty-state .icon {
            font-size: 28px;
            opacity: 0.3;
            margin-bottom: 6px;
            transition: all var(--transition-smooth);
        }
        .empty-state:hover .icon {
            opacity: 0.5;
            transform: scale(1.1) rotate(-6deg);
        }

        /* ================================================================
           8. 右侧笔记 — 无边框、无内阴影
           ================================================================ */
        .right-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: none;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .right-header .algo-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .right-header .algo-name .empty {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 15px;
        }
        .right-header .algo-name .name-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.10);
            color: var(--primary-dark);
            font-size: 14px;
            flex-shrink: 0;
            transition: all var(--transition-bounce);
        }
        .right-header .algo-name .name-icon:hover {
            transform: scale(1.25) rotate(-12deg);
            background: rgba(16, 185, 129, 0.22);
        }

        .tab-nav {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            padding: 3px;
            border: none;
            flex-shrink: 0;
            transition: all var(--transition-smooth);
            box-shadow: none;
        }
        .tab-nav:hover {
            background: rgba(255, 255, 255, 0.16);
        }
        .tab-btn {
            padding: 5px 16px;
            border: none;
            background: transparent;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all var(--transition-smooth);
            font-family: inherit;
        }
        .tab-btn:hover:not(.active) {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }
        .tab-btn.active {
            color: var(--primary-dark);
            background: rgba(255, 255, 255, 0.30);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .editor-toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            margin-top: 8px;
            padding-bottom: 6px;
            border-bottom: none;
        }
        .editor-toolbar .mode-btn {
            padding: 3px 14px;
            border-radius: var(--radius-full);
            border: none;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all var(--transition-smooth);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: none;
        }
        .editor-toolbar .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }
        .editor-toolbar .mode-btn.active {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 2px 12px rgba(16, 185, 129, 0.12);
        }

        .note-body {
            flex: 1;
            min-height: 60px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .note-body textarea {
            width: 100%;
            flex: 1;
            min-height: 60px;
            padding: 14px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font-mono);
            line-height: 1.8;
            resize: none;
            transition: all var(--transition-smooth);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            color: var(--text);
            display: block;
            box-shadow: none;
            outline: none;
        }
        .note-body textarea:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .note-body textarea:focus {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.06);
            transform: translateY(-1px);
        }
        .note-body textarea.hidden {
            display: none;
        }

        .note-body .preview {
            flex: 1;
            min-height: 60px;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text);
            display: none;
        }
        .note-body .preview.show {
            display: block;
        }
        .note-body .preview h1,
        .note-body .preview h2,
        .note-body .preview h3 {
            margin: 0.6em 0 0.3em;
            font-weight: 700;
            line-height: 1.3;
        }
        .note-body .preview h1 {
            font-size: 1.5em;
        }
        .note-body .preview h2 {
            font-size: 1.25em;
        }
        .note-body .preview h3 {
            font-size: 1.05em;
        }
        .note-body .preview p {
            margin: 0.4em 0;
        }
        .note-body .preview ul,
        .note-body .preview ol {
            padding-left: 1.6em;
            margin: 0.3em 0;
        }
        .note-body .preview code {
            background: rgba(0, 0, 0, 0.04);
            padding: 0.1em 0.5em;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: var(--font-mono);
        }
        .note-body .preview pre {
            background: rgba(15, 23, 42, 0.85);
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            font-size: 13px;
            font-family: var(--font-mono);
            line-height: 1.7;
            margin: 0.5em 0;
        }
        .note-body .preview pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        .note-body .preview blockquote {
            border-left: 3px solid var(--primary);
            padding-left: 16px;
            margin: 0.4em 0;
            color: var(--text-secondary);
        }
        .note-body .preview .katex-display {
            margin: 0.5em 0;
        }

        .note-footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .note-footer .status .saved {
            color: var(--success);
        }
        .note-footer .status .unsaved {
            color: var(--warning);
        }

        /* ================================================================
           9. Toast & 模态 — 无边框
           ================================================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13px;
            color: #fff;
            background: rgba(15, 23, 42, 0.70);
            backdrop-filter: blur(20px);
            border: none;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06);
            animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.35s cubic-bezier(0.22, 1, 0.36, 1) 2.4s forwards;
            pointer-events: auto;
            max-width: 360px;
        }
        .toast.success {
            background: rgba(16, 185, 129, 0.75);
        }
        .toast.info {
            background: rgba(6, 182, 212, 0.75);
        }
        .toast.warning {
            background: rgba(245, 158, 11, 0.75);
            color: #1e293b;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(50px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(50px) scale(0.92);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.20);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(32px);
            border: none;
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.06);
            max-height: 90vh;
            overflow-y: auto;
            transition: box-shadow var(--transition-smooth);
        }
        .modal:hover {
            box-shadow: 0 32px 96px rgba(0, 0, 0, 0.10);
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .form-group {
            margin-bottom: 12px;
        }
        .modal .form-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 2px;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 6px 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            color: var(--text);
            transition: all var(--transition-smooth);
            box-shadow: none;
            outline: none;
        }
        .modal .form-group input:hover,
        .modal .form-group select:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.06);
        }
        .modal .tag-select-area {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            border: none;
            min-height: 36px;
            align-items: center;
            transition: all var(--transition-smooth);
            box-shadow: none;
        }
        .modal .tag-select-area:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .modal .tag-select-area .tag-option {
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            transition: all var(--transition-smooth);
            user-select: none;
            box-shadow: none;
        }
        .modal .tag-select-area .tag-option:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }
        .modal .tag-select-area .tag-option.selected {
            background: var(--primary-soft);
            color: var(--primary-dark);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.06);
        }
        .modal .tag-select-area .tag-option.selected:hover {
            transform: scale(1.04) translateY(-1px);
        }

        .modal .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        .modal .btn-row .btn {
            flex: 1;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            font-family: inherit;
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.20);
            color: #475569;
            backdrop-filter: blur(4px);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.40);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .btn-primary-modal {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.10);
        }
        .btn-primary-modal:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.25);
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.10);
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(239, 68, 68, 0.20);
        }

        /* ================================================================
           10. 响应式
           ================================================================ */
        @media (max-width: 1000px) {
            .main-container {
                flex-direction: column;
                height: auto;
                overflow: auto;
                padding: 16px;
                gap: 16px;
            }
            .left-panel {
                flex: none;
                width: 100%;
                min-width: 0;
                max-height: 460px;
            }
            .right-panel {
                min-height: 400px;
            }
            body {
                height: auto;
                overflow: auto;
            }
            .left-panel .glass:first-child {
                max-height: 320px;
            }
        }
        @media (max-width: 600px) {
            .header-inner {
                flex-wrap: wrap;
                height: auto;
                padding: 8px 0;
            }
            .right-header {
                flex-direction: column;
                align-items: stretch;
            }
            .tab-nav {
                align-self: flex-start;
                flex-wrap: wrap;
            }
            .left-panel .glass {
                padding: 12px;
            }
            .main-container {
                padding: 10px;
                gap: 10px;
            }
            .editor-toolbar {
                flex-wrap: wrap;
            }
            .left-panel {
                max-height: 400px;
            }
            .left-panel .glass:first-child {
                max-height: 300px;
            }
            .tag-library-list {
                max-height: 70px;
            }
            .modal {
                padding: 20px;
            }
        }
        @media (max-width: 400px) {
            .left-panel .glass:first-child {
                max-height: 280px;
            }
            .tag-library-list {
                max-height: 60px;
            }
            .modal .btn-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <header class="app-header">
        <div class="header-inner">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-lightbulb"></i></div>
                <div>
                    <span class="logo-text">出题灵感 <span class="logo-sub">· 记录器</span></span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-ghost-sm" onclick="loadSample()"><i class="fas fa-clipboard-list"></i> 示例</button>
                <button class="btn-ghost-sm" onclick="confirmClear()"><i class="fas fa-trash-alt"></i> 清空</button>
                <button class="btn-ghost-sm" onclick="exportData()"><i class="fas fa-download"></i> 导出</button>
                <button class="btn-ghost-sm" onclick="document.getElementById('importFile').click()"><i class="fas fa-upload"></i> 导入</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
            </div>
        </div>
    </header>

    <!-- ===== 主容器 ===== -->
    <div class="main-container">

        <!-- 左侧面板 -->
        <div class="left-panel">
            <div class="glass glass-glow">
                <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">
                    <i class="fas fa-plus-circle" style="color:var(--primary-dark);"></i> 添加题目
                </div>
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="inputTitle" placeholder="输入题目名称..." />
                </div>
                <div style="display:flex;gap:8px;">
                    <div class="form-group" style="flex:1;">
                        <label>分类</label>
                        <select id="inputCategory">
                            <option value="数据结构">数据结构</option>
                            <option value="动态规划">动态规划</option>
                            <option value="字符串">字符串</option>
                            <option value="基础算法">基础算法</option>
                            <option value="数学">数学</option>
                            <option value="图论">图论</option>
                            <option value="杂项">杂项</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>难度 (CF)</label>
                        <input type="number" id="inputDifficulty" value="2000" min="800" max="3500" step="50" />
                    </div>
                </div>

                <!-- 标签库 -->
                <div class="tag-library-section">
                    <div class="section-label">
                        <span><i class="fas fa-tags" style="color:var(--primary-dark);font-size:11px;"></i> 算法标签</span>
                        <span class="count-badge" id="tagCountDisplay">0</span>
                    </div>

                    <div class="selected-tags-display" id="selectedTagsDisplay">
                        <span class="placeholder" id="selectedPlaceholder">点击下方标签选择...</span>
                    </div>

                    <div class="tag-library-list" id="tagLibraryList">
                        <div class="empty-tags">暂无标签，添加一个吧</div>
                    </div>

                    <div class="tag-add-row">
                        <input type="text" id="inputNewTag" placeholder="新标签..." onkeydown="if(event.key==='Enter'){event.preventDefault();addNewTag();}" />
                        <button class="btn-tag-add" onclick="addNewTag()"><i class="fas fa-plus"></i> 添加</button>
                    </div>
                </div>

                <button class="btn-primary-sm" onclick="addProblem()"><i class="fas fa-save"></i> 保存灵感</button>
            </div>

            <div class="glass">
                <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;display:flex;justify-content:space-between;">
                    <span><i class="fas fa-list-ul" style="color:var(--primary-dark);"></i> 题目列表</span>
                    <span id="countDisplay" style="font-size:11px;color:var(--text-muted);">0</span>
                </div>
                <div class="problem-list" id="problemList">
                    <!-- 由 JS 动态渲染 -->
                </div>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <div class="glass glass-glow" style="flex:1;display:flex;flex-direction:column;padding:18px 22px;overflow:hidden;">
                <div class="right-header">
                    <span class="algo-name" id="detailTitle"><span class="empty"><i class="fas fa-hand-point-left"></i> 选择题目查看详情</span></span>
                    <div class="tab-nav" id="tabNav">
                        <button class="tab-btn active" data-tab="statement" onclick="switchTab('statement',this)"><i class="fas fa-align-left"></i> 题面</button>
                        <button class="tab-btn" data-tab="solution" onclick="switchTab('solution',this)"><i class="fas fa-pencil-alt"></i> 题解</button>
                        <button class="tab-btn" data-tab="code" onclick="switchTab('code',this)"><i class="fas fa-code"></i> 标程</button>
                    </div>
                </div>

                <div class="editor-toolbar">
                    <button class="mode-btn active" data-mode="edit" onclick="setEditorMode('edit',this)"><i class="fas fa-edit"></i> 编辑</button>
                    <button class="mode-btn" data-mode="preview" onclick="setEditorMode('preview',this)"><i class="fas fa-eye"></i> 预览</button>
                    <span style="flex:1;"></span>
                    <span style="font-size:11px;color:var(--text-muted);"><i class="fas fa-markdown"></i> Markdown · LaTeX</span>
                </div>

                <div class="note-body">
                    <textarea id="editorArea" placeholder="在此编写内容，支持 **Markdown** 和 $$\\LaTeX$$ 语法..." oninput="onContentChange()"></textarea>
                    <div class="preview" id="previewArea"></div>
                </div>
                <div class="note-footer">
                    <span class="status"><span id="saveStatus"><i class="fas fa-check-circle saved"></i> 已保存</span></span>
                    <span style="font-size:10px;color:var(--text-muted);">Ctrl+S 保存</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 编辑模态框 -->
    <div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
        <div class="modal">
            <h3><i class="fas fa-edit" style="color:var(--primary-dark);"></i> 编辑题目</h3>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="editTitle" />
            </div>
            <div style="display:flex;gap:8px;">
                <div class="form-group" style="flex:1;">
                    <label>分类</label>
                    <select id="editCategory">
                        <option value="数据结构">数据结构</option>
                        <option value="动态规划">动态规划</option>
                        <option value="字符串">字符串</option>
                        <option value="基础算法">基础算法</option>
                        <option value="数学">数学</option>
                        <option value="图论">图论</option>
                        <option value="杂项">杂项</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>难度 (CF)</label>
                    <input type="number" id="editDifficulty" min="800" max="3500" step="50" />
                </div>
            </div>
            <div class="form-group">
                <label>标签 (点击切换)</label>
                <div class="tag-select-area" id="editTagSelectArea"></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-ghost" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary-modal" id="saveEditBtn">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 确认模态框 -->
    <div class="modal-overlay" id="confirmModal" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <h3 id="modalTitle">确认</h3>
            <div class="msg" id="modalMsg"></div>
            <div class="btn-row">
                <button class="btn btn-ghost" onclick="closeModal()">取消</button>
                <button class="btn btn-danger" id="modalConfirmBtn">确认</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  数据持久化
            // ============================================================
            const STORAGE_KEY = 'problem_ideas_data';
            const TAG_LIBRARY_KEY = 'problem_tag_library';

            let problems = [];
            let selectedId = null;
            let currentTab = 'statement';
            let selectedTags = [];
            let tagLibrary = [];
            let saveTimer = null;
            let isDirty = false;
            let modalCallback = null;
            let editorMode = 'edit';
            let editingProblemId = null;

            // ============================================================
            //  工具
            // ============================================================
            function genId() { return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

            function escapeHtml(str) {
                if (!str) return '';
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function showToast(msg, type = 'info') {
                const c = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast ' + type;
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => { if (t.parentNode) t.remove(); }, 2500);
            }

            // ============================================================
            //  存储
            // ============================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (Array.isArray(data)) {
                            problems = data;
                        } else {
                            problems = [];
                        }
                    } else {
                        problems = [];
                    }
                } catch (e) {
                    console.warn('加载题目数据失败，使用空数据', e);
                    problems = [];
                }

                try {
                    const rawTags = localStorage.getItem(TAG_LIBRARY_KEY);
                    if (rawTags) {
                        const data = JSON.parse(rawTags);
                        if (Array.isArray(data)) {
                            tagLibrary = data;
                        } else {
                            tagLibrary = ['DP', '图论', '字符串', '数学', '数据结构', '贪心', '二分', '分治', '模拟', '构造', '博弈', '概率',
                                '计数', '位运算'
                            ];
                        }
                    } else {
                        tagLibrary = ['DP', '图论', '字符串', '数学', '数据结构', '贪心', '二分', '分治', '模拟', '构造', '博弈', '概率',
                            '计数', '位运算'
                        ];
                    }
                } catch (e) {
                    console.warn('加载标签库失败，使用默认标签', e);
                    tagLibrary = ['DP', '图论', '字符串', '数学', '数据结构', '贪心', '二分', '分治', '模拟', '构造', '博弈', '概率',
                        '计数', '位运算'
                    ];
                }

                problems.forEach(p => {
                    if (!p.tags) p.tags = [];
                    if (!p.statement) p.statement = '';
                    if (!p.solution) p.solution = '';
                    if (!p.code) p.code = '';
                });

                if (problems.length > 0 && !selectedId) {
                    selectedId = problems[0].id;
                }
            }

            function saveProblems() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(problems));
                } catch (e) {
                    console.warn('保存题目失败', e);
                }
            }

            function saveTagLibrary() {
                try {
                    localStorage.setItem(TAG_LIBRARY_KEY, JSON.stringify(tagLibrary));
                } catch (e) {
                    console.warn('保存标签库失败', e);
                }
            }

            // ============================================================
            //  标签操作
            // ============================================================
            function toggleTag(tag) {
                const idx = selectedTags.indexOf(tag);
                if (idx === -1) selectedTags.push(tag);
                else selectedTags.splice(idx, 1);
                renderAll();
            }

            function isTagSelected(tag) {
                return selectedTags.includes(tag);
            }

            function addNewTag() {
                const input = document.getElementById('inputNewTag');
                const val = input.value.trim();
                if (!val) { showToast('请输入标签名称', 'warning'); return; }
                if (tagLibrary.includes(val)) {
                    if (!selectedTags.includes(val)) {
                        selectedTags.push(val);
                        renderAll();
                        showToast('标签已存在，已自动选中', 'info');
                    } else {
                        showToast('标签已存在且已选中', 'info');
                    }
                    input.value = '';
                    return;
                }
                tagLibrary.push(val);
                saveTagLibrary();
                selectedTags.push(val);
                input.value = '';
                input.focus();
                renderAll();
                showToast('✅ 已添加并选中「' + val + '」', 'success');
            }

            function removeTagFromLibrary(tag) {
                const idx = tagLibrary.indexOf(tag);
                if (idx === -1) return;
                tagLibrary.splice(idx, 1);
                saveTagLibrary();
                const selIdx = selectedTags.indexOf(tag);
                if (selIdx !== -1) selectedTags.splice(selIdx, 1);
                renderAll();
            }

            // ============================================================
            //  渲染
            // ============================================================
            function renderSelectedTags() {
                const container = document.getElementById('selectedTagsDisplay');
                if (selectedTags.length === 0) {
                    container.innerHTML = `<span class="placeholder">点击下方标签选择...</span>`;
                    return;
                }
                container.innerHTML = selectedTags.map(t =>
                    `<span class="tag-chip-selected">${escapeHtml(t)} <span class="remove-selected" onclick="event.stopPropagation();toggleTag('${escapeHtml(t)}')"><i class="fas fa-times"></i></span></span>`
                ).join('');
            }

            function renderTagLibrary() {
                const container = document.getElementById('tagLibraryList');
                const countDisplay = document.getElementById('tagCountDisplay');
                countDisplay.textContent = tagLibrary.length;

                if (tagLibrary.length === 0) {
                    container.innerHTML = `<div class="empty-tags">暂无标签，添加一个吧</div>`;
                    return;
                }

                const sorted = [...tagLibrary].sort((a, b) => a.localeCompare(b));
                container.innerHTML = sorted.map(t => {
                    const selected = isTagSelected(t) ? 'selected' : '';
                    return `<span class="tag-chip-library ${selected}" onclick="toggleTag('${escapeHtml(t)}')">
                                ${escapeHtml(t)}
                                <span class="del-tag-btn" onclick="event.stopPropagation();removeTagFromLibrary('${escapeHtml(t)}')"><i class="fas fa-times"></i></span>
                            </span>`;
                }).join('');
            }

            function renderList() {
                const el = document.getElementById('problemList');
                if (!el) {
                    console.warn('problemList 元素不存在');
                    return;
                }
                document.getElementById('countDisplay').textContent = problems.length;

                if (problems.length === 0) {
                    el.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>还没有题目，添加一个吧</p></div>`;
                    return;
                }

                try {
                    el.innerHTML = problems.map(p => {
                        const active = p.id === selectedId ? 'active' : '';
                        const diffLabel = p.difficulty || '?';
                        const catLabel = p.category || '杂项';
                        const tagHtml = (p.tags || []).slice(0, 3).map(t =>
                            `<span class="tag-sm">${escapeHtml(t)}</span>`
                        ).join('');
                        return `
                                <div class="problem-item ${active}" data-id="${p.id}">
                                    <div class="p-title">
                                        <div class="left" onclick="selectProblem('${p.id}')">
                                            <span class="name-text">${escapeHtml(p.title)}</span>
                                        </div>
                                        <div class="actions">
                                            <button class="action-btn edit-btn" onclick="event.stopPropagation();openEditModal('${p.id}')" title="编辑"><i class="fas fa-pen"></i></button>
                                            <button class="action-btn del-btn" onclick="event.stopPropagation();deleteProblem('${p.id}')" title="删除"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                    <div class="p-meta" onclick="selectProblem('${p.id}')">
                                        <span class="cat-tag">${escapeHtml(catLabel)}</span>
                                        <span class="diff-tag">${diffLabel}</span>
                                        ${tagHtml}
                                    </div>
                                </div>
                            `;
                    }).join('');
                } catch (e) {
                    console.error('渲染题目列表出错', e);
                    el.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-exclamation-triangle"></i></div><p>渲染错误，请检查控制台</p></div>`;
                }
            }

            function renderAll() {
                renderSelectedTags();
                renderTagLibrary();
                renderList();
                updateDetail();
            }

            // ============================================================
            //  题目操作
            // ============================================================
            function addProblem() {
                const title = document.getElementById('inputTitle').value.trim();
                const category = document.getElementById('inputCategory').value;
                const diff = parseInt(document.getElementById('inputDifficulty').value) || 2000;

                if (!title) { showToast('请输入题目名称', 'warning');
                    document.getElementById('inputTitle').focus(); return; }

                selectedTags.forEach(t => {
                    if (!tagLibrary.includes(t)) {
                        tagLibrary.push(t);
                        saveTagLibrary();
                    }
                });

                const newP = {
                    id: genId(),
                    title,
                    category,
                    difficulty: diff,
                    tags: [...selectedTags],
                    statement: '',
                    solution: '',
                    code: ''
                };
                problems.unshift(newP);
                saveProblems();
                selectedTags = [];
                document.getElementById('inputTitle').value = '';
                renderAll();
                selectProblem(newP.id);
                showToast('✅ 已添加「' + title + '」', 'success');
            }

            function deleteProblem(id) {
                const p = problems.find(x => x.id === id);
                if (!p) return;
                showConfirm('删除题目', `确定要删除 <strong>${escapeHtml(p.title)}</strong> 吗？`, () => {
                    problems = problems.filter(x => x.id !== id);
                    if (selectedId === id) {
                        selectedId = problems.length > 0 ? problems[0].id : null;
                    }
                    saveProblems();
                    renderAll();
                    showToast('已删除', 'info');
                });
            }

            function selectProblem(id) {
                if (selectedId === id) return;
                saveCurrentContent();
                selectedId = id;
                renderAll();
            }

            function getSelected() {
                return problems.find(p => p.id === selectedId) || null;
            }

            // ============================================================
            //  编辑模态框
            // ============================================================
            function openEditModal(id) {
                const p = problems.find(x => x.id === id);
                if (!p) return;
                editingProblemId = id;
                document.getElementById('editTitle').value = p.title;
                document.getElementById('editCategory').value = p.category || '数据结构';
                document.getElementById('editDifficulty').value = p.difficulty || 2000;
                renderEditTagSelect(p.tags || []);
                document.getElementById('editModal').classList.add('show');
            }

            function renderEditTagSelect(selected) {
                const container = document.getElementById('editTagSelectArea');
                if (tagLibrary.length === 0) {
                    container.innerHTML = '<span style="color:var(--text-muted);font-size:12px;">暂无标签，请先添加</span>';
                    return;
                }
                const sorted = [...tagLibrary].sort((a, b) => a.localeCompare(b));
                container.innerHTML = sorted.map(t => {
                    const sel = selected.includes(t) ? 'selected' : '';
                    return `<span class="tag-option ${sel}" data-tag="${escapeHtml(t)}" onclick="toggleEditTag('${escapeHtml(t)}')">${escapeHtml(t)}</span>`;
                }).join('');
            }

            function toggleEditTag(tag) {
                const container = document.getElementById('editTagSelectArea');
                container.querySelectorAll('.tag-option').forEach(el => {
                    if (el.dataset.tag === tag) el.classList.toggle('selected');
                });
            }

            function getEditSelectedTags() {
                const container = document.getElementById('editTagSelectArea');
                const selected = [];
                container.querySelectorAll('.tag-option.selected').forEach(el => {
                    selected.push(el.dataset.tag);
                });
                return selected;
            }

            function closeEditModal() {
                document.getElementById('editModal').classList.remove('show');
                editingProblemId = null;
            }

            document.getElementById('saveEditBtn').addEventListener('click', function() {
                const id = editingProblemId;
                if (!id) return;
                const p = problems.find(x => x.id === id);
                if (!p) return;

                const title = document.getElementById('editTitle').value.trim();
                const category = document.getElementById('editCategory').value;
                const difficulty = parseInt(document.getElementById('editDifficulty').value) || 2000;
                const tags = getEditSelectedTags();

                if (!title) { showToast('标题不能为空', 'warning'); return; }

                p.title = title;
                p.category = category;
                p.difficulty = difficulty;
                p.tags = tags;

                tags.forEach(t => {
                    if (!tagLibrary.includes(t)) {
                        tagLibrary.push(t);
                        saveTagLibrary();
                    }
                });

                saveProblems();
                renderAll();
                closeEditModal();
                showToast('✅ 已更新「' + title + '」', 'success');
            });

            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });

            // ============================================================
            //  右侧内容
            // ============================================================
            function updateDetail() {
                const p = getSelected();
                const titleEl = document.getElementById('detailTitle');
                const editor = document.getElementById('editorArea');
                const preview = document.getElementById('previewArea');

                if (!p) {
                    titleEl.innerHTML = `<span class="empty"><i class="fas fa-hand-point-left"></i> 选择题目查看详情</span>`;
                    editor.value = '';
                    preview.innerHTML = '';
                    document.getElementById('saveStatus').innerHTML = '<i class="fas fa-check-circle saved"></i> 已保存';
                    isDirty = false;
                    return;
                }

                titleEl.innerHTML =
                    `<span class="name-icon"><i class="fas fa-book"></i></span><span>${escapeHtml(p.title)}</span>`;

                const content = getTabContent(p);
                editor.value = content;
                renderPreview(content);
                document.getElementById('saveStatus').innerHTML = '<i class="fas fa-check-circle saved"></i> 已保存';
                isDirty = false;
                applyEditorMode(editorMode);
            }

            function getTabContent(p) {
                if (currentTab === 'statement') return p.statement || '';
                if (currentTab === 'solution') return p.solution || '';
                if (currentTab === 'code') return p.code || '';
                return '';
            }

            function setTabContent(p, content) {
                if (currentTab === 'statement') p.statement = content;
                else if (currentTab === 'solution') p.solution = content;
                else if (currentTab === 'code') p.code = content;
            }

            function switchTab(tab, btn) {
                saveCurrentContent();
                currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');
                else {
                    document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');
                }
                const p = getSelected();
                if (p) {
                    const content = getTabContent(p);
                    document.getElementById('editorArea').value = content;
                    renderPreview(content);
                    document.getElementById('saveStatus').innerHTML = '<i class="fas fa-check-circle saved"></i> 已保存';
                    isDirty = false;
                } else {
                    document.getElementById('editorArea').value = '';
                    document.getElementById('previewArea').innerHTML = '';
                }
                applyEditorMode(editorMode);
            }

            function setEditorMode(mode, btn) {
                editorMode = mode;
                document.querySelectorAll('.editor-toolbar .mode-btn').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');
                else {
                    document.querySelector(`.editor-toolbar .mode-btn[data-mode="${mode}"]`)?.classList.add('active');
                }
                applyEditorMode(mode);
            }

            function applyEditorMode(mode) {
                const editor = document.getElementById('editorArea');
                const preview = document.getElementById('previewArea');
                if (mode === 'edit') {
                    editor.classList.remove('hidden');
                    preview.classList.remove('show');
                    const p = getSelected();
                    if (p) editor.value = getTabContent(p);
                } else {
                    editor.classList.add('hidden');
                    preview.classList.add('show');
                    const p = getSelected();
                    if (p) renderPreview(getTabContent(p));
                }
            }

            function onContentChange() {
                const val = document.getElementById('editorArea').value;
                isDirty = true;
                document.getElementById('saveStatus').innerHTML = '<i class="fas fa-circle unsaved"></i> 未保存';
                if (editorMode === 'preview') renderPreview(val);
                if (saveTimer) clearTimeout(saveTimer);
                saveTimer = setTimeout(saveCurrentContent, 600);
            }

            function saveCurrentContent() {
                const p = getSelected();
                if (!p) return;
                const val = document.getElementById('editorArea').value;
                const old = getTabContent(p);
                if (old !== val) {
                    setTabContent(p, val);
                    saveProblems();
                }
                isDirty = false;
                document.getElementById('saveStatus').innerHTML = '<i class="fas fa-check-circle saved"></i> 已保存';
                if (editorMode === 'preview') renderPreview(val);
            }

            function renderPreview(md) {
                const preview = document.getElementById('previewArea');
                if (!md || md.trim() === '') {
                    preview.innerHTML = '<span style="color:var(--text-muted);font-size:13px;"><i class="fas fa-pencil-alt"></i> 内容为空，开始记录吧...</span>';
                    return;
                }
                try {
                    let html = marked.parse(md);
                    preview.innerHTML = html;
                    if (typeof renderMathInElement === 'function') {
                        renderMathInElement(preview, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false },
                                { left: '\\(', right: '\\)', display: false },
                                { left: '\\[', right: '\\]', display: true },
                            ],
                            throwOnError: false,
                        });
                    }
                } catch (e) {
                    preview.innerHTML = `<span style="color:var(--danger);">⚠️ 渲染错误：${escapeHtml(e.message)}</span>`;
                }
            }

            // ============================================================
            //  模态框
            // ============================================================
            function showConfirm(title, msg, cb) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMsg').innerHTML = msg;
                document.getElementById('confirmModal').classList.add('show');
                modalCallback = cb;
                document.getElementById('modalConfirmBtn').onclick = function() {
                    document.getElementById('confirmModal').classList.remove('show');
                    if (modalCallback) modalCallback();
                    modalCallback = null;
                };
            }

            function closeModal() {
                document.getElementById('confirmModal').classList.remove('show');
                modalCallback = null;
            }

            function confirmClear() {
                if (problems.length === 0) { showToast('没有数据可清空', 'info'); return; }
                showConfirm('清空所有数据', '确定要 <strong style="color:#ef4444;">清空所有</strong> 题目吗？<br><span style="font-size:11px;color:#94a3b8;">标签库会保留</span>', () => {
                    problems = [];
                    selectedId = null;
                    saveProblems();
                    renderAll();
                    showToast('已清空', 'info');
                });
            }

            // ============================================================
            //  示例数据
            // ============================================================
            function loadSample() {
                if (problems.length > 0) {
                    showConfirm('加载示例数据', '将 <strong style="color:#ef4444;">替换</strong> 当前所有题目数据，是否继续？', () => {
                        doLoadSample();
                    });
                } else {
                    doLoadSample();
                }
            }

            function doLoadSample() {
                const sampleTags = ['线段树', '分治', '树上DP', '背包', 'KMP', '自动机'];
                sampleTags.forEach(t => {
                    if (!tagLibrary.includes(t)) {
                        tagLibrary.push(t);
                        saveTagLibrary();
                    }
                });

                problems = [{
                    id: genId(),
                    title: '区间最大子段和',
                    category: '数据结构',
                    difficulty: 1800,
                    tags: ['线段树', '分治'],
                    statement: '# 题目描述\n给定长度为 $n$ 的序列 $a$，$q$ 次询问，每次询问区间 $[l, r]$ 的最大子段和。\n\n## 输入格式\n第一行 $n$，第二行 $n$ 个整数，第三行 $q$，接下来 $q$ 行每行 $l, r$。\n\n## 输出格式\n对于每个询问，输出一个整数。\n\n## 数据范围\n$1 \\le n, q \\le 2 \\times 10^5$',
                    solution: '# 题解思路\n使用线段树维护四个值：\n- `sum`：区间和\n- `lmax`：左端点开始的最大子段和\n- `rmax`：右端点结束的最大子段和\n- `tmax`：区间最大子段和\n\n## 合并公式\n$$sum = l.sum + r.sum$$\n$$lmax = \\max(l.lmax, l.sum + r.lmax)$$\n$$rmax = \\max(r.rmax, r.sum + l.rmax)$$\n$$tmax = \\max(l.tmax, r.tmax, l.rmax + r.lmax)$$',
                    code: '```cpp\nstruct Node {\n    long long sum, lmax, rmax, tmax;\n};\n\nNode merge(Node a, Node b) {\n    Node res;\n    res.sum = a.sum + b.sum;\n    res.lmax = max(a.lmax, a.sum + b.lmax);\n    res.rmax = max(b.rmax, b.sum + a.rmax);\n    res.tmax = max({a.tmax, b.tmax, a.rmax + b.lmax});\n    return res;\n}\n```'
                }, {
                    id: genId(),
                    title: '树形背包',
                    category: '动态规划',
                    difficulty: 2200,
                    tags: ['树上DP', '背包'],
                    statement: '# 题目描述\n给定一棵 $n$ 个节点的树，每个节点有体积 $w_i$ 和价值 $v_i$。选择一些节点，使得它们构成一个连通块，且总体积不超过 $m$，求最大价值。',
                    solution: '# 解法\n树形背包模板。设 $dp[u][j]$ 表示以 $u$ 为根的子树中，选择包含 $u$ 的连通块，体积为 $j$ 的最大价值。\n\n转移时合并子树，类似分组背包。\n\n## 复杂度\n$O(n \\cdot m^2)$ 可优化到 $O(n \\cdot m)$',
                    code: '```cpp\nvoid dfs(int u, int fa) {\n    for (int j = w[u]; j <= m; j++) dp[u][j] = v[u];\n    for (int v : adj[u]) {\n        if (v == fa) continue;\n        dfs(v, u);\n        for (int j = m; j >= w[u]; j--)\n            for (int k = 0; k <= j - w[u]; k++)\n                dp[u][j] = max(dp[u][j], dp[u][j-k] + dp[v][k]);\n    }\n}\n```'
                }, {
                    id: genId(),
                    title: 'KMP自动机',
                    category: '字符串',
                    difficulty: 2000,
                    tags: ['KMP', '自动机'],
