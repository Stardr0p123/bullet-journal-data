
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>工具箱合集 · 波纹入场</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ================================================================
           1.  CSS 变量
           ================================================================ */
        :root {
            --primary: #06b6d4;
            --primary-dark: #0e7490;
            --primary-light: #67e8f9;
            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 40%, #3b82f6 100%);

            --glass-bg: rgba(255, 255, 255, 0.38);
            --glass-bg-hover: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.03), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            --glass-hover-shadow: 0 24px 72px rgba(0, 0, 0, 0.10), 0 4px 12px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(255, 255, 255, 0.35) inset;
            --glass-blur: 24px;

            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;

            --radius: 22px;
            --radius-sm: 14px;

            --transition-smooth: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-spring: 0.7s cubic-bezier(0.18, 1.2, 0.4, 1);

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;

            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        /* ================================================================
           2.  全局重置 & 背景 — 动态光晕跟随
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 15px;
            min-height: 100vh;
            color: var(--text);
            background: #dce8ef;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(6, 182, 212, 0.18) 0%, rgba(56, 189, 248, 0.06) 40%, rgba(15, 23, 42, 0.01) 70%, transparent 100%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(59, 130, 246, 0.10) 0%, rgba(139, 92, 246, 0.04) 45%, transparent 80%),
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.20) 0%, transparent 50%),
                #dce8ef;
            background-attachment: fixed;
            transition: background 0.06s ease;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* 主光晕 */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 60% 50% at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            transition: background 0.08s ease;
            opacity: 0.6;
        }

        /* 次光晕 */
        body::after {
            content: '';
            position: fixed;
            inset: -50%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 40% 35% at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(6, 182, 212, 0.06) 0%, rgba(139, 92, 246, 0.03) 45%, transparent 70%);
            transition: background 0.08s ease;
            opacity: 0.5;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.20);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.40);
        }

        /* ================================================================
           3.  主容器
           ================================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1120px;
            width: 100%;
            padding: 16px 0 8px;
        }

        /* ================================================================
           4.  标题 — 流光渐变
           ================================================================ */
        .main-title {
            text-align: center;
            margin-bottom: 48px;
            animation: titleFloat 1s cubic-bezier(0.22, 1, 0.36, 1) both;
            position: relative;
        }

        .main-title h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 25%, #3b82f6 50%, #8b5cf6 75%, #06b6d4 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            position: relative;
            animation: gradientFlow 6s ease-in-out infinite alternate;
            filter: drop-shadow(0 2px 20px rgba(6, 182, 212, 0.15));
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .main-title .title-glow {
            position: absolute;
            inset: -20px -40px;
            border-radius: 60px;
            background: radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(6, 182, 212, 0.10) 0%, rgba(59, 130, 246, 0.04) 40%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: -1;
        }
        .main-title:hover .title-glow {
            opacity: 1;
        }

        .main-title .title-underline {
            display: block;
            width: 80px;
            height: 4px;
            margin: 10px auto 0;
            background: var(--primary-gradient);
            border-radius: 4px;
            opacity: 0.3;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .main-title .title-underline::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transform: translateX(-100%);
            animation: underlineSweep 3s ease-in-out infinite;
        }
        @keyframes underlineSweep {
            0%,
            100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }
        .main-title:hover .title-underline {
            width: 140px;
            opacity: 0.6;
        }

        .main-title .sub {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 10px;
            -webkit-text-fill-color: var(--text-muted);
            letter-spacing: 3px;
            opacity: 0.6;
            transition: opacity var(--transition-smooth);
        }
        .main-title:hover .sub {
            opacity: 1;
        }

        @keyframes titleFloat {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ================================================================
           5.  卡片网格 — 3行 x 4列
           ================================================================ */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }
            .main-title h1 {
                font-size: 40px;
            }
        }

        @media (max-width: 540px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .main-title h1 {
                font-size: 30px;
            }
            .main-title .sub {
                font-size: 12px;
                letter-spacing: 2px;
            }
        }

        /* ================================================================
           6.  卡片 — 琉璃毛玻璃 + 3D视差 + 流光扫过
           ================================================================ */
        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 18px 26px;
            border-radius: var(--radius);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            position: relative;
            overflow: hidden;
            min-height: 180px;
            text-align: center;
            user-select: none;
            transition: all var(--transition-smooth);
            /* 初始状态 (入场动画由 JS 设置 animation-delay) */
            opacity: 0;
            transform: translateY(30px) scale(0.94);
            will-change: transform, opacity;
            /* 3D 视差基准 */
            transform-style: preserve-3d;
            perspective: 800px;
        }

        /* 入场动画关键帧 */
        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 卡片应用入场动画 */
        .tool-card {
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            /* 延迟由 JS 动态设置 */;
        }

        /* 流光扫过 (伪元素) */
        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(ellipse at 28% 18%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.03) 45%, transparent 70%),
                radial-gradient(ellipse at 75% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
            pointer-events: none;
            opacity: 0.4;
            transition: opacity var(--transition-smooth);
            z-index: 0;
        }

        .tool-card:hover::before {
            opacity: 0.8;
        }

        /* 流光斜向扫过 (悬停) */
        .tool-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(135deg, transparent 30%, rgba(255, 255, 255, 0.15) 45%, rgba(255, 255, 255, 0.25) 50%, rgba(255, 255, 255, 0.15) 55%, transparent 70%);
            transform: translateX(-100%) translateY(-100%) rotate(25deg);
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
        }

        .tool-card:hover::after {
            transform: translateX(100%) translateY(100%) rotate(25deg);
            opacity: 1;
        }

        .tool-card>* {
            position: relative;
            z-index: 1;
        }

        /* 悬停状态 — 上浮 + 3D 旋转由 JS 控制 */
        .tool-card:hover {
            background: var(--glass-bg-hover);
            border-color: rgba(255, 255, 255, 0.50);
            box-shadow: var(--glass-hover-shadow);
            transition: all var(--transition-smooth);
        }

        .tool-card:active {
            transform: scale(0.95) !important;
            transition-duration: 0.1s;
        }

        /* 图标 */
        .tool-card .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--primary-gradient);
            color: #fff;
            font-size: 32px;
            box-shadow: 0 6px 24px rgba(6, 182, 212, 0.22);
            transition: all var(--transition-bounce);
            margin-bottom: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .tool-card .icon-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 25%, rgba(255, 255, 255, 0.35) 0%, transparent 60%);
            pointer-events: none;
        }

        .tool-card .icon-wrap::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 22px;
            background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
        }
        .tool-card:hover .icon-wrap::before {
            opacity: 1;
        }

        .tool-card:hover .icon-wrap {
            transform: scale(1.14) rotate(-6deg);
            box-shadow: 0 12px 40px rgba(6, 182, 212, 0.35);
        }

        .tool-card .name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
            transition: all var(--transition-smooth);
            line-height: 1.3;
        }

        .tool-card:hover .name {
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .tool-card .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            opacity: 0.4;
            transition: all var(--transition-smooth);
            letter-spacing: 0.3px;
            transform: translateY(2px);
        }

        .tool-card:hover .hint {
            opacity: 0.9;
            transform: translateY(0);
        }

        /* ================================================================
           7.  卡片图标渐变色 (12种)
           ================================================================ */
        .tool-card:nth-child(1) .icon-wrap {
            background: linear-gradient(135deg, #d4a04a 0%, #b8883a 100%);
            box-shadow: 0 6px 24px rgba(212, 160, 74, 0.30);
        }
        .tool-card:nth-child(1):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(212, 160, 74, 0.45);
        }

        .tool-card:nth-child(2) .icon-wrap {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.30);
        }
        .tool-card:nth-child(2):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(245, 158, 11, 0.45);
        }

        .tool-card:nth-child(3) .icon-wrap {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 6px 24px rgba(74, 222, 128, 0.30);
        }
        .tool-card:nth-child(3):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(74, 222, 128, 0.45);
        }

        .tool-card:nth-child(4) .icon-wrap {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.30);
        }
        .tool-card:nth-child(4):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.45);
        }

        .tool-card:nth-child(5) .icon-wrap {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.30);
        }
        .tool-card:nth-child(5):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.45);
        }

        .tool-card:nth-child(6) .icon-wrap {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            box-shadow: 0 6px 24px rgba(6, 182, 212, 0.30);
        }
        .tool-card:nth-child(6):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(6, 182, 212, 0.45);
        }

        .tool-card:nth-child(7) .icon-wrap {
            background: linear-gradient(135deg, #06b6d4 0%, #67e8f9 100%);
            box-shadow: 0 6px 24px rgba(6, 182, 212, 0.30);
        }
        .tool-card:nth-child(7):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(6, 182, 212, 0.45);
        }

        .tool-card:nth-child(8) .icon-wrap {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.30);
        }
        .tool-card:nth-child(8):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(79, 70, 229, 0.45);
        }

        .tool-card:nth-child(9) .icon-wrap {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a7a 100%);
            box-shadow: 0 6px 24px rgba(30, 58, 95, 0.30);
        }
        .tool-card:nth-child(9):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(30, 58, 95, 0.45);
        }

        .tool-card:nth-child(10) .icon-wrap {
            background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.25);
        }
        .tool-card:nth-child(10):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.40);
        }

        .tool-card:nth-child(11) .icon-wrap {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            box-shadow: 0 6px 24px rgba(236, 72, 153, 0.30);
        }
        .tool-card:nth-child(11):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(236, 72, 153, 0.45);
        }

        .tool-card:nth-child(12) .icon-wrap {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
            box-shadow: 0 6px 24px rgba(148, 163, 184, 0.20);
        }
        .tool-card:nth-child(12):hover .icon-wrap {
            box-shadow: 0 12px 40px rgba(148, 163, 184, 0.30);
        }

        /* ================================================================
           8.  页脚
           ================================================================ */
        .footer {
            text-align: center;
            margin-top: 42px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.3;
            letter-spacing: 0.8px;
            transition: opacity var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .footer:hover {
            opacity: 0.7;
        }

        .footer .line {
            flex: 1;
            max-width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-muted), transparent);
            opacity: 0.2;
        }

        .footer i {
            margin: 0 4px;
            font-size: 10px;
        }

        /* ================================================================
           9.  点击涟漪
           ================================================================ */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.40) 0%, rgba(6, 182, 212, 0.15) 50%, transparent 70%);
            transform: scale(0);
            animation: rippleBurst 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes rippleBurst {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(5);
                opacity: 0;
            }
        }

        /* ================================================================
           10. 响应式微调
           ================================================================ */
        @media (max-width: 600px) {
            .tool-card {
                min-height: 150px;
                padding: 22px 14px 18px;
                border-radius: 18px;
            }
            .tool-card .icon-wrap {
                width: 58px;
                height: 58px;
                font-size: 26px;
                border-radius: 14px;
            }
            .tool-card .name {
                font-size: 15px;
            }
            .tool-card .hint {
                font-size: 11px;
            }
            .main-title h1 {
                font-size: 28px;
            }
            .main-title .sub {
                font-size: 11px;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 400px) {
            .tool-card {
                min-height: 130px;
                padding: 18px 10px 14px;
            }
            .tool-card .icon-wrap {
                width: 48px;
                height: 48px;
                font-size: 20px;
                border-radius: 12px;
            }
            .tool-card .name {
                font-size: 13px;
            }
            .main-title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 标题 -->
        <div class="main-title">
            <h1>工具箱合集</h1>
            <span class="title-glow"></span>
            <span class="title-underline"></span>
            <span class="sub">— 轻量化小工具合集 —</span>
        </div>

        <!-- 卡片网格 -->
        <div class="grid">

            <!-- 1. 项目进度 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Product.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-project-diagram"></i></span>
                <span class="name">项目进度</span>
                <span class="hint">链式追踪 · 阶段管理</span>
            </a>

            <!-- 2. 记账清单 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Cost.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-coins"></i></span>
                <span class="name">记账清单</span>
                <span class="hint">收支追踪 · 账单管理</span>
            </a>

            <!-- 3. 专辑记录 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Album.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-compact-disc"></i></span>
                <span class="name">专辑记录</span>
                <span class="hint">音乐收藏 · 聆听轨迹</span>
            </a>

            <!-- 4. 出题灵感 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/State.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-lightbulb"></i></span>
                <span class="name">出题灵感</span>
                <span class="hint">题目构思 · 笔记沉淀</span>
            </a>

            <!-- 5. 约定记录 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Promise.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-handshake"></i></span>
                <span class="name">约定记录</span>
                <span class="hint">约定借还 · 智能管理</span>
            </a>

            <!-- 6. 复习计划 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Review.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-brain"></i></span>
                <span class="name">复习计划</span>
                <span class="hint">算法追踪 · 间隔复习</span>

    <!-- ================================================================
         交互 JS：波纹延迟 + 3D视差 + 光晕跟随 + 涟漪
         ================================================================ -->
    <script>
        (function() {
            'use strict';

            const body = document.body;
            const cards = document.querySelectorAll('.tool-card');
            const titleGlow = document.querySelector('.title-glow');
            let frameId = null;

            // ---- 1. 波纹延迟：从中心向外扩散 ----
            const cols = 4;
            const total = cards.length;
            const rows = Math.ceil(total / cols);
            const centerCol = (cols - 1) / 2; // 1.5
            const centerRow = (rows - 1) / 2; // 1

            cards.forEach((card, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                const dist = Math.sqrt((row - centerRow) ** 2 + (col - centerCol) ** 2);
                // 延迟：距离 * 0.12s，最大约 0.25s
                const delay = dist * 0.12;
                card.style.animationDelay = delay + 's';
            });

            // ---- 2. 鼠标位置更新 (光晕跟随) ----
            document.addEventListener('mousemove', function(e) {
                if (frameId) cancelAnimationFrame(frameId);
                frameId = requestAnimationFrame(function() {
                    const x = (e.clientX / window.innerWidth * 100);
                    const y = (e.clientY / window.innerHeight * 100);
                    body.style.setProperty('--mouse-x', x + '%');
                    body.style.setProperty('--mouse-y', y + '%');

                    // 标题光晕
                    if (titleGlow) {
                        const rect = titleGlow.parentElement.getBoundingClientRect();
                        const cx = ((e.clientX - rect.left) / rect.width * 100);
                        const cy = ((e.clientY - rect.top) / rect.height * 100);
                        titleGlow.style.setProperty('--mouse-x', cx + '%');
                        titleGlow.style.setProperty('--mouse-y', cy + '%');
                    }

                    frameId = null;
                });
            }, { passive: true });

            // ---- 3. 卡片 3D 视差 (悬停时) ----
            let activeCard = null;

            cards.forEach(function(card) {
                card.addEventListener('mouseenter', function() {
                    activeCard = card;
                    // 暂停任何可能冲突的过渡
                });

                card.addEventListener('mouseleave', function() {
                    activeCard = null;
                    card.style.transform = '';
                });

                // 点击涟漪
                card.addEventListener('click', function(e) {
                    if (e.button !== 0) return;
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.style.width = '24px';
                    ripple.style.height = '24px';
                    ripple.style.marginLeft = '-12px';
                    ripple.style.marginTop = '-12px';
                    const hue = 180 + Math.random() * 60;
                    ripple.style.background =
                        `radial-gradient(circle, rgba(255,255,255,0.5) 0%, hsla(${hue}, 80%, 60%, 0.25) 50%, transparent 70%)`;
                    card.appendChild(ripple);
                    setTimeout(function() {
                        if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
                    }, 700);
                });
            });

            // 全局 mousemove 更新 activeCard 的 3D 旋转
            document.addEventListener('mousemove', function(e) {
                if (!activeCard) return;
                const rect = activeCard.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const deltaX = (e.clientX - centerX) / rect.width;
                const deltaY = (e.clientY - centerY) / rect.height;
                const rotateY = deltaX * 10;
                const rotateX = -deltaY * 10;
                activeCard.style.transform =
                    `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            }, { passive: true });

            // ---- 4. 窗口失焦重置 ----
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    cards.forEach(function(c) {
                        c.style.transform = '';
                    });
                    activeCard = null;
                }
            });

        })();
    </script>
