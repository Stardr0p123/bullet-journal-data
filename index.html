<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>工具箱合集</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ================================================================
           1.  CSS 变量 — 琉璃风格统一
           ================================================================ */
        :root {
            --primary: #06b6d4;
            --primary-dark: #0e7490;
            --primary-light: #67e8f9;
            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 40%, #3b82f6 100%);

            --glass-bg: rgba(255, 255, 255, 0.42);
            --glass-bg-hover: rgba(255, 255, 255, 0.58);
            --glass-border: rgba(255, 255, 255, 0.32);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.03), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
            --glass-hover-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(255, 255, 255, 0.22) inset;
            --glass-blur: 22px;

            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;

            --radius: 20px;
            --radius-sm: 12px;
            --radius-full: 9999px;

            --transition-smooth: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;

            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        /* ================================================================
           2.  全局重置 & 背景
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 15px;
            min-height: 100vh;
            color: var(--text);
            background: #dce8ef;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(6, 182, 212, 0.16) 0%, rgba(56, 189, 248, 0.05) 35%, rgba(15, 23, 42, 0.01) 65%, transparent 100%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(59, 130, 246, 0.08) 0%, rgba(139, 92, 246, 0.03) 40%, transparent 75%),
                #dce8ef;
            background-attachment: fixed;
            transition: background 0.08s ease;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(255, 255, 255, 0.04) 0%, transparent 40%);
            transition: background 0.08s ease;
            opacity: 0.7;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.45);
        }

        /* ================================================================
           3.  主容器
           ================================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            padding: 20px 0;
        }

        /* ================================================================
           4.  标题
           ================================================================ */
        .main-title {
            text-align: center;
            margin-bottom: 44px;
            animation: titleFloat 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .main-title h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            position: relative;
            text-shadow: none;
        }

        .main-title .title-underline {
            display: block;
            width: 80px;
            height: 4px;
            margin: 8px auto 0;
            background: var(--primary-gradient);
            border-radius: 4px;
            opacity: 0.35;
            transition: width var(--transition-smooth), opacity var(--transition-smooth);
        }

        .main-title:hover .title-underline {
            width: 120px;
            opacity: 0.6;
        }

        .main-title .sub {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 8px;
            -webkit-text-fill-color: var(--text-muted);
            letter-spacing: 2px;
        }

        @keyframes titleFloat {
            0% {
                opacity: 0;
                transform: translateY(-24px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ================================================================
           5.  卡片网格 — 2行 x 3列
           ================================================================ */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            .main-title h1 {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .main-title h1 {
                font-size: 28px;
            }
            .main-title .sub {
                font-size: 12px;
            }
        }

        /* ================================================================
           6.  卡片 — 琉璃毛玻璃
           ================================================================ */
        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px 24px;
            border-radius: var(--radius);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: all var(--transition-smooth);
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            position: relative;
            overflow: hidden;
            min-height: 180px;
            text-align: center;
            user-select: none;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(ellipse at 28% 18%, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.03) 45%, transparent 70%),
                radial-gradient(ellipse at 75% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            pointer-events: none;
            opacity: 0.35;
            transition: opacity var(--transition-smooth);
            z-index: 0;
        }

        .tool-card:hover::before {
            opacity: 0.7;
        }

        .tool-card>* {
            position: relative;
            z-index: 1;
        }

        .tool-card:not(.disabled):hover {
            background: var(--glass-bg-hover);
            border-color: rgba(255, 255, 255, 0.50);
            box-shadow: var(--glass-hover-shadow);
            transform: translateY(-6px) scale(1.01);
        }

        .tool-card:active:not(.disabled) {
            transform: scale(0.96);
            transition-duration: 0.1s;
        }

        /* 禁用状态（敬请期待） */
        .tool-card.disabled {
            opacity: 0.7;
            cursor: not-allowed;
            filter: grayscale(0.2);
        }

        .tool-card.disabled:hover {
            transform: translateY(-2px);
            background: var(--glass-bg-hover);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: var(--glass-hover-shadow);
        }

        .tool-card.disabled .icon-wrap {
            opacity: 0.6;
        }

        /* 卡片图标 */
        .tool-card .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--primary-gradient);
            color: #fff;
            font-size: 32px;
            box-shadow: 0 8px 28px rgba(6, 182, 212, 0.22);
            transition: all var(--transition-bounce);
            margin-bottom: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .tool-card .icon-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse at 30% 25%, rgba(255, 255, 255, 0.30) 0%, transparent 60%);
            pointer-events: none;
        }

        .tool-card:not(.disabled):hover .icon-wrap {
            transform: scale(1.12) rotate(-6deg);
            box-shadow: 0 12px 40px rgba(6, 182, 212, 0.35);
        }

        /* 卡片名称 */
        .tool-card .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
            transition: color var(--transition-smooth);
        }

        .tool-card:not(.disabled):hover .name {
            color: var(--primary-dark);
        }

        .tool-card .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            opacity: 0.5;
            transition: opacity var(--transition-smooth);
            letter-spacing: 0.3px;
        }

        .tool-card:not(.disabled):hover .hint {
            opacity: 0.8;
        }

        /* ================================================================
           7.  每个卡片独特的图标渐变色
           ================================================================ */
        .tool-card:nth-child(1) .icon-wrap {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        }
        .tool-card:nth-child(2) .icon-wrap {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
        }
        .tool-card:nth-child(3) .icon-wrap {
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
        }
        .tool-card:nth-child(4) .icon-wrap {
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
        }
        .tool-card:nth-child(5) .icon-wrap {
            background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
        }
        .tool-card:nth-child(6) .icon-wrap {
            background: linear-gradient(135deg, #64748b 0%, #94a3b8 100%);
        }

        /* ================================================================
           8.  页脚
           ================================================================ */
        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.4;
            letter-spacing: 0.5px;
            transition: opacity var(--transition-smooth);
        }

        .footer:hover {
            opacity: 0.7;
        }

        .footer i {
            margin: 0 4px;
        }

        /* ================================================================
           9.  入场动画延迟
           ================================================================ */
        .tool-card {
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .tool-card:nth-child(1) {
            animation-delay: 0.05s;
        }
        .tool-card:nth-child(2) {
            animation-delay: 0.10s;
        }
        .tool-card:nth-child(3) {
            animation-delay: 0.15s;
        }
        .tool-card:nth-child(4) {
            animation-delay: 0.20s;
        }
        .tool-card:nth-child(5) {
            animation-delay: 0.25s;
        }
        .tool-card:nth-child(6) {
            animation-delay: 0.30s;
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 点击波纹效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Toast 消息 */
        .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
            animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.35s cubic-bezier(0.22, 1, 0.36, 1) 2.2s forwards;
            pointer-events: auto;
            text-align: center;
            white-space: nowrap;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.92);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 标题 -->
        <div class="main-title">
            <h1>🧰 工具箱合集</h1>
            <span class="title-underline"></span>
            <span class="sub">— 轻量 · 优雅 · 高效 —</span>
        </div>

        <!-- 卡片网格 2行 x 3列 -->
        <div class="grid">

            <!-- 1. 复习计划 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Review.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-brain"></i></span>
                <span class="name">复习计划</span>
                <span class="hint">算法追踪 · 间隔复习</span>
            </a>

            <!-- 2. 出题灵感 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/State.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-lightbulb"></i></span>
                <span class="name">出题灵感</span>
                <span class="hint">题目构思 · 笔记沉淀</span>
            </a>

            <!-- 3. 做题记录 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Problem.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-list-check"></i></span>
                <span class="name">做题记录</span>
                <span class="hint">题集管理 · 状态追踪</span>
            </a>

            <!-- 4. 专辑记录 -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/Album.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-compact-disc"></i></span>
                <span class="name">专辑记录</span>
                <span class="hint">音乐收藏 · 聆听轨迹</span>
            </a>

            <!-- 5. 子弹笔记 (新增) -->
            <a class="tool-card" href="https://stardr0p123.github.io/bullet-journal-data/BUJO.html" target="_blank" rel="noopener">
                <span class="icon-wrap"><i class="fas fa-bullseye"></i></span>
                <span class="name">子弹笔记</span>
                <span class="hint">四维透视 · 高效管理</span>
            </a>

            <!-- 6. 敬请期待 (右下角) -->
            <div class="tool-card disabled" id="comingSoon">
                <span class="icon-wrap"><i class="fas fa-hourglass-half"></i></span>
                <span class="name">敬请期待</span>
                <span class="hint">更多工具开发中...</span>
            </div>

        </div>

        <!-- 页脚 -->
        <div class="footer">
            <i class="fas fa-arrow-up"></i> 点击卡片快速跳转 <i class="fas fa-arrow-up"></i>
        </div>

    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ================================================================
         鼠标跟随 + 点击涟漪 + Toast 提示
         ================================================================ -->
    <script>
        (function() {
            'use strict';

            // ---- 鼠标跟随 ----
            const body = document.body;
            let timer;

            document.addEventListener('mousemove', function(e) {
                if (timer) cancelAnimationFrame(timer);
                timer = requestAnimationFrame(function() {
                    const x = (e.clientX / window.innerWidth * 100);
                    const y = (e.clientY / window.innerHeight * 100);
                    body.style.setProperty('--mouse-x', x + '%');
                    body.style.setProperty('--mouse-y', y + '%');
                });
            }, { passive: true });

            // ---- 点击涟漪 ----
            document.querySelectorAll('.tool-card:not(.disabled)').forEach(function(card) {
                card.addEventListener('click', function(e) {
                    if (e.button !== 0) return;
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.style.width = '20px';
                    ripple.style.height = '20px';
                    ripple.style.marginLeft = '-10px';
                    ripple.style.marginTop = '-10px';
                    card.appendChild(ripple);
                    setTimeout(function() {
                        if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
                    }, 700);
                });
            });

            // ---- Toast 系统 ----
            function showToast(msg) {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                container.appendChild(t);
                setTimeout(function() {
                    if (t.parentNode) t.parentNode.removeChild(t);
                }, 2500);
            }

            // ---- “敬请期待”点击提示 ----
            document.getElementById('comingSoon').addEventListener('click', function(e) {
                showToast('🚧 敬请期待，即将上线！');
                // 加一点微小的视觉反馈
                const icon = this.querySelector('.icon-wrap');
                icon.style.transform = 'scale(0.9)';
                setTimeout(() => { icon.style.transform = ''; }, 300);
            });

        })();
    </script>

</body>
</html>
