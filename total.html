<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>工具箱 · 底部导航</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 删除了 mouse.min.js 和 $.shuicheMouse 的引用，改用原生粒子 -->
    <style>
        /* ================================================================
           1.  CSS 变量
           ================================================================ */
        :root {
            --primary: #06b6d4;
            --primary-dark: #0e7490;
            --primary-light: #67e8f9;

            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-bg-hover: rgba(255, 255, 255, 0.70);
            --glass-border: rgba(255, 255, 255, 0.20);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            --glass-blur: 24px;

            --text: #0f172a;
            --text-muted: #94a3b8;

            --radius: 18px;
            --radius-sm: 12px;

            --icon-size: 40px;
            --icon-gap: 6px;
            --nav-padding-collapsed: 2px;
            --nav-padding-expanded: 8px 16px;

            --transition-speed: 0.32s;
            --transition-bounce: 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;

            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        /* ================================================================
           2.  全局重置
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            font-size: 15px;
            color: var(--text);
            background: #dce8ef;
            background:
                radial-gradient(ellipse at var(--mouse-x) var(--mouse-y), rgba(6, 182, 212, 0.10) 0%, rgba(56, 189, 248, 0.03) 45%, rgba(15, 23, 42, 0.01) 70%, transparent 100%),
                #dce8ef;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            contain: layout style paint;
        }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.20);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.40);
        }

        /* ================================================================
           3.  主内容区 — 全屏
           ================================================================ */
        .main-content {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            overflow: hidden;
            contain: layout style paint;
            will-change: transform;
        }

        .main-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
            position: relative;
            z-index: 0;
            will-change: transform;
            contain: layout style paint;
        }

        .iframe-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: var(--text-muted);
            font-size: 13px;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.4s ease;
            contain: layout style;
        }
        .iframe-placeholder .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(6, 182, 212, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 10px;
            will-change: transform;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .iframe-placeholder .load-text {
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0.4;
        }
        .iframe-placeholder .load-text i {
            margin-right: 8px;
            color: var(--primary);
            opacity: 0.6;
        }
        .iframe-placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ================================================================
           4.  底部导航栏 — 居中 · 玻璃 · 自适应
           ================================================================ */
        .nav-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: var(--nav-padding-collapsed);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.30);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transition: padding 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.32s ease,
                box-shadow 0.32s ease,
                justify-content 0.32s ease;
            will-change: transform, padding;
            contain: layout style;
            white-space: nowrap;
        }

        .nav-bar.expanded {
            padding: var(--nav-padding-expanded);
            border-radius: var(--radius);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-color: var(--glass-border);
            box-shadow: var(--glass-shadow);
            justify-content: flex-start;
        }

        .nav-list {
            display: flex;
            align-items: center;
            gap: 0;
            list-style: none;
            padding: 0;
            margin: 0;
            contain: layout style;
            transition: gap 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .nav-bar.expanded .nav-list {
            gap: var(--icon-gap);
        }

        .nav-toggle {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.25s ease, border-color 0.25s ease;
            will-change: transform;
            user-select: none;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }
        .nav-toggle:hover {
            background: var(--glass-bg-hover);
            transform: scale(1.06);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border-color: rgba(255, 255, 255, 0.20);
        }
        .nav-toggle:active {
            transform: scale(0.90);
        }
        .nav-toggle .toggle-icon {
            display: inline-block;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }
        .nav-bar.expanded .nav-toggle .toggle-icon {
            transform: rotate(90deg);
        }

        .nav-item {
            flex: 0 0 0;
            width: 0;
            min-width: 0;
            max-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: var(--icon-size);
            border-radius: var(--radius-sm);
            background: transparent;
            cursor: pointer;
            transition: width 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                margin 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.20s ease,
                transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                border-width 0.25s ease;
            will-change: transform, width, margin, opacity;
            user-select: none;
            contain: layout style;
            transform-origin: center center;
            transform: scale(0);
            overflow: visible;
            padding: 0;
        }

        .nav-item.expanded {
            flex: 0 0 var(--icon-size);
            width: var(--icon-size);
            max-width: var(--icon-size);
            margin: 0 4px;
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: visible;
            padding: 0;
        }

        .nav-item.expanded:hover {
            background: var(--glass-bg-hover);
            transform: translateY(-4px) scale(1.08);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            z-index: 3;
        }
        .nav-item.expanded:active {
            transform: scale(0.90) !important;
            transition-duration: 0.08s;
        }

        .nav-item.expanded.active {
            background: rgba(255, 255, 255, 0.45);
            border-color: rgba(6, 182, 212, 0.20);
            box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.08), 0 4px 16px rgba(6, 182, 212, 0.04);
        }

        .nav-item .item-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            font-size: 17px;
            color: #fff;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
            background: var(--item-grad, linear-gradient(135deg, #94a3b8, #64748b));
            transform: scale(0.85);
        }
        .nav-item.expanded .item-icon-wrap {
            transform: scale(1);
        }
        .nav-item.expanded:hover .item-icon-wrap {
            transform: scale(1.06);
        }

        .nav-item .tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) scale(0.92);
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.30s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.2px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }
        .nav-item .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: rgba(15, 23, 42, 0.82);
        }
        .nav-item.expanded:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .nav-item .active-dot {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            transition: transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.30);
        }
        .nav-item.expanded.active .active-dot {
            transform: translateX(-50%) scale(1);
        }

        .nav-meta {
            flex: 0 0 0;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0;
            width: 0;
            margin: 0;
            padding: 0;
            border: none;
            overflow: hidden;
            transition: opacity 0.25s ease 0.05s, width 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                margin 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                padding 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                border 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                flex 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            user-select: none;
            white-space: nowrap;
        }
        .nav-bar.expanded .nav-meta {
            opacity: 0.6;
            width: auto;
            margin-left: 8px;
            padding-left: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.10);
            overflow: visible;
            flex: 0 0 auto;
        }
        .nav-meta .count {
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .nav-meta .reload-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease, transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }
        .nav-meta .reload-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text);
            transform: rotate(60deg);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.50) 0%, rgba(6, 182, 212, 0.08) 50%, transparent 70%);
            transform: scale(0);
            animation: rippleBurst 0.50s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
            z-index: 5;
            will-change: transform, opacity;
        }
        @keyframes rippleBurst {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        @media (max-width: 820px) {
            :root {
                --icon-size: 36px;
                --icon-gap: 4px;
                --nav-padding-collapsed: 2px;
            }
            .nav-bar {
                bottom: 18px;
            }
            .nav-bar.expanded {
                padding: 6px 12px;
                border-radius: 16px;
            }
            .nav-toggle {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
            .nav-item .item-icon-wrap {
                font-size: 15px;
            }
            .nav-item .tooltip {
                font-size: 11px;
                padding: 3px 12px;
                bottom: calc(100% + 10px);
            }
            .nav-meta {
                font-size: 11px;
            }
            .nav-meta .reload-btn {
                font-size: 12px;
            }
            .nav-item.expanded {
                margin: 0 3px;
            }
        }

        @media (max-width: 540px) {
            :root {
                --icon-size: 32px;
                --icon-gap: 3px;
                --nav-padding-collapsed: 2px;
            }
            .nav-bar {
                bottom: 14px;
                padding: 2px 4px;
            }
            .nav-bar.expanded {
                padding: 4px 10px;
                border-radius: 14px;
            }
            .nav-toggle {
                width: 32px;
                height: 32px;
                font-size: 16px;
                border-radius: 10px;
            }
            .nav-item .item-icon-wrap {
                font-size: 13px;
                border-radius: 8px;
            }
            .nav-item .tooltip {
                font-size: 10px;
                padding: 2px 10px;
                bottom: calc(100% + 8px);
            }
            .nav-meta .count {
                display: none;
            }
            .nav-meta .reload-btn {
                font-size: 11px;
            }
            .nav-item.expanded {
                margin: 0 2px;
            }
            .nav-item .active-dot {
                width: 4px;
                height: 4px;
                top: -1px;
            }
        }

        @media (max-width: 400px) {
            :root {
                --icon-size: 28px;
                --nav-padding-collapsed: 1.5px;
            }
            .nav-bar {
                bottom: 12px;
                padding: 1.5px 3px;
                border-radius: 24px;
            }
            .nav-bar.expanded {
                padding: 3px 8px;
                border-radius: 12px;
            }
            .nav-toggle {
                width: 28px;
                height: 28px;
                font-size: 14px;
                border-radius: 8px;
            }
            .nav-item .item-icon-wrap {
                font-size: 11px;
                border-radius: 6px;
            }
            .nav-item.expanded {
                margin: 0 1.5px;
            }
            .nav-item .tooltip {
                font-size: 9px;
                padding: 2px 8px;
                bottom: calc(100% + 6px);
            }
            .nav-meta .reload-btn {
                font-size: 10px;
            }
        }

        @media (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {
            .nav-bar {
                backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
                -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    全屏内容区
    ============================================================ -->
    <main class="main-content" id="mainContent">
        <div class="iframe-placeholder" id="placeholder">
            <div class="spinner"></div>
            <span class="load-text"><i class="fas fa-folder-open"></i> 加载工具…</span>
        </div>
        <iframe id="toolFrame" name="toolFrame" title="工具页面" src=""
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
        loading="lazy"></iframe>
    </main>

    <!-- ============================================================
    底部导航栏
    ============================================================ -->
    <nav class="nav-bar" id="navBar" role="navigation" aria-label="工具导航">
        <ul class="nav-list" id="navList">
            <li class="nav-toggle" id="navToggle" role="button" aria-label="切换导航" tabindex="0">
                <span class="toggle-icon"><i class="fas fa-bars"></i></span>
            </li>
            <!-- 12 个工具由 JS 动态生成 -->
        </ul>
        <div class="nav-meta" id="navMeta">
            <span class="count" id="navCount">1 / 12</span>
            <button class="reload-btn" id="reloadBtn" aria-label="刷新当前工具" title="刷新当前工具">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </nav>

    <!-- ============================================================
    核心脚本
    ============================================================ -->
    <script>
        // ================================================================
        //  工具数据 (12个)
        // ================================================================
        const TOOLS = [{

            url: 'https://stardr0p123.github.io/bullet-journal-data/Cost.html',
            gradient: 'linear-gradient(135deg, #f59e0b 0%, #f97316 100%)'
        }, {

            hint: '音乐收藏 · 聆听轨迹',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Album.html',

            id: 'tool-5',

            hint: '约定借还 · 智能管理',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Promise.html',
            gradient: 'linear-gradient(135deg, #10b981 0%, #06b6d4 100%)'
        }, {
            id: 'tool-6',
            name: '复习计划',
            icon: 'fa-brain',
            hint: '算法追踪 · 间隔复习',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Review.html',
            gradient: 'linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)'
        }, {
            id: 'tool-7',
            name: '做题记录',
            icon: 'fa-list-check',
            hint: '题集管理 · 状态追踪',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Problem.html',
            gradient: 'linear-gradient(135deg, #06b6d4 0%, #67e8f9 100%)'
        }, {
            id: 'tool-8',
            name: '题单管理',
            icon: 'fa-layer-group',
            hint: '多OJ题集 · 批量导入',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Problemset.html',
            gradient: 'linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%)'
        }, {
            id: 'tool-9',
            name: '资源包',
            icon: 'fa-box-open',
            hint: '音色预设 · 链接合集',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Resource.html',
            gradient: 'linear-gradient(135deg, #1e3a5f 0%, #2d5a7a 100%)'
        }, {
            id: 'tool-10',
            name: '子弹笔记',
            icon: 'fa-bullseye',
            hint: '四维透视 · 高效管理',
            url: 'https://stardr0p123.github.io/bullet-journal-data/BUJO.html',
            gradient: 'linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%)'
        }, {
            id: 'tool-11',
            name: '影音娱乐',
            icon: 'fa-film',
            hint: '影视书籍 · 收藏评分',
            url: 'https://stardr0p123.github.io/bullet-journal-data/Entertain.html',
            gradient: 'linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%)'
        }, {
            id: 'tool-12',
            name: '通用记录器',
            icon: 'fa-feather-alt',
            hint: '灵活字段 · 自定义笔记',
            url: 'https://stardr0p123.github.io/bullet-journal-data/General.html',
            gradient: 'linear-gradient(135deg, #94a3b8 0%, #64748b 100%)'
        }];

        // ================================================================
        //  核心逻辑
        // ================================================================
        const frame = document.getElementById('toolFrame');
        const placeholder = document.getElementById('placeholder');
        const navBar = document.getElementById('navBar');
        const navList = document.getElementById('navList');
        const navToggle = document.getElementById('navToggle');
        const navMeta = document.getElementById('navMeta');
        const navCount = document.getElementById('navCount');
        const reloadBtn = document.getElementById('reloadBtn');

        let currentId = null;
        let isFirstLoad = true;
        let isExpanded = false;
        let loadTimeout = null;
        let navItems = [];

        // 提取工具颜色的辅助函数
        function extractToolColors(gradient) {
            const hexMatch = gradient.match(/#[0-9a-f]{6}/gi);
            if (hexMatch && hexMatch.length >= 2) {
                return [hexMatch[0], hexMatch[1]];
            }
            return ['#06b6d4', '#a78bfa'];
        }

        // ----- 渲染导航 -----
        function renderNav() {
            const existing = navList.querySelectorAll('.nav-item');
            existing.forEach(el => el.remove());

            const fragment = document.createDocumentFragment();
            TOOLS.forEach((tool, index) => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.dataset.toolId = tool.id;
                li.dataset.index = index;
                li.setAttribute('role', 'tab');
                li.setAttribute('aria-selected', 'false');

                const iconWrap = document.createElement('span');
                iconWrap.className = 'item-icon-wrap';
                iconWrap.style.setProperty('--item-grad', tool.gradient);
                iconWrap.innerHTML = `<i class="fas ${tool.icon}"></i>`;

                const tip = document.createElement('span');
                tip.className = 'tooltip';
                tip.textContent = tool.name;

                const dot = document.createElement('span');
                dot.className = 'active-dot';

                li.appendChild(iconWrap);
                li.appendChild(tip);
                li.appendChild(dot);

                li.addEventListener('click', (e) => {
                    if (e.button !== 0) return;
                    const id = li.dataset.toolId;
                    switchTool(id);
                    createRipple(e, li);
                });

                li.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const id = li.dataset.toolId;
                    switchTool(id);
                }, { passive: false });

                fragment.appendChild(li);
            });

            const toggleEl = navList.querySelector('.nav-toggle');
            if (toggleEl) {
                navList.insertBefore(fragment, toggleEl.nextSibling);
            } else {
                navList.appendChild(fragment);
            }

            navItems = navList.querySelectorAll('.nav-item');

            if (navItems.length) {
                const first = navItems[0];
                first.classList.add('active');
                first.setAttribute('aria-selected', 'true');
            }

            updateCount();
        }

        // ----- 涟漪 -----
        function createRipple(e, el) {
            const rect = el.getBoundingClientRect();
            const x = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width / 2) - rect.left;
            const y = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height / 2) - rect.top;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.min(rect.width, rect.height) * 0.6;
            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.marginLeft = -(size / 2) + 'px';
            ripple.style.marginTop = -(size / 2) + 'px';
            el.style.position = 'relative';
            el.appendChild(ripple);
            setTimeout(() => { if (ripple.parentNode) ripple.remove(); }, 550);
        }

        // ----- 更新计数 -----
        function updateCount() {
            const idx = currentId ? TOOLS.findIndex(t => t.id === currentId) + 1 : 1;
            navCount.textContent = `${idx} / ${TOOLS.length}`;
        }

        // ----- 切换工具 -----
        function switchTool(toolId) {
            const tool = TOOLS.find(t => t.id === toolId);
            if (!tool) return;

            if (currentId === toolId && !isFirstLoad) {
                reloadCurrent();
                return;
            }

            currentId = toolId;
            isFirstLoad = false;

            navItems.forEach(item => {
                const isActive = item.dataset.toolId === toolId;
                item.classList.toggle('active', isActive);
                item.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            updateCount();

            // ★ 更新粒子颜色
            if (window.updateParticleColors) {
                const colors = extractToolColors(tool.gradient);
                window.updateParticleColors(colors);
            }

            placeholder.classList.remove('hidden');
            clearTimeout(loadTimeout);

            loadTimeout = setTimeout(() => {
                frame.src = tool.url;
            }, 50);
        }

        // ----- iframe 加载完成 -----
        function onIframeLoad() {
            placeholder.classList.add('hidden');
            clearTimeout(loadTimeout);
            try {
                const win = frame.contentWindow;
                if (win) {
                    win.postMessage({ type: 'NAV_LOADED', toolId: currentId, timestamp: Date.now() }, '*');

                    // ★ 同源时，监听 iframe 内部的 mousemove
                    const doc = win.document;
                    if (doc) {
                        // 先移除旧监听防止重复绑定（用新函数替换）
                        // 这里简单处理：每次加载重新绑定，但之前绑定的会保留，可能导致多个监听。
                        // 为了简洁，我们使用一个标志或存储监听器引用，但这里我们采用每次替换的方式。
                        // 更好的做法：在 frame 加载前移除旧的监听，但为了简化，我们使用一次性监听并缓存。
                        // 方法：在 window 上挂载一个监听器引用
                        if (window._iframeMouseListener) {
                            // 移除旧的监听，但需要同一个函数引用，所以我们存储
                            try {
                                const oldDoc = window._iframeDoc;
                                if (oldDoc) {
                                    oldDoc.removeEventListener('mousemove', window._iframeMouseListener);
                                }
                            } catch (e) {}
                        }
                        const listener = function(e) {
                            const rect = frame.getBoundingClientRect();
                            const parentX = rect.left + e.clientX;
                            const parentY = rect.top + e.clientY;
                            if (window.updateMouseFromIframe) {
                                window.updateMouseFromIframe(parentX, parentY);
                            }
                        };
                        doc.addEventListener('mousemove', listener);
                        window._iframeMouseListener = listener;
                        window._iframeDoc = doc;
                    }
                }
            } catch (_) { /* 跨域或其它错误忽略 */ }
        }

        // ----- 子页面消息 -----
        function handleMessage(event) {
            const data = event.data;
            if (!data || typeof data !== 'object') return;
            if (data.type === 'NAV_SWITCH' && data.toolId) {
                const target = TOOLS.find(t => t.id === data.toolId);
                if (target) switchTool(target.id);
            }
            if (data.type === 'NAV_LOG') {
                console.log('[子页面]', data.message);
            }
        }

        // ----- 展开/收起导航 -----
        function toggleNav() {
            isExpanded = !isExpanded;
            navBar.classList.toggle('expanded', isExpanded);

            const items = navList.querySelectorAll('.nav-item');
            const total = items.length;
            const mid = Math.floor(total / 2);

            items.forEach((item, idx) => {
                if (isExpanded) {
                    const dist = Math.abs(idx - mid);
                    const delay = dist * 10;
                    item.style.transitionDelay = delay + 'ms';
                    requestAnimationFrame(() => {
                        item.classList.add('expanded');
                    });
                } else {
                    item.style.transitionDelay = '0ms';
                    item.classList.remove('expanded');
                }
            });

            navToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');

            if (!isExpanded) {
                navMeta.style.opacity = '0';
                navMeta.style.width = '0';
                navMeta.style.marginLeft = '0';
                navMeta.style.paddingLeft = '0';
                navMeta.style.borderLeft = 'none';
                navMeta.style.overflow = 'hidden';
            }
        }

        function openNav() { if (!isExpanded) toggleNav(); }
        function closeNav() { if (isExpanded) toggleNav(); }

        // ----- 刷新当前工具 -----
        function reloadCurrent() {
            if (!frame.src) return;
            placeholder.classList.remove('hidden');
            const src = frame.src;
            frame.src = '';
            clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                frame.src = src;
            }, 30);
            setTimeout(() => {
                placeholder.classList.add('hidden');
            }, 3000);
        }

        // ================================================================
        //  性能：鼠标背景跟随 (节流)
        // ================================================================
        let rafId = null;
        let lastMouseX = -1,
            lastMouseY = -1;
        let mousePending = false;

        function updateBg(x, y) {
            const xPct = (x / window.innerWidth * 100);
            const yPct = (y / window.innerHeight * 100);
            document.body.style.setProperty('--mouse-x', xPct + '%');
            document.body.style.setProperty('--mouse-y', yPct + '%');
        }

        function onMouseMove(e) {
            const x = e.clientX,
                y = e.clientY;
            if (x === lastMouseX && y === lastMouseY) return;
            lastMouseX = x;
            lastMouseY = y;
            if (!mousePending) {
                mousePending = true;
                rafId = requestAnimationFrame(() => {
                    updateBg(lastMouseX, lastMouseY);
                    mousePending = false;
                    rafId = null;
                });
            }
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden && rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
                mousePending = false;
            }
        });

        // ================================================================
        //  鼠标旋涡粒子效果 (原生)
        // ================================================================
        (function() {
            // 1. 创建画布并置顶
            const canvas = document.createElement('canvas');
            canvas.id = 'mouse-vortex-canvas';
            canvas.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
            `;
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // 2. 参数配置 (按用户要求)
            const PARTICLE_COUNT = 30;
            const MIN_RADIUS = 30;
            const MAX_RADIUS = 60;
            const MIN_SPEED = 0.015;
            const MAX_SPEED = 0.06;
            const BASE_EASING = 0.01;
            const SPEED_EASING_FACTOR = 50;

            let currentToolColors = ['#06b6d4', '#a78bfa']; // 默认

            let mouseX = width / 2;
            let mouseY = height / 2;

            // 3. 粒子数组
            let particles = [];

            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const radius = MIN_RADIUS + Math.random() * (MAX_RADIUS - MIN_RADIUS);
                    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
                    const angle = Math.random() * Math.PI * 2;
                    const color = currentToolColors[Math.floor(Math.random() * currentToolColors.length)];
                    const easing = BASE_EASING + speed * speed * SPEED_EASING_FACTOR;

                    const targetX = mouseX + Math.cos(angle) * radius;
                    const targetY = mouseY + Math.sin(angle) * radius;

                    particles.push({
                        radius: radius,
                        speed: speed,
                        angle: angle,
                        color: color,
                        x: targetX,
                        y: targetY,
                        easing: easing,
                    });
                }
            }
            initParticles();

            // 4. 鼠标追踪 (父页面)
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // 5. 供外部调用的更新鼠标位置 (用于 iframe 内)
            window.updateMouseFromIframe = function(clientX, clientY) {
                mouseX = clientX;
                mouseY = clientY;
            };

            // 6. 颜色更新函数 (暴露给外部)
            window.updateParticleColors = function(colors) {
                if (colors && colors.length >= 2) {
                    currentToolColors = colors;
                } else {
                    currentToolColors = ['#06b6d4', '#a78bfa'];
                }
                // 更新每个粒子的颜色 (随机分配)
                particles.forEach(p => {
                    p.color = currentToolColors[Math.floor(Math.random() * currentToolColors.length)];
                });
            };

            // 7. 动画循环
            function animate() {
                ctx.clearRect(0, 0, width, height);
                const particleSize = 2;

                particles.forEach(p => {
                    p.angle += p.speed;
                    const targetX = mouseX + Math.cos(p.angle) * p.radius;
                    const targetY = mouseY + Math.sin(p.angle) * p.radius;
                    p.x += (targetX - p.x) * p.easing;
                    p.y += (targetY - p.y) * p.easing;

                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, particleSize, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                });

                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                // 中心光晕
                const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 30);
                grad.addColorStop(0, 'rgba(6, 182, 212, 0.15)');
                grad.addColorStop(1, 'rgba(6, 182, 212, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 30, 0, Math.PI * 2);
                ctx.fill();

                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', resize);

            console.log('🌀 小粒子旋涡已启动 (半径30~60，尺寸2，缓动随速度变化)');
        })();

        // ================================================================
        //  初始化
        // ================================================================
        function init() {
            renderNav();

            frame.addEventListener('load', onIframeLoad);
            window.addEventListener('message', handleMessage);

            navToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleNav();
            });

            navToggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleNav();
                }
            });

            reloadBtn.addEventListener('click', reloadCurrent);

            document.addEventListener('click', (e) => {
                if (isExpanded && !navBar.contains(e.target)) {
                    closeNav();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isExpanded) closeNav();
                if ((e.key === 'r' || e.key === 'R') && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    reloadCurrent();
                }
            });

            document.addEventListener('mousemove', onMouseMove, { passive: true });

            const first = TOOLS[0];
            if (first) {
                switchTool(first.id);
            }

            setTimeout(() => {
                placeholder.classList.add('hidden');
            }, 5000);

            // 默认收起
            navBar.classList.remove('expanded');
            isExpanded = false;
            navToggle.setAttribute('aria-expanded', 'false');

            navItems.forEach(item => {
                item.classList.remove('expanded');
                item.style.transitionDelay = '0ms';
            });

            navMeta.style.opacity = '0';
            navMeta.style.width = '0';
            navMeta.style.marginLeft = '0';
            navMeta.style.paddingLeft = '0';
            navMeta.style.borderLeft = 'none';
            navMeta.style.overflow = 'hidden';

            console.log('✅ 底部导航工具箱已启动 · 12 个工具 · 点击汉堡展开');
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

        window.__toolNav = {
            switchTool,
            getTools: () => TOOLS,
            getCurrent: () => currentId,
            reload: reloadCurrent,
            toggleNav,
            openNav,
            closeNav,
            isExpanded: () => isExpanded
        };
    </script>
