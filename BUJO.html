            // ================================================================
            //  月度任务
            // ================================================================
            function getCurrentMonthKey() {
                return getMonthKey(currentMonth.getFullYear(), currentMonth.getMonth());
            }

            function setMonthlyType(type, btn) {
                monthlyType = type;
                document.querySelectorAll('#monthlyTypeSelector .type-btn').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');
            }

            function addMonthlyTask() {
                const input = document.getElementById('monthlyInput');
                const text = input.value.trim();
                if (!text) { showToast('请输入内容', 'warning'); return; }
                const items = getMonthlyItems(currentMonth.getFullYear(), currentMonth.getMonth());
                const order = items.length;
                items.push({ id: generateId(), text: text, status: 'todo', type: monthlyType, order: order });
                saveData();
                input.value = '';
                renderMonthly();
                showToast('✅ 已添加', 'success');
            }

            function toggleItemStatus(items, id) {
                const item = items.find(t => t.id === id);
                if (!item || !isTask(item)) return;
                const idx = STATUSES.indexOf(item.status);
                item.status = STATUSES[(idx + 1) % STATUSES.length];
                saveData();
                return true;
            }

            function deleteItem(items, id, key) {
                const filtered = items.filter(t => t.id !== id);
                if (key) { data[key] = filtered; } else { return filtered; }
                saveData();
                return filtered;
            }

            function moveItem(items, id, delta) {
                const idx = items.findIndex(t => t.id === id);
                if (idx === -1) return;
                const newIdx = idx + delta;
                if (newIdx < 0 || newIdx >= items.length) return;
                [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
                items.forEach((t, i) => t.order = i);
                saveData();
            }

            function toggleMonthlyItemStatus(id) {
                const items = getMonthlyItems(currentMonth.getFullYear(), currentMonth.getMonth());
                if (toggleItemStatus(items, id)) renderMonthly();
            }

            function deleteMonthlyItem(id) {
                const key = getCurrentMonthKey();
                const items = getMonthlyItems(currentMonth.getFullYear(), currentMonth.getMonth());
                data.monthlyItems[key] = items.filter(t => t.id !== id);
                saveData();
                renderMonthly();
            }

            function moveMonthlyItem(id, delta) {
                const items = getMonthlyItems(currentMonth.getFullYear(), currentMonth.getMonth());
                moveItem(items, id, delta);
                renderMonthly();
            }

            function renderMonthly() {
                const items = getMonthlyItems(currentMonth.getFullYear(), currentMonth.getMonth());
                const container = document.getElementById('monthlyTaskList');
                document.getElementById('monthlyTaskCount').textContent = items.length;

                if (items.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-calendar-check"></i></div><p>本月还没有内容</p></div>`;
                } else {
                    container.innerHTML = items.map((t, idx) => {
                        const isTaskItem = isTask(t);
                        const iconHtml = getIconHtml(t);
                        const iconClass = getIconClass(t);
                        const textClass = t.status === 'done' ? 'done' : (t.status === 'migrated' ? 'migrated' :
                            (t.status === 'scheduled' ? 'scheduled' : ''));
                        const clickHandler = isTaskItem ? `onclick="toggleMonthlyItemStatus('${t.id}')"` : '';
                        return `
                            <div class="task-item">
                                <button class="task-icon ${iconClass}" ${clickHandler} title="${isTaskItem ? '切换状态' : ''}">
                                    ${iconHtml}
                                </button>
                                <span class="task-text ${textClass}">${escapeHtml(t.text)}</span>
                                <button class="order-btn" onclick="moveMonthlyItem('${t.id}',-1)" title="上移"><i class="fas fa-chevron-up"></i></button>
                                <button class="order-btn" onclick="moveMonthlyItem('${t.id}',1)" title="下移"><i class="fas fa-chevron-down"></i></button>
                                <button class="del-task" onclick="deleteMonthlyItem('${t.id}')" title="删除"><i class="fas fa-times"></i></button>
                            </div>
                        `;
                    }).join('');
                }

                renderCalendar();
                updateExtractSelects();
            }

            // ================================================================
            //  日历
            // ================================================================
            function renderCalendar() {
                const grid = document.getElementById('calendarGrid');
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth();
                const today = getTodayStr();

                document.getElementById('monthLabel').textContent = year + '年' + (month + 1) + '月';

                const firstDay = getFirstDayOfMonth(year, month);
                const daysInMonth = getMonthDays(year, month);
                const daysInPrevMonth = getMonthDays(year, month - 1);

                let html = '';
                const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                weekDays.forEach(d => { html += `<div class="day-label">${d}</div>`; });

                const startOffset = firstDay === 0 ? 6 : firstDay - 1;
                for (let i = startOffset - 1; i >= 0; i--) {
                    html += `<div class="day-cell other-month">${daysInPrevMonth - i}</div>`;
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateKey = formatDateKey(year, month, d);
                    const entry = data.dailyEntries[dateKey];
                    const tasks = entry ? entry.tasks : [];
                    const hasTask = tasks.some(t => isTask(t) && t.status !== 'done');
                    const hasEvent = tasks.some(t => t.type === 'event' && t.status !== 'done');
                    const hasNote = tasks.some(t => t.type === 'note');
                    const allDone = tasks.length > 0 && tasks.every(t => t.status === 'done');
                    const isToday = dateKey === today;

                    let cellClass = 'day-cell';
                    if (isToday) cellClass += ' today';
                    if (allDone && tasks.length > 0) cellClass += ' all-done';
                    else if (hasTask) cellClass += ' has-task';
                    else if (hasEvent) cellClass += ' has-event';
                    else if (hasNote) cellClass += ' has-note';

                    html += `
                            <div class="${cellClass}" data-date="${dateKey}">
                                ${d}
                            </div>
                        `;
                }

                const totalCells = startOffset + daysInMonth;
                const remaining = 42 - totalCells;
                for (let d = 1; d <= remaining; d++) {
                    html += `<div class="day-cell other-month">${d}</div>`;
                }

                grid.innerHTML = html;
            }

            // ================================================================
            //  周视图
            // ================================================================
            function renderWeekly() {
                const start = getWeekStart(currentWeek);
                const year = start.getFullYear();
                const weekNum = getWeekNumber(start);

                document.getElementById('weekLabel').textContent = year + '年 第' + weekNum + '周';

                const noteKey = getWeekKey(year, weekNum);
                document.getElementById('weeklyNote').value = data.weeklyNotes[noteKey] || '';

                const grid = document.getElementById('weekGrid');
                const today = getTodayStr();
                let html = '';

                for (let i = 0; i < 7; i++) {
                    const d = new Date(start);
                    d.setDate(d.getDate() + i);
                    const dateKey = formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
                    const entry = data.dailyEntries[dateKey];
                    const tasks = entry ? entry.tasks : [];
                    const sorted = [...tasks].sort((a, b) => (a.order || 0) - (b.order || 0));
                    const isToday = dateKey === today;

                    html += `
                            <div class="week-day" style="${isToday ? 'border-color:var(--primary);background:rgba(155,138,176,0.06);' : ''}">
                                <div class="wd-label">
                                    ${['一','二','三','四','五','六','日'][i]}
                                    <span class="wd-num">${d.getDate()}</span>
                                </div>
                                <div class="wd-tasks">
                                    ${sorted.slice(0, 5).map(t => {
                                        let icon = getIconHtml(t);
                                        let cls = '';
                                        if (isTask(t)) {
                                            cls = STATUS_CLASSES[t.status] || '';
                                        } else {
                                            cls = TYPE_CLASSES[t.type] || '';
                                        }
                                        return `
                                            <div class="wd-task" title="${escapeHtml(t.text)}">
                                                <span class="wd-icon ${cls}">${icon}</span>
                                                ${escapeHtml(t.text.substring(0, 16))}${t.text.length > 16 ? '…' : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                    ${sorted.length > 5 ? `<div class="wd-task" style="color:var(--text-muted);font-size:9px;">+${sorted.length - 5} 更多</div>` : ''}
                                    ${sorted.length === 0 ? '<div style="font-size:9px;color:var(--text-muted);opacity:0.2;text-align:center;padding:4px 0;">—</div>' : ''}
                                </div>
                            </div>
                        `;
                }
                grid.innerHTML = html;
            }

            function changeWeek(delta) {
                const newDate = new Date(currentWeek);
                newDate.setDate(newDate.getDate() + delta * 7);
                currentWeek = newDate;
                renderWeekly();
            }

            function resetToCurrentWeek() {
                currentWeek = new Date();
                renderWeekly();
            }

            function saveWeeklyNote() {
                const start = getWeekStart(currentWeek);
                const year = start.getFullYear();
                const weekNum = getWeekNumber(start);
                const key = getWeekKey(year, weekNum);
                const note = document.getElementById('weeklyNote').value;
                if (note.trim()) { data.weeklyNotes[key] = note.trim(); } else { delete data.weeklyNotes[key]; }
                saveData();
                showToast('✅ 周备注已保存', 'success');
            }

            // ================================================================
            //  日视图
            // ================================================================
            function setDailyType(type, btn) {
                dailyType = type;
                document.querySelectorAll('#dailyTypeSelector .type-btn').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');

            function renderDaily() {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const dateKey = formatDateKey(year, month, day);

                document.getElementById('dayLabel').textContent = dateKey;
                document.getElementById('dayPicker').value = dateKey;

                const entry = getDailyEntry(year, month, day);
                document.getElementById('dailyNote').value = entry.note || '';

                const tasks = entry.tasks || [];
                const sorted = [...tasks].sort((a, b) => (a.order || 0) - (b.order || 0));
                document.getElementById('dailyTaskCount').textContent = sorted.length;

                const container = document.getElementById('dailyTaskList');
                if (sorted.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>今天还没有内容</p></div>`;
                } else {
                    container.innerHTML = sorted.map(t => {
                        const isTaskItem = isTask(t);
                        const iconHtml = getIconHtml(t);
                        const iconClass = getIconClass(t);
                        const textClass = t.status === 'done' ? 'done' : (t.status === 'migrated' ? 'migrated' :
                            (t.status === 'scheduled' ? 'scheduled' : ''));
                        const clickHandler = isTaskItem ? `onclick="toggleDailyTaskStatus('${t.id}')"` : '';
                        return `
                            <div class="task-item">
                                <button class="task-icon ${iconClass}" ${clickHandler} title="${isTaskItem ? '切换状态' : ''}">
                                    ${iconHtml}
                                </button>
                                <span class="task-text ${textClass}">${escapeHtml(t.text)}</span>
                                <button class="order-btn" onclick="moveDailyTask('${t.id}',-1)" title="上移"><i class="fas fa-chevron-up"></i></button>
                                <button class="order-btn" onclick="moveDailyTask('${t.id}',1)" title="下移"><i class="fas fa-chevron-down"></i></button>
                                <button class="del-task" onclick="deleteDailyTask('${t.id}')" title="删除"><i class="fas fa-times"></i></button>
                            </div>
                        `;
                    }).join('');
                }
            }

            function addDailyTask() {
                const input = document.getElementById('dailyInput');
                const text = input.value.trim();
                if (!text) { showToast('请输入内容', 'warning'); return; }
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                const order = entry.tasks.length;
                entry.tasks.push({ id: generateId(), text: text, status: 'todo', type: dailyType, order: order });
                saveData();
                input.value = '';
                renderDaily();
                showToast('✅ 已添加', 'success');
            }

            function toggleDailyTaskStatus(id) {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                if (toggleItemStatus(entry.tasks, id)) renderDaily();
            }

            function deleteDailyTask(id) {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                entry.tasks = entry.tasks.filter(t => t.id !== id);
                entry.tasks.forEach((t, i) => t.order = i);
                saveData();
                renderDaily();
            }

            function moveDailyTask(id, delta) {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                moveItem(entry.tasks, id, delta);
                renderDaily();
            }

            function saveDailyNote() {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                entry.note = document.getElementById('dailyNote').value.trim() || '';
                saveData();
                showToast('✅ 日志已保存', 'success');
            }

            function changeDay(delta) {
                const newDate = new Date(currentDay);
                newDate.setDate(newDate.getDate() + delta);
                currentDay = newDate;
                renderDaily();
            }

            function jumpToDate(dateStr) {
                if (!dateStr) return;
                const parts = dateStr.split('-').map(Number);
                currentDay = new Date(parts[0], parts[1] - 1, parts[2]);
                renderDaily();
                currentWeek = new Date(currentDay);
                currentMonth = new Date(currentDay);
                renderWeekly();
                renderMonthly();
            }

            function changeMonth(delta) {
                currentMonth.setMonth(currentMonth.getMonth() + delta);
                renderMonthly();
            }

            function resetToCurrentMonth() {
                currentMonth = new Date();
                renderMonthly();
            }

            // ================================================================
            //  左侧面板 — 计划中 & 暂存
            // ================================================================
            function refreshScheduled() {
                renderScheduled();
                showToast('🔄 已刷新计划中列表', 'info');
            }

            function renderScheduled() {
                const container = document.getElementById('scheduledList');
                const scheduled = [];
                Object.keys(data.dailyEntries).forEach(dateKey => {
                    data.dailyEntries[dateKey].tasks.forEach(t => {
                        if (t.status === 'scheduled') scheduled.push({ date: dateKey, task: t });
                    });
                });
                Object.keys(data.monthlyItems).forEach(monthKey => {
                    data.monthlyItems[monthKey].forEach(t => {
                        if (t.status === 'scheduled') scheduled.push({ date: monthKey, task: t });
                    });
                });

                document.getElementById('scheduledCount').textContent = scheduled.length;
                if (scheduled.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>暂无计划中任务</p></div>`;
                } else {
                    scheduled.sort((a, b) => a.date.localeCompare(b.date));
                    container.innerHTML = scheduled.map(s => {
                        const iconHtml = getIconHtml(s.task);
                        const cls = s.task.type === 'event' ? 'type-event' : (s.task.type === 'note' ?
                            'type-note' : '');
                        return `
                            <div class="scheduled-item">
                                <span class="s-month">${s.date}</span>
                                <span class="s-icon ${cls}">${iconHtml}</span>
                                <span class="s-text">${escapeHtml(s.task.text)}</span>
                            </div>
                        `;
                    }).join('');
                }
            }

            // ================================================================
            //  迁移暂存 — 清空暂存已修复（按钮在 temp-toolbar 内，样式完整）
            // ================================================================
            function updateExtractSelects() {
                const fromSel = document.getElementById('extractFromMonth');
                const toSel = document.getElementById('extractToMonth');
                const currentYear = currentMonth.getFullYear();
                const currentMonthNum = currentMonth.getMonth();

                const months = [];
                for (let i = -6; i <= 6; i++) {
                    const d = new Date(currentYear, currentMonthNum + i, 1);
                    months.push({ year: d.getFullYear(), month: d.getMonth(), label: d.getFullYear() + '-' + String(d
                            .getMonth() + 1).padStart(2, '0') });
                }

                const currentVal = fromSel.value;
                fromSel.innerHTML = months.map(m => `<option value="${m.label}">${m.label}</option>`).join('');
                if (months.some(m => m.label === currentVal)) fromSel.value = currentVal;
                else fromSel.value = months[6]?.label || '';

                const currentVal2 = toSel.value;
                toSel.innerHTML = months.map(m => `<option value="${m.label}">${m.label}</option>`).join('');
                if (months.some(m => m.label === currentVal2)) toSel.value = currentVal2;
                else toSel.value = months[7]?.label || months[6]?.label || '';
            }

            function extractMigrations() {
                const fromMonth = document.getElementById('extractFromMonth').value;
                const toMonth = document.getElementById('extractToMonth').value;
                if (!fromMonth || !toMonth) { showToast('请选择有效月份', 'warning'); return; }

                const migrated = [];
                Object.keys(data.dailyEntries).forEach(dateKey => {
                    if (dateKey.startsWith(fromMonth)) {
                        data.dailyEntries[dateKey].tasks.forEach(t => {
                            if (t.status === 'migrated') migrated.push({ ...t, source: dateKey });
                        });
                    }
                });
                if (data.monthlyItems[fromMonth]) {
                    data.monthlyItems[fromMonth].forEach(t => {
                        if (t.status === 'migrated') migrated.push({ ...t, source: fromMonth });
                    });
                }

                if (migrated.length === 0) { showToast('在 ' + fromMonth + ' 中没有找到已迁移的条目', 'warning'); return; }

                const existingIds = new Set(data.tempItems.map(t => t.id));
                let added = 0;
                migrated.forEach(t => {
                    if (!existingIds.has(t.id)) {
                        data.tempItems.push({ ...t, extractedFrom: fromMonth, targetMonth: toMonth,
                            extractedAt: new Date().toISOString() });
                        added++;
                        existingIds.add(t.id);
                    }
                });
                saveData();
                renderTemp();
                showToast(`✅ 已提取 ${added} 项到暂存区（共 ${migrated.length} 项）`, 'success');
            }

            // ===== 渲染暂存容器 =====
            function renderTemp() {
                const container = document.getElementById('tempArea');
                if (!container) {
                    console.warn('tempArea 容器未找到');
                    return;
                }

                if (!data.tempItems || !Array.isArray(data.tempItems)) {
                    data.tempItems = [];
                }

                const items = data.tempItems;
                const countBadge = document.getElementById('tempCount');
                if (countBadge) countBadge.textContent = items.length;

                if (items.length === 0) {
                    container.innerHTML = `<div class="temp-empty">暂无迁移项，使用下方工具提取</div>`;
                    return;
                }

                let html = '';
                for (const t of items) {
                    try {
                        const iconHtml = getIconHtml(t);
                        const cls = t.type === 'event' ? 'type-event' : (t.type === 'note' ? 'type-note' : '');
                        const safeText = escapeHtml(t.text || '(空)');
                        const targetLabel = t.targetMonth || '?';
                        html += `
                            <div class="temp-item" data-id="${t.id}">
                                <span style="font-size:10px;color:var(--text-muted);flex-shrink:0;">${targetLabel}</span>
                                <span class="t-icon ${cls}">${iconHtml}</span>
                                <span class="t-text">${safeText}</span>
                                <button class="t-rm" onclick="removeTempItem('${t.id}')" title="移除"><i class="fas fa-times"></i></button>
                            </div>
                        `;
                    } catch (e) {
                        console.warn('渲染暂存项失败:', t, e);
                        continue;
                    }
                }

                container.innerHTML = html || `<div class="temp-empty">暂存项数据异常，请清空后重新提取</div>`;
            }

            // ===== 移除单个暂存项 =====
            function removeTempItem(id) {
                if (!id) return;
                if (!data.tempItems || !Array.isArray(data.tempItems)) {
                    data.tempItems = [];
                }
                data.tempItems = data.tempItems.filter(t => t.id !== id);
                saveData();
                renderTemp();
                showToast('已移除一项', 'info');
            }

            // ===== 清空所有暂存项 — 按钮样式现已完整 =====
            function clearTemp() {
                if (!data.tempItems || !Array.isArray(data.tempItems)) {
                    data.tempItems = [];
                }

                const count = data.tempItems.length;
                if (count === 0) {
                    showToast('暂存区已经是空的', 'warning');
                    return;
                }

                if (!confirm('确定要清空所有暂存项吗？')) return;

                data.tempItems = [];
                saveData();
                renderTemp();
                const badge = document.getElementById('tempCount');
                if (badge) badge.textContent = '0';
                showToast('🗑️ 已清空暂存区', 'success');
            }

            // ================================================================
            //  Tab 切换 + 滑动条
            // ================================================================
            function updateTabSlider() {
                const wrapper = document.getElementById('tabNavWrapper');
                const slider = document.getElementById('tabSlider');
                const activeBtn = wrapper.querySelector('.tab-btn.active');
                if (!activeBtn || !slider) return;
                const wrapperRect = wrapper.getBoundingClientRect();
                const btnRect = activeBtn.getBoundingClientRect();
                const left = btnRect.left - wrapperRect.left + 4;
                const width = btnRect.width - 8;
                slider.style.transform = `translateX(${left}px)`;
                slider.style.width = width + 'px';
            }

            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');

                document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
                const panel = document.getElementById('panel-' + tab);
                panel.style.display = 'flex';
                panel.style.flexDirection = 'column';
                panel.style.flex = '1';
                panel.style.minHeight = '0';
                panel.style.overflow = 'hidden';

                if (tab === 'yearly') renderYearly();
                else if (tab === 'monthly') renderMonthly();
                else if (tab === 'weekly') renderWeekly();
                else if (tab === 'daily') renderDaily();

                requestAnimationFrame(updateTabSlider);
            }

            // ================================================================
            //  模态框
            // ================================================================
            function showConfirm(title, msg, cb) {
                document.getElementById('confirmTitle').innerHTML = title;
                document.getElementById('confirmMsg').innerHTML = msg;
                document.getElementById('confirmModal').classList.add('show');
                confirmCallback = cb;
                document.getElementById('confirmBtn').onclick = function() {
                    document.getElementById('confirmModal').classList.remove('show');
                    const fn = confirmCallback;
                    confirmCallback = null;
                    if (fn) fn();
                };
            }

            function closeModal() {
                document.getElementById('confirmModal').classList.remove('show');
                confirmCallback = null;
            }

            function closeModalIfOverlay(e) {
                if (e.target === document.getElementById('confirmModal')) closeModal();
            }

            // ================================================================
            //  示例数据
            // ================================================================
            function loadSamples() {
                if (Object.keys(data.dailyEntries).length > 0 || data.yearlyGoals.length > 0) {
                    if (!confirm('将替换当前所有数据，是否继续？')) return;
                }

                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const day = today.getDate();

                data = {
                    yearlyGoals: [
                        { id: generateId(), text: '掌握 3 个新算法框架', completed: false },
                        { id: generateId(), text: '读完 12 本技术书籍', completed: false },
                        { id: generateId(), text: '建立个人知识库', completed: true },
                    ],
                    monthlyItems: {},
                    dailyEntries: {},
                    weeklyNotes: {},
                    tempItems: []
                };

                const monthKey = getMonthKey(year, month);
                data.monthlyItems[monthKey] = [
                    { id: generateId(), text: '完成项目架构设计', status: 'done', type: 'task', order: 0 },
                    { id: generateId(), text: '团队内部技术分享', status: 'todo', type: 'event', order: 1 },
                    { id: generateId(), text: '优化数据库查询性能', status: 'migrated', type: 'task', order: 2 },
                    { id: generateId(), text: '记录团队会议纪要', status: 'todo', type: 'note', order: 3 },
                ];

                const sampleTasks = [
                    { text: '编写单元测试', type: 'task' },
                    { text: '代码审查', type: 'task' },
                    { text: '更新项目文档', type: 'note' },
                    { text: '团队周会', type: 'event' },
                    { text: '修复 Bug #123', type: 'task' },
                    { text: '设计评审', type: 'event' },
                ];
                const statuses = ['todo', 'done', 'done', 'migrated', 'todo', 'scheduled'];

                for (let d = -3; d <= 3; d++) {
                    const dt = new Date(year, month, day + d);
                    const key = formatDateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
                    const entry = { note: '', tasks: [] };
                    const count = Math.floor(Math.random() * 3) + 1;
                    for (let i = 0; i < count && i < sampleTasks.length; i++) {
                        const idx = (d + 3 + i) % sampleTasks.length;
                        entry.tasks.push({
                            id: generateId(),
                            text: sampleTasks[idx].text + (d !== 0 ? ' (' + (d > 0 ? '未来' : '过去') + ')' : ''),
                            status: statuses[(d + 3 + i) % statuses.length],
                            type: sampleTasks[idx].type,
                            order: i
                        });
                    }
                    data.dailyEntries[key] = entry;
                }

                const weekNum = getWeekNumber(today);
                data.weeklyNotes[getWeekKey(year, weekNum)] = '本周重点：完成了核心模块的初步开发。';

                saveData();
                currentMonth = new Date();
                currentWeek = new Date();
                currentDay = new Date();
                switchTab(currentTab);
                renderScheduled();
                renderTemp();
                showToast('✅ 示例数据加载成功！', 'success');
            }

            // ================================================================
            //  导出 / 导入
            // ================================================================
            function exportData() {
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'bullet_journal_' + getTodayStr() + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('✅ 导出成功', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.yearlyGoals || !imported.monthlyItems || !imported.dailyEntries) {
                            throw new Error('数据格式不完整');
                        }
                        data = imported;
                        if (!data.tempItems) data.tempItems = [];
                        saveData();
                        switchTab(currentTab);
                        renderScheduled();
                        renderTemp();
                        showToast('✅ 导入成功！', 'success');
                    } catch (err) {
                        showToast('❌ 导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ================================================================
            //  全量更新
            // ================================================================
            function updateAll() {
                renderScheduled();
                renderTemp();
                if (currentTab === 'yearly') renderYearly();
                else if (currentTab === 'monthly') renderMonthly();
                else if (currentTab === 'weekly') renderWeekly();
                else if (currentTab === 'daily') renderDaily();
                updateExtractSelects();
                setTimeout(updateTabSlider, 50);
            }

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('confirmModal').classList.contains('show')) closeModal();
                    if (githubPanelOpen) toggleGitHubPanel();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    if (document.activeElement?.id === 'dailyNote' || document.activeElement?.id === 'weeklyNote') {
                        e.preventDefault();
                        if (document.activeElement?.id === 'dailyNote') saveDailyNote();
                        else if (document.activeElement?.id === 'weeklyNote') saveWeeklyNote();
                    }
                }
            });

            // ================================================================
            //  初始化
            // ================================================================
            window.addYearlyGoal = addYearlyGoal;
            window.toggleYearlyGoal = toggleYearlyGoal;
            window.deleteYearlyGoal = deleteYearlyGoal;
            window.addMonthlyTask = addMonthlyTask;
            window.toggleMonthlyItemStatus = toggleMonthlyItemStatus;
            window.deleteMonthlyItem = deleteMonthlyItem;
            window.moveMonthlyItem = moveMonthlyItem;
            window.setMonthlyType = setMonthlyType;
            window.changeMonth = changeMonth;
            window.resetToCurrentMonth = resetToCurrentMonth;
            window.changeWeek = changeWeek;
            window.resetToCurrentWeek = resetToCurrentWeek;
            window.saveWeeklyNote = saveWeeklyNote;
            window.addDailyTask = addDailyTask;
            window.toggleDailyTaskStatus = toggleDailyTaskStatus;
            window.deleteDailyTask = deleteDailyTask;
            window.moveDailyTask = moveDailyTask;
            window.setDailyType = setDailyType;
            window.changeDay = changeDay;
            window.jumpToDate = jumpToDate;
            window.saveDailyNote = saveDailyNote;
            window.switchTab = switchTab;
            window.loadSamples = loadSamples;
            window.exportData = exportData;
            window.importData = importData;
            window.extractMigrations = extractMigrations;
            window.removeTempItem = removeTempItem;
            window.clearTemp = clearTemp;
            window.closeModal = closeModal;
            window.closeModalIfOverlay = closeModalIfOverlay;
            window.refreshScheduled = refreshScheduled;

            loadData();
            loadGitHubSettings();

            const now = new Date();
            currentMonth = new Date(now);
            currentWeek = new Date(now);
            currentDay = new Date(now);

            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById('panel-yearly').style.display = 'flex';
            document.getElementById('panel-yearly').style.flexDirection = 'column';
            document.getElementById('panel-yearly').style.flex = '1';
            document.getElementById('panel-yearly').style.minHeight = '0';
            document.getElementById('panel-yearly').style.overflow = 'hidden';

            renderYearly();
            renderScheduled();
            renderTemp();
            updateExtractSelects();
            setTimeout(updateTabSlider, 100);

            console.log('📓 子弹日志 · 四维透视 (清空暂存已修复)');
            console.log('  ✅ 年度目标: ' + data.yearlyGoals.length + ' 个');
            console.log('  ✅ 月度条目: ' + Object.keys(data.monthlyItems).length + ' 个月份');
            console.log('  ✅ 每日记录: ' + Object.keys(data.dailyEntries).length + ' 天');
            console.log('  ✅ 暂存项: ' + data.tempItems.length + ' 个');
            console.log('  ⌨️  Esc 关闭面板 | Ctrl+S 保存笔记');

            window.addEventListener('resize', function() {
                setTimeout(updateTabSlider, 50);
            });

        })();
    </script>

</body>
</html>
