                                <div class="wd-tasks">
                                    ${sorted.slice(0, 5).map(t => `
                                        <div class="wd-task" title="${escapeHtml(t.text)}">
                                            <span class="wd-icon ${TYPE_CLASSES[t.type] || 'type-task'}">${TYPE_SYMBOLS[t.type] || '·'}</span>
                                            ${escapeHtml(t.text.substring(0, 18))}${t.text.length > 18 ? '…' : ''}
                                            ${t.status === 'done' ? '✓' : ''}
                                        </div>
                                    `).join('')}
                                    ${sorted.length > 5 ? `<div class="wd-task" style="color:var(--text-muted);font-size:9px;">+${sorted.length - 5} 更多</div>` : ''}
                                    ${sorted.length === 0 ? '<div style="font-size:9px;color:var(--text-muted);opacity:0.2;text-align:center;padding:4px 0;">—</div>' : ''}
                                </div>
                            </div>
                        `;
                }
                grid.innerHTML = html;
            }

            function changeWeek(delta) {
                const newDate = new Date(currentWeek);
                newDate.setDate(newDate.getDate() + delta * 7);
                currentWeek = newDate;
                renderWeekly();
            }

            function resetToCurrentWeek() {
                currentWeek = new Date();
                renderWeekly();
            }

            function saveWeeklyNote() {
                const start = getWeekStart(currentWeek);
                const year = start.getFullYear();
                const weekNum = getWeekNumber(start);
                const key = getWeekKey(year, weekNum);
                const note = document.getElementById('weeklyNote').value;
                if (note.trim()) {
                    data.weeklyNotes[key] = note.trim();
                } else {
                    delete data.weeklyNotes[key];
                }
                saveData();
                showToast('✅ 周备注已保存', 'success');
            }

            // ================================================================
            //  日视图
            // ================================================================
            function renderDaily() {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const dateKey = formatDateKey(year, month, day);

                document.getElementById('dayLabel').textContent = dateKey;
                document.getElementById('dayPicker').value = dateKey;

                const entry = getDailyEntry(year, month, day);
                document.getElementById('dailyNote').value = entry.note || '';

                const tasks = entry.tasks || [];
                const sorted = [...tasks].sort((a, b) => (a.order || 0) - (b.order || 0));
                document.getElementById('dailyTaskCount').textContent = sorted.length;

                const container = document.getElementById('dailyTaskList');
                if (sorted.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>今天还没有内容</p></div>`;
                } else {
                    container.innerHTML = sorted.map(t => `
                            <div class="task-item">
                                <button class="status-toggle ${STATUS_CLASSES[t.status]}" onclick="toggleDailyTaskStatus('${t.id}')" title="切换状态">
                                    ${STATUS_SYMBOLS[t.status]}
                                </button>
                                <span class="task-type-icon ${TYPE_CLASSES[t.type] || 'type-task'}">${TYPE_SYMBOLS[t.type] || '·'}</span>
                                <span class="task-text ${t.status === 'done' ? 'done' : ''} ${t.status === 'migrated' ? 'migrated' : ''} ${t.status === 'scheduled' ? 'scheduled' : ''}">${escapeHtml(t.text)}</span>
                                <button class="order-btn" onclick="moveDailyTask('${t.id}',-1)" title="上移"><i class="fas fa-chevron-up"></i></button>
                                <button class="order-btn" onclick="moveDailyTask('${t.id}',1)" title="下移"><i class="fas fa-chevron-down"></i></button>
                                <button class="del-task" onclick="deleteDailyTask('${t.id}')" title="删除"><i class="fas fa-times"></i></button>
                            </div>
                        `).join('');
                }
            }

            function addDailyTask() {
                const input = document.getElementById('dailyInput');
                const text = input.value.trim();
                const type = document.getElementById('dailyTypeSelect').value || 'task';
                if (!text) { showToast('请输入内容', 'warning'); return; }

                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                const order = entry.tasks.length;
                entry.tasks.push({ id: generateId(), text: text, status: 'todo', type: type, order: order });
                saveData();
                input.value = '';
                renderDaily();
                showToast('✅ 已添加', 'success');
            }

            function toggleDailyTaskStatus(id) {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                const task = entry.tasks.find(t => t.id === id);
                if (!task) return;
                const idx = STATUSES.indexOf(task.status);
                task.status = STATUSES[(idx + 1) % STATUSES.length];
                saveData();
                renderDaily();
            }

            function deleteDailyTask(id) {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                entry.tasks = entry.tasks.filter(t => t.id !== id);
                entry.tasks.forEach((t, i) => t.order = i);
                saveData();
                renderDaily();
            }

            function moveDailyTask(id, delta) {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                const idx = entry.tasks.findIndex(t => t.id === id);
                if (idx === -1) return;
                const newIdx = idx + delta;
                if (newIdx < 0 || newIdx >= entry.tasks.length) return;
                [entry.tasks[idx], entry.tasks[newIdx]] = [entry.tasks[newIdx], entry.tasks[idx]];
                entry.tasks.forEach((t, i) => t.order = i);
                saveData();
                renderDaily();
            }

            function saveDailyNote() {
                const year = currentDay.getFullYear();
                const month = currentDay.getMonth();
                const day = currentDay.getDate();
                const entry = getDailyEntry(year, month, day);
                entry.note = document.getElementById('dailyNote').value.trim() || '';
                saveData();
                showToast('✅ 日志已保存', 'success');
            }

            function changeDay(delta) {
                const newDate = new Date(currentDay);
                newDate.setDate(newDate.getDate() + delta);
                currentDay = newDate;
                renderDaily();
            }

            function jumpToDate(dateStr) {
                if (!dateStr) return;
                const parts = dateStr.split('-').map(Number);
                currentDay = new Date(parts[0], parts[1] - 1, parts[2]);
                renderDaily();
                currentWeek = new Date(currentDay);
                currentMonth = new Date(currentDay);
                renderWeekly();
                renderMonthly();
            }

            // ================================================================
            //  左侧面板：计划中 & 迁移
            // ================================================================
            function renderScheduled() {
                const container = document.getElementById('scheduledList');
                // 收集所有 scheduled 状态的任务
                const scheduled = [];
                Object.keys(data.dailyEntries).forEach(dateKey => {
                    const entry = data.dailyEntries[dateKey];
                    entry.tasks.forEach(t => {
                        if (t.status === 'scheduled') {
                            scheduled.push({ date: dateKey, task: t });
                        }
                    });
                });
                Object.keys(data.monthlyItems).forEach(monthKey => {
                    const items = data.monthlyItems[monthKey];
                    items.forEach(t => {
                        if (t.status === 'scheduled') {
                            scheduled.push({ date: monthKey, task: t });
                        }
                    });
                });

                document.getElementById('scheduledCount').textContent = scheduled.length;
                if (scheduled.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="icon"><i class="fas fa-inbox"></i></div><p>暂无计划中任务</p></div>`;
                } else {
                    // 按日期排序
                    scheduled.sort((a, b) => a.date.localeCompare(b.date));
                    container.innerHTML = scheduled.map(s => `
                            <div class="scheduled-item">
                                <span class="s-month">${s.date}</span>
                                <span class="s-text">${escapeHtml(s.task.text)}</span>
                                <span style="font-size:10px;color:var(--text-muted);flex-shrink:0;">${TYPE_SYMBOLS[s.task.type] || '·'}</span>
                            </div>
                        `).join('');
                }
            }

            // ================================================================
            //  迁移提取
            // ================================================================
            function updateExtractSelects() {
                const fromSel = document.getElementById('extractFromMonth');
                const toSel = document.getElementById('extractToMonth');
                const currentYear = currentMonth.getFullYear();
                const currentMonthNum = currentMonth.getMonth();

                // 生成月份选项：当前月 ± 6 个月
                const months = [];
                for (let i = -6; i <= 6; i++) {
                    const d = new Date(currentYear, currentMonthNum + i, 1);
                    months.push({ year: d.getFullYear(), month: d.getMonth(), label: d.getFullYear() + '-' + String(d
                            .getMonth() + 1).padStart(2, '0') });
                }

                const currentVal = fromSel.value;
                fromSel.innerHTML = months.map(m =>
                    `<option value="${m.label}">${m.label}</option>`
                ).join('');
                if (months.some(m => m.label === currentVal)) fromSel.value = currentVal;
                else fromSel.value = months[6]?.label || '';

                const currentVal2 = toSel.value;
                toSel.innerHTML = months.map(m =>
                    `<option value="${m.label}">${m.label}</option>`
                ).join('');
                if (months.some(m => m.label === currentVal2)) toSel.value = currentVal2;
                else toSel.value = months[7]?.label || months[6]?.label || '';
            }

            function extractMigrations() {
                const fromMonth = document.getElementById('extractFromMonth').value;
                const toMonth = document.getElementById('extractToMonth').value;

                if (!fromMonth || !toMonth) { showToast('请选择有效月份', 'warning'); return; }

                // 从 fromMonth 中找所有 migrated 状态的任务
                const migrated = [];
                // 检查 dailyEntries
                Object.keys(data.dailyEntries).forEach(dateKey => {
                    if (dateKey.startsWith(fromMonth)) {
                        const entry = data.dailyEntries[dateKey];
                        entry.tasks.forEach(t => {
                            if (t.status === 'migrated') {
                                migrated.push({ ...t, source: dateKey });
                            }
                        });
                    }
                });
                // 检查 monthlyItems
                if (data.monthlyItems[fromMonth]) {
                    data.monthlyItems[fromMonth].forEach(t => {
                        if (t.status === 'migrated') {
                            migrated.push({ ...t, source: fromMonth });
                        }
                    });
                }

                if (migrated.length === 0) {
                    showToast('在 ' + fromMonth + ' 中没有找到已迁移的条目', 'warning');
                    return;
                }

                // 添加到 temp
                const existingIds = new Set(data.tempItems.map(t => t.id));
                let added = 0;
                migrated.forEach(t => {
                    if (!existingIds.has(t.id)) {
                        data.tempItems.push({
                            ...t,
                            extractedFrom: fromMonth,
                            targetMonth: toMonth,
                            extractedAt: new Date().toISOString()
                        });
                        added++;
                        existingIds.add(t.id);
                    }
                });

                saveData();
                renderTemp();
                showToast(`✅ 已提取 ${added} 项到暂存区（共 ${migrated.length} 项）`, 'success');
            }

            function renderTemp() {
                const container = document.getElementById('tempArea');
                document.getElementById('tempCount').textContent = data.tempItems.length;

                if (data.tempItems.length === 0) {
                    container.innerHTML = `<div class="temp-empty">暂无迁移项，使用下方工具提取</div>`;
                } else {
                    container.innerHTML = data.tempItems.map(t => `
                            <div class="temp-item">
                                <span style="font-size:10px;color:var(--text-muted);flex-shrink:0;">${t.targetMonth || '?'}</span>
                                <span class="t-text">${escapeHtml(t.text)}</span>
                                <span style="font-size:10px;color:var(--text-muted);flex-shrink:0;">${TYPE_SYMBOLS[t.type] || '·'}</span>
                                <button class="t-rm" onclick="removeTempItem('${t.id}')" title="移除"><i class="fas fa-times"></i></button>
                            </div>
                        `).join('');
                }
            }

            function removeTempItem(id) {
                data.tempItems = data.tempItems.filter(t => t.id !== id);
                saveData();
                renderTemp();
            }

            function clearTemp() {
                if (data.tempItems.length === 0) return;
                if (confirm('清空所有暂存项？')) {
                    data.tempItems = [];
                    saveData();
                    renderTemp();
                    showToast('已清空暂存区', 'info');
                }
            }

            // ================================================================
            //  选项卡切换
            // ================================================================
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');

                document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
                const panel = document.getElementById('panel-' + tab);
                panel.style.display = 'flex';
                panel.style.flexDirection = 'column';
                panel.style.flex = '1';
                panel.style.minHeight = '0';
                panel.style.overflow = 'hidden';

                if (tab === 'yearly') renderYearly();
                else if (tab === 'monthly') renderMonthly();
                else if (tab === 'weekly') renderWeekly();
                else if (tab === 'daily') renderDaily();
            }

            // ================================================================
            //  示例数据
            // ================================================================
            function loadSamples() {
                if (Object.keys(data.dailyEntries).length > 0 || data.yearlyGoals.length > 0) {
                    if (!confirm('将替换当前所有数据，是否继续？')) return;
                }

                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const day = today.getDate();

                data = {
                    yearlyGoals: [
                        { id: generateId(), text: '掌握 3 个新算法框架', completed: false },
                        { id: generateId(), text: '读完 12 本技术书籍', completed: false },
                        { id: generateId(), text: '建立个人知识库', completed: true },
                    ],
                    monthlyItems: {},
                    dailyEntries: {},
                    weeklyNotes: {},
                    tempItems: []
                };

                // 月度条目
                const monthKey = getMonthKey(year, month);
                data.monthlyItems[monthKey] = [
                    { id: generateId(), text: '完成项目架构设计', status: 'done', type: 'task', order: 0 },
                    { id: generateId(), text: '团队内部技术分享', status: 'todo', type: 'event', order: 1 },
                    { id: generateId(), text: '优化数据库查询性能', status: 'migrated', type: 'task', order: 2 },
                    { id: generateId(), text: '记录团队会议纪要', status: 'todo', type: 'note', order: 3 },
                ];

                // 每日条目
                const sampleTasks = [
                    { text: '编写单元测试', type: 'task' },
                    { text: '代码审查', type: 'task' },
                    { text: '更新项目文档', type: 'note' },
                    { text: '团队周会', type: 'event' },
                    { text: '修复 Bug #123', type: 'task' },
                    { text: '设计评审', type: 'event' },
                ];
                const statuses = ['todo', 'done', 'done', 'migrated', 'todo', 'scheduled'];

                for (let d = -3; d <= 3; d++) {
                    const dt = new Date(year, month, day + d);
                    const key = formatDateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
                    const entry = { note: '', tasks: [] };
                    const count = Math.floor(Math.random() * 3) + 1;
                    for (let i = 0; i < count && i < sampleTasks.length; i++) {
                        const idx = (d + 3 + i) % sampleTasks.length;
                        entry.tasks.push({
                            id: generateId(),
                            text: sampleTasks[idx].text + (d !== 0 ? ' (' + (d > 0 ? '未来' : '过去') + ')' : ''),
                            status: statuses[(d + 3 + i) % statuses.length],
                            type: sampleTasks[idx].type,
                            order: i
                        });
                    }
                    data.dailyEntries[key] = entry;
                }

                // 周备注
                const weekNum = getWeekNumber(today);
                data.weeklyNotes[getWeekKey(year, weekNum)] = '本周重点：完成了核心模块的初步开发。';

                saveData();
                currentMonth = new Date();
                currentWeek = new Date();
                currentDay = new Date();
                switchTab(currentTab);
                renderScheduled();
                renderTemp();
                showToast('✅ 示例数据加载成功！', 'success');
            }

            // ================================================================
            //  导出 / 导入
            // ================================================================
            function exportData() {
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'bullet_journal_' + getTodayStr() + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('✅ 导出成功', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.yearlyGoals || !imported.monthlyItems || !imported.dailyEntries) {
                            throw new Error('数据格式不完整');
                        }
                        data = imported;
                        if (!data.tempItems) data.tempItems = [];
                        saveData();
                        switchTab(currentTab);
                        renderScheduled();
                        renderTemp();
                        showToast('✅ 导入成功！', 'success');
                    } catch (err) {
                        showToast('❌ 导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ================================================================
            //  全量更新
            // ================================================================
            function updateAll() {
                renderScheduled();
                renderTemp();
                if (currentTab === 'yearly') renderYearly();
                else if (currentTab === 'monthly') renderMonthly();
                else if (currentTab === 'weekly') renderWeekly();
                else if (currentTab === 'daily') renderDaily();
                updateExtractSelects();
            }

            // ================================================================
            //  初始化 & 全局暴露
            // ================================================================
            window.addYearlyGoal = addYearlyGoal;
            window.toggleYearlyGoal = toggleYearlyGoal;
            window.deleteYearlyGoal = deleteYearlyGoal;
            window.addMonthlyTask = addMonthlyTask;
            window.toggleMonthlyItemStatus = toggleMonthlyItemStatus;
            window.deleteMonthlyItem = deleteMonthlyItem;
            window.moveMonthlyItem = moveMonthlyItem;
            window.changeMonth = changeMonth;
            window.resetToCurrentMonth = resetToCurrentMonth;
            window.changeWeek = changeWeek;
            window.resetToCurrentWeek = resetToCurrentWeek;
            window.saveWeeklyNote = saveWeeklyNote;
            window.addDailyTask = addDailyTask;
            window.toggleDailyTaskStatus = toggleDailyTaskStatus;
            window.deleteDailyTask = deleteDailyTask;
            window.moveDailyTask = moveDailyTask;
            window.changeDay = changeDay;
            window.jumpToDate = jumpToDate;
            window.saveDailyNote = saveDailyNote;
            window.switchTab = switchTab;
            window.loadSamples = loadSamples;
            window.exportData = exportData;
            window.importData = importData;
            window.extractMigrations = extractMigrations;
            window.removeTempItem = removeTempItem;
            window.clearTemp = clearTemp;

            loadData();
            // 重置日期到今日
            const now = new Date();
            currentMonth = new Date(now);
            currentWeek = new Date(now);
            currentDay = new Date(now);
            switchTab('yearly');
            renderScheduled();
            renderTemp();
            updateExtractSelects();

            // 点击外部关闭 tooltip
            document.addEventListener('click', function() {
                hideDayTooltip();
            });

            console.log('📓 子弹日志 · 四维透视 (增强版)');
            console.log('  ✅ 年度目标: ' + data.yearlyGoals.length + ' 个');
            console.log('  ✅ 月度条目: ' + Object.keys(data.monthlyItems).length + ' 个月份');
            console.log('  ✅ 每日记录: ' + Object.keys(data.dailyEntries).length + ' 天');
            console.log('  ✅ 暂存项: ' + data.tempItems.length + ' 个');
            console.log('  ⌨️  点击「示例数据」快速体验');

        })();
    </script>

</body>
</html>
