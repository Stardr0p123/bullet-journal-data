                                            </div>
                                            <div class="p-info">
                                                <div class="p-name ${isParDone ? 'done-text' : ''}">${escapeHtml(par.name)}</div>
                                                <div class="p-meta">
                                                    <span class="p-time"><i class="far fa-clock"></i> <span class="time-value">${timeDisplay}</span></span>
                                                    ${par.completedAt ? `<span class="p-time"><i class="far fa-check-circle"></i> ${formatDate(par.completedAt)}</span>` : ''}
                                                    ${noteDisplay ? `
                                                        <span class="p-note" onclick="window.openEditParallel('${seq.id}','${par.id}')" title="点击编辑心得">
                                                            <i class="fas fa-quote-right"></i> ${escapeHtml(noteDisplay)}
                                                        </span>
                                                    ` : ''}
                                                </div>
                                            </div>
                                            <div class="p-actions">
                                                <button class="edit-parallel" onclick="window.openEditParallel('${seq.id}','${par.id}')" title="编辑"><i class="fas fa-pen"></i></button>
                                                <button class="del-parallel" onclick="window.deleteParallelTask('${seq.id}','${par.id}')" title="删除"><i class="fas fa-trash-alt"></i></button>
                                            </div>
                                        </div>
                                    `;
                            }).join('');
                        }

                        const lockClass = isLocked ? 'locked' : '';

                        return `
                                <div class="seq-task ${isCompleted ? 'completed' : ''} ${lockClass}">
                                    <div class="seq-header" onclick="window.toggleSequentialTask('${seq.id}')">
                                        <span class="seq-arrow ${isExpanded ? 'expanded' : ''}"><i class="fas fa-chevron-right"></i></span>
                                        <span class="seq-status ${isCompleted ? 'done' : ''}"></span>
                                        <span class="seq-name ${isCompleted ? 'done-text' : ''}">${escapeHtml(seq.name)}</span>
                                        <span class="seq-progress">${parDone}/${parCount}</span>
                                        <div class="seq-actions">
                                            <button class="del-seq" onclick="event.stopPropagation();window.deleteSequentialTask('${seq.id}')" title="删除"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                    <div class="parallel-container ${isExpanded ? 'open' : ''}">
                                        <div class="parallel-list">
                                            ${parHtml}
                                        </div>
                                        <div class="add-parallel-area">
                                            <input type="text" id="parallelInput_${seq.id}" placeholder="添加子任务..." onkeydown="if(event.key==='Enter')window.addParallelTask('${seq.id}')" />
                                            <button class="btn-sm small" onclick="window.addParallelTask('${seq.id}')"><i class="fas fa-plus"></i> 添加</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                    }).join('');
                }

                container.innerHTML = `
                        <div class="detail-header">
                            <div class="dh-left">
                                <div class="dh-name">${escapeHtml(project.name)}</div>
                                <div class="dh-meta">
                                    <span><i class="far fa-calendar-alt"></i> ${formatDate(project.createdAt)}</span>
                                    <span><i class="fas fa-layer-group"></i> ${project.sequentialTasks.length} 阶段</span>
                                    <span><i class="fas fa-list-ul"></i> ${totalParallel} 任务</span>
                                    <span><i class="fas fa-check-circle" style="color:var(--success);"></i> ${doneParallel} 已完成</span>
                                    <span><i class="fas fa-chart-line"></i> ${percent}%</span>
                                </div>
                            </div>
                            <div class="dh-actions">
                                <button class="btn-sm ghost" onclick="window.deleteProject('${project.id}')" style="color:var(--danger);border-color:rgba(196,122,106,0.15);">
                                    <i class="fas fa-trash-alt"></i> 删除项目
                                </button>
                            </div>
                        </div>
                        <div class="sequential-container">
                            ${seqHtml}
                        </div>
                        <div class="add-seq-area">
                            <input type="text" id="seqNameInput" placeholder="添加阶段..." onkeydown="if(event.key==='Enter')window.addSequentialTask()" />
                            <button class="btn-sm" onclick="window.addSequentialTask()"><i class="fas fa-plus"></i> 添加</button>
                        </div>
                    `;
            }

            // ================================================================
            //  导出 / 导入 / 清空
            // ================================================================
            function exportData() {
                const exportData = {
                    projects: data.projects,
                    currentProjectId: data.currentProjectId,
                    expandedSeqs: expandedSeqs,
                };
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '项目进度_' + new Date().toISOString().slice(0, 10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
                showToast('导出成功！', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.projects || !Array.isArray(imported.projects)) throw new Error('格式错误');
                        if (!confirm('将替换当前所有数据，是否继续？')) return;
                        data.projects = imported.projects;
                        data.currentProjectId = imported.currentProjectId || (data.projects.length > 0 ? data
                            .projects[0].id : null);
                        expandedSeqs = imported.expandedSeqs || {};
                        if (!data.currentProjectId || !data.projects.some(p => p.id === data.currentProjectId)) {
                            data.currentProjectId = data.projects.length > 0 ? data.projects[0].id : null;
                        }
                        saveData();
                        renderAll();
                        showToast('成功导入！', 'success');
                    } catch (err) {
                        showToast('导入失败：' + err.message, 'warning');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            function confirmClearAll() {
                if (data.projects.length === 0) { showToast('没有数据可清空', 'warning'); return; }
                showConfirm('清空所有数据', '确定要 <strong style="color:#c47a6a;">清空所有</strong> 项目数据吗？<br><span style="font-size:11px;color:var(--text-muted);">建议先导出备份</span>', function() {
                    data.projects = [];
                    data.currentProjectId = null;
                    expandedSeqs = {};
                    saveData();
                    renderAll();
                    showToast('已清空所有数据', 'info');
                });
            }

            // ================================================================
            //  背景鼠标跟随
            // ================================================================
            const body = document.body;
            document.addEventListener('mousemove', function(e) {
                const x = e.clientX / window.innerWidth * 100;
                const y = e.clientY / window.innerHeight * 100;
                body.style.setProperty('--mouse-x', x + '%');
                body.style.setProperty('--mouse-y', y + '%');
            });

            // ================================================================
            //  键盘快捷键
            // ================================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('parallelModal').classList.contains('show')) closeModal(
                        'parallelModal');
                    if (document.getElementById('confirmModal').classList.contains('show')) closeModal(
                        'confirmModal');
                    if (githubPanelOpen) toggleGitHubPanel();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    if (document.getElementById('parallelModal').classList.contains('show')) {
                        e.preventDefault();
                        saveParallelEdit();
                    }
                }
            });

            // ================================================================
            //  绑定 GitHub 和浮动按钮事件
            // ================================================================
            document.getElementById('openGitHubBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('githubToggleBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('closeGitHubPanelBtn').addEventListener('click', toggleGitHubPanel);
            document.getElementById('uploadToGitBtn').addEventListener('click', uploadToGit);
            document.getElementById('importFromGitBtn').addEventListener('click', importFromGit);
            document.getElementById('linkToGitBtn').addEventListener('click', openGitHubRepo);

            // ================================================================
            //  全局暴露
            // ================================================================
            window.addProject = addProject;
            window.deleteProject = deleteProject;
            window.selectProject = selectProject;
            window.addSequentialTask = addSequentialTask;
            window.toggleSequentialTask = toggleSequentialTask;
            window.deleteSequentialTask = deleteSequentialTask;
            window.addParallelTask = addParallelTask;
            window.toggleParallelTask = toggleParallelTask;
            window.openEditParallel = openEditParallel;
            window.deleteParallelTask = deleteParallelTask;
            window.saveParallelEdit = saveParallelEdit;
            window.showConfirm = showConfirm;
            window.closeModal = closeModal;
            window.exportData = exportData;
            window.importData = importData;
            window.confirmClearAll = confirmClearAll;
            window.toggleGitHubPanel = toggleGitHubPanel;

            // ================================================================
            //  启动
            // ================================================================
            loadData();
            loadGitHubSettings();

            console.log('📊 项目进度 · 链式追踪 (最终修复版)');
            console.log('  📋 已加载 ' + data.projects.length + ' 个项目');
            console.log('  🔗 阶段锁定仅影响勾选，其他操作不受限');
            console.log('  💾 数据保存到 /data/project_tracker.json');
            console.log('  ⌨️  Ctrl+S 保存 | Esc 关闭弹窗');

        })();
    </script>

</body>
</html>
